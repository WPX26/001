<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E89020">
  <link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息界面原型设计</title>
<style>  /* ===== 屏宽等比缩放基准（王总 2026-08-13）：1rem = 屏宽/375 px，元素长宽只与屏宽成比例，与屏高无关 ===== */
  html { font-size: 0.2667vw; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #F4E8D6 0%, #EBC9A0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20rem;
    overflow-x: hidden;
  }

  .container {
    display: flex;
    gap: 40rem;
    max-width: 100vw; width: 100vw; height: 100vh; margin: 0;
    width: 100%;
    align-items: center;
    justify-content: center;
  }

  /* ========== 左侧手机预览 ========== */
  .phone-wrapper { display: flex; flex-direction: column; align-items: center; }

  .phone-frame {
    width: 100vw;
    height: 100vh;
    background: #F0E4CE;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    position: relative;
  }

  .phone-frame::before {
    display: none;
    content: '';
    position: absolute;
    top: 14rem; left: 50%;
    transform: translateX(-50%);
    width: 120rem; height: 28rem;
    background: #1C0F08;
    border-radius: 0 0 18rem 18rem;
    z-index: 10;
  }

  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
  }

  /* 状态栏 */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14rem 20rem 6rem;
    color: #F5DFC0;
    font-size: 13rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  .status-icons { display: flex; gap: 5rem; align-items: center; }
  .status-icons svg { width: 16rem; height: 11rem; }

  /* 页面头部 */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8rem 16rem 12rem;
    flex-shrink: 0;
  }
  .page-title {
    font-size: 20rem;
    font-weight: 700;
    color: #F5DFC0;
    letter-spacing: 0.5rem;
  }
  .page-title-sub {
    font-size: 11rem;
    color: rgba(245, 223, 192, 0.6);
    margin-top: 2rem;
  }
  .header-actions { display: flex; gap: 8rem; }
  .header-btn {
    width: 34rem; height: 34rem;
    background: rgba(28, 15, 8, 0.5);
    border: 1rem solid rgba(212, 165, 116, 0.3);
    border-radius: 10rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2rem 6rem rgba(28, 15, 8, 0.08);
  }
  .header-btn:hover { transform: translateY(-1rem); }
  .header-btn svg { width: 16rem; height: 16rem; color: rgba(245, 223, 192, 0.85); }

  /* 分类标签栏 */
  .category-tabs {
    display: flex;
    gap: 6rem;
    padding: 0 16rem 12rem;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .category-tabs::-webkit-scrollbar { display: none; }
  .category-tab {
    padding: 6rem 14rem;
    border-radius: 16rem;
    background: rgba(240, 160, 64, 0.15);
    border: 1rem solid rgba(212, 165, 116, 0.3);
    font-size: 12rem;
    color: rgba(245, 223, 192, 0.5);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    font-weight: 500;
  }
  .category-tab:hover { background: rgba(240, 160, 64, 0.08); }
  .category-tab.active {
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    color: white;
    border-color: transparent;
    box-shadow: 0 3rem 10rem rgba(232, 144, 32, 0.4), 0 0 18rem rgba(232, 144, 32, 0.45);
  }
  .category-tab .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 14rem;
    height: 14rem;
    background: #E85D3C;
    color: white;
    font-size: 9rem;
    border-radius: 7rem;
    padding: 0 4rem;
    margin-left: 4rem;
    font-weight: 600;
  }
  .category-tab.active .badge {
    background: rgba(245, 223, 192, 0.3);
  }

  /* 消息列表区域 */
  .message-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 16rem 72rem;
  }
  .message-list::-webkit-scrollbar { width: 3rem; }
  .message-list::-webkit-scrollbar-thumb { background: rgba(212, 165, 116, 0.3); border-radius: 2rem; }

  .message-section-title {
    font-size: 11rem;
    font-weight: 600;
    color: rgba(245, 223, 192, 0.6);
    padding: 8rem 4rem 6rem;
    letter-spacing: 0.8rem;
    text-transform: uppercase;
  }

  .message-item {
    display: flex;
    gap: 12rem;
    padding: 12rem;
    background: rgba(28, 15, 8, 0.5);
    border: 1rem solid rgba(212, 165, 116, 0.15);
    border-radius: 14rem;
    margin-bottom: 8rem;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }
  .message-item:hover {
    transform: translateY(-1rem);
    box-shadow: 0 4rem 14rem rgba(28, 15, 8, 0.1);
    border-color: rgba(212, 165, 116, 0.3);
  }
  .message-item:active { transform: scale(0.98); }

  .message-item.unread {
    background: rgba(28, 15, 8, 0.6);
    border-color: rgba(240, 160, 64, 0.3);
  }
  .message-item.unread::before {
    content: '';
    position: absolute;
    left: 8rem;
    top: 50%;
    transform: translateY(-50%);
    width: 6rem;
    height: 6rem;
    border-radius: 50%;
    background: #E89020;
  }

  .msg-avatar {
    width: 44rem;
    height: 44rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20rem;
    font-weight: 700;
    color: white;
    position: relative;
  }
  .msg-avatar.system { background: linear-gradient(135deg, #F0A040, #D4691C); }
  .msg-avatar.like { background: linear-gradient(135deg, #E89020, #B85E3C); }
  .msg-avatar.comment { background: linear-gradient(135deg, #D4691C, #8B4513); }
  .msg-avatar.follow { background: linear-gradient(135deg, #9B7B5A, #6B4423); }
  .msg-avatar.notice { background: linear-gradient(135deg, #F5B870, #E89020); }

  .msg-content {
    flex: 1;
    min-width: 0;
  }
  .msg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3rem;
  }
  .msg-name {
    font-size: 13rem;
    font-weight: 600;
    color: #F5DFC0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .msg-time {
    font-size: 10rem;
    color: rgba(245, 223, 192, 0.6);
    flex-shrink: 0;
    margin-left: 8rem;
  }
  .msg-preview {
    font-size: 12rem;
    color: rgba(245, 223, 192, 0.85);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .msg-preview .highlight { color: #D4691C; font-weight: 500; }

  .msg-thumb {
    width: 42rem;
    height: 42rem;
    border-radius: 8rem;
    flex-shrink: 0;
    background: linear-gradient(135deg, #EBC9A0, #D4A870);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18rem;
    color: rgba(245, 223, 192, 0.85);
  }

  /* 底部导航栏 */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 64rem;
    background: rgba(28, 15, 8, 0.5);
    backdrop-filter: blur(20rem);
    border-top: 1rem solid rgba(212, 165, 116, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 8rem;
    z-index: 20;
    box-shadow: 0 -4rem 20rem rgba(28, 15, 8, 0.08);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
    cursor: pointer;
    padding: 6rem 10rem;
    border-radius: 10rem;
    transition: all 0.2s ease;
    flex: 1;
    max-width: 76rem;
    color: rgba(245, 223, 192, 0.5);
  }
  .nav-item:hover { background: rgba(240, 160, 64, 0.08); }
  .nav-item.active .nav-label { color: #E89020; }
  .nav-item.active svg { color: #E89020; filter: drop-shadow(0 0 6rem rgba(232, 144, 32, 0.8)); }
  .nav-item svg { width: 26rem; height: 26rem; transition: color 0.2s; }
  .nav-label { font-size: 11rem; transition: color 0.2s; }

  .nav-center {
    position: relative;
    width: 60rem;
    height: 60rem;
    margin-top: -26rem;
    flex-shrink: 0;
  }
  .nav-center-btn {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6rem 20rem rgba(232, 144, 32, 0.55), 0 0 26rem rgba(232, 144, 32, 0.4), inset 0 1rem 0 rgba(255, 233, 184, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    color: white;
  }
  .nav-center-btn:hover { transform: translateY(-2rem); box-shadow: 0 10rem 28rem rgba(232, 144, 32, 0.6); }
  .nav-center-btn:active { transform: translateY(0) scale(0.95); }
  .nav-center-btn svg { width: 28rem; height: 28rem; }

  .home-indicator {
    position: absolute;
    bottom: 4rem; left: 50%;
    transform: translateX(-50%);
    width: 100rem; height: 4rem;
    background: rgba(28, 15, 8, 0.4);
    border-radius: 2rem;
    z-index: 5;
  }

  /* 未读红点 */
  .nav-item .unread-dot {
    position: absolute;
    top: 2rem;
    right: 50%;
    transform: translateX(14rem);
    width: 7rem;
    height: 7rem;
    background: #E85D3C;
    border-radius: 50%;
    border: 1.5rem solid rgba(250, 243, 231, 1);
  }
  .nav-item { position: relative; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 80rem;
    left: 50%;
    transform: translateX(-50%) translateY(20rem);
    background: rgba(28, 15, 8, 0.92);
    color: #FFF5E6;
    padding: 10rem 20rem;
    border-radius: 20rem;
    font-size: 13rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 1000;
    backdrop-filter: blur(10rem);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .empty-state {
    text-align: center;
    padding: 40rem 20rem;
    color: rgba(245, 223, 192, 0.6);
  }
  .empty-state-icon {
    font-size: 40rem;
    margin-bottom: 10rem;
    opacity: 0.5;
  }
  .empty-state-text {
    font-size: 13rem;
    color: rgba(245, 223, 192, 0.6);
  }

  /* ===== 移动端 web-view 全屏适配（URL ?full=1 时生效，不影响 Web 端展示） ===== */
  body.full-embed {
    padding: 0;
    margin: 0;
    overflow: hidden;
  }
  body.full-embed .container { max-width: none; gap: 0; }
  body.full-embed .phone-wrapper { width: 100%; }
  body.full-embed .phone-frame {
    width: 100vw;
    /* --app-h 由 JS 按实际可视高度注入（100vh 在手机浏览器含地址栏动态高度，会留上下空隙） */
    height: var(--app-h, 100vh);
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }
  body.full-embed .phone-frame::before { display: none; }
  body.full-embed .phone-screen { border-radius: 0; }
  body.full-embed .status-bar { display: none; }
  body.full-embed .bottom-nav,
  body.full-embed .home-indicator { display: none; }

  /* 移动端浏览器 App 化：自动全屏但保留 H5 底部导航（手机浏览器无原生 tabBar） */
  body.full-embed.mobile-browser .bottom-nav,
  body.full-embed.mobile-browser .home-indicator { display: flex; }
  /* 底部导航在 phone-screen 内 absolute 贴底，页面高度直接 = 实际可视高度 */
  body.full-embed.mobile-browser .phone-frame { height: var(--app-h, 100vh); }

  /* ===== 私信对话面板（真实接口接入，样式复用 memo-home.html #chatPanel 设计语言：深棕底/橙色渐变/圆角气泡，类名一致） ===== */
  .chat-panel {
    position: absolute;
    inset: 0;
    background: #1C1208;
    border-radius: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    pointer-events: none;
  }
  .chat-panel.show { transform: translateY(0); pointer-events: auto; }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 10rem;
    padding: 14rem 16rem;
    background: linear-gradient(135deg, #2A1810 0%, #3D2818 100%);
    border-bottom: 1rem solid rgba(240, 160, 64, 0.15);
    flex-shrink: 0;
  }
  .chat-back, .chat-close {
    width: 32rem; height: 32rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(245, 223, 192, 0.9);
    cursor: pointer;
    border-radius: 50%;
    transition: background 0.2s;
  }
  .chat-back:hover, .chat-close:hover { background: rgba(240, 160, 64, 0.15); }
  .chat-back svg, .chat-close svg { width: 18rem; height: 18rem; }
  .chat-peer {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10rem;
    min-width: 0;
  }
  .chat-peer-avatar {
    width: 32rem; height: 32rem;
    border-radius: 50%;
    flex-shrink: 0;
    background: linear-gradient(135deg, #F0A040, #D4691C);
    background-size: cover;
    background-position: center;
  }
  .chat-peer-name {
    font-size: 15rem;
    font-weight: 700;
    color: #FAF5EC;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16rem;
    display: flex;
    flex-direction: column;
    gap: 10rem;
    background: #1C1208;
  }
  .chat-messages::-webkit-scrollbar { width: 3rem; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(240, 160, 64, 0.3); border-radius: 2rem; }
  .chat-bubble {
    max-width: 75%;
    padding: 9rem 13rem;
    border-radius: 16rem;
    font-size: 13rem;
    line-height: 1.5;
    word-break: break-word;
    animation: chatBubbleIn 0.25s ease;
  }
  @keyframes chatBubbleIn {
    from { opacity: 0; transform: translateY(6rem); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chat-bubble.peer {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.08);
    color: #FAF5EC;
    border-bottom-left-radius: 4rem;
  }
  .chat-bubble.me {
    align-self: flex-end;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    color: white;
    border-bottom-right-radius: 4rem;
  }
  .chat-time {
    font-size: 10rem;
    color: rgba(245, 223, 192, 0.4);
    text-align: center;
    margin: 4rem 0;
  }
  .chat-input-bar {
    display: flex;
    align-items: center;
    gap: 8rem;
    padding: 10rem 12rem;
    background: rgba(0, 0, 0, 0.3);
    border-top: 1rem solid rgba(240, 160, 64, 0.15);
    flex-shrink: 0;
  }
  .chat-input-bar input {
    flex: 1;
    background: rgba(255, 255, 255, 0.08);
    border: 1rem solid rgba(240, 160, 64, 0.2);
    border-radius: 20rem;
    padding: 9rem 14rem;
    color: #FAF5EC;
    font-size: 13rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .chat-input-bar input::placeholder { color: rgba(245, 223, 192, 0.4); }
  .chat-input-bar input:focus { border-color: rgba(240, 160, 64, 0.6); }
  .chat-input-bar button {
    width: 38rem; height: 38rem;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 3rem 10rem rgba(240, 160, 64, 0.35);
  }
  .chat-input-bar button:hover { transform: translateY(-1rem); box-shadow: 0 5rem 14rem rgba(240, 160, 64, 0.5); }
  .chat-input-bar button:active { transform: scale(0.92); }
  .chat-input-bar button svg { width: 16rem; height: 16rem; }
  .chat-input-bar button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
</style>
<script src="lib/dexie/dexie.js"></script>

<script>
// ===== 移动端 web-view 桥接（不影响 Web 端 UI/功能） =====
// 1) URL 带 token 时写入 localStorage.memo_token 并清理 URL
// 2) URL 带 full=1 时进入全屏嵌入模式（App 内展示）
// 3) 登录/退出事件桥接：postMessage 通知 App 同步登录态
(function () {
  try {
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (token) {
      localStorage.setItem('memo_token', token);
      params.delete('token');
      var qs = params.toString();
      var url = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
      window.history.replaceState({}, '', url);
    }
        // 动态可视高度：手机浏览器地址栏展开/收起会改变可视区，100vh 含地址栏高度导致上下留空隙
    // 用 window.innerHeight 注入 --app-h（dvh 语义），resize/orientationchange 时刷新
    function setVH() {
      var v = window.innerHeight || document.documentElement.clientHeight;
      document.documentElement.style.setProperty('--app-h', v + 'px');
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', function () { setTimeout(setVH, 250); });
    function enterFull(extra) {
      var add = function () {
        document.body.classList.add('full-embed');
        if (extra) document.body.classList.add(extra);
      };
      if (document.body) add();
      else document.addEventListener('DOMContentLoaded', add);
    }
    var isAppWebview = !!(window.uni && uni.postMessage) || (typeof plus !== 'undefined' && plus.android);
    var isPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 600;
    if (params.get('full') === '1' && isPhone) {
      // App web-view 内嵌 / 手机浏览器 full=1：全屏 + 保留 H5 导航（App 壳无 tabBar，导航由网页承担）
      enterFull('mobile-browser');
    } else if (params.get('full') === '1' || isAppWebview) {
      // 桌面 full=1（全屏预览/测试）：全屏无 H5 导航（既有行为不变）
      enterFull();
    } else if (isPhone) {
      // 手机浏览器：自动全屏 App 化，保留 H5 导航（视觉与 App 一致）
      enterFull('mobile-browser');
    }
  } catch (e) {}
})();
</script>

<script>
// 导航 active 兜底：页面加载时强制单一 active（防止任何路径导致多个键亮起）
(function () {
  var tabs = { 'memo-home.html': 'home', 'connect-prototype.html': 'market', 'message-prototype.html': 'message', 'profile-prototype.html': 'profile' };
  var cur = tabs[(location.pathname.split('/').pop() || '')];
  document.querySelectorAll('.nav-item').forEach(function (i) {
    i.classList.toggle('active', !!cur && i.dataset.tab === cur);
  });
})();
</script>

<body>
  <div class="container">
    <!-- ========== 左侧：手机预览 ========== -->
    <div class="phone-wrapper">
      <div class="phone-frame">
        <div class="phone-screen">

          <!-- 状态栏 -->
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
              <svg viewBox="0 0 16 11" fill="currentColor">
                <path d="M1 8h2v3H1zM5 6h2v5H5zM9 3h2v8H9zM13 0h2v11h-2z"/>
              </svg>
              <svg viewBox="0 0 14 11" fill="currentColor">
                <path d="M7 1C4 1 1.5 2 0 3.5l1.5 1.5C2.8 4 4.8 3 7 3s4.2 1 5.5 2L14 3.5C12.5 2 10 1 7 1zm0 3C5.2 4 3.7 4.7 2.5 5.7L4 7.2c.9-.8 2.4-1.5 3-1.5s2.1.7 3 1.5l1.5-1.5C10.3 4.7 8.8 4 7 4zm0 3c-1 0-2 .5-2.5 1.5L7 11l2.5-2.5C9 7.5 8 7 7 7z"/>
              </svg>

<script>

  let currentCategory = 'all';

  // ========== 真实通知对接（已登录 → GET /notifications） ==========
  // 已登录：拉取真实通知渲染（type → 现有分类模板映射），点击标记已读、全部已读、未读数徽章均接真实接口；
  // 未登录/接口失败：回退现有硬编码 messages，页面行为与改造前完全一致
  var realMode = false;          // 是否已切换到真实通知列表
  var realNotifications = null;  // 映射后的通知数组（与 messages 同构）
  var realTotal = 0;             // 后端通知总数
  var realUnreadTotal = -1;      // 后端未读数（-1 表示未拉到）

  // 后端 type → 页面分类（tab 固定为 全部/点赞/评论/关注/通知，reply 归评论、tip/chat 归通知、collect 归点赞）
  var TYPE_CATEGORY = {
    like: 'like', comment: 'comment', reply: 'comment', tip: 'system',
    follow: 'follow', system: 'system', collect: 'like', chat: 'system'
  };
  // 后端 type → 头像模板 class（复用现有 msg-avatar 渐变；打赏用 notice 金色渐变）
  var TYPE_AVATAR_CLASS = {
    like: 'like', comment: 'comment', reply: 'comment', tip: 'notice',
    follow: 'follow', system: 'system', collect: 'like', chat: 'system'
  };
  // 后端 type → 名称模板（actor 缺失时兜底）
  var TYPE_NAME = {
    like: '点赞', comment: '评论', reply: '回复', tip: '打赏',
    follow: '关注', system: '系统通知', collect: '收藏', chat: '私信'
  };

  // 相对时间（刚刚 / X分钟前 / X小时前 / 昨天 / X天前 / 日期）
  function formatRelativeTime(t) {
    if (!t) return '';
    var d = new Date(t);
    if (isNaN(d.getTime())) return '';
    var min = Math.floor((Date.now() - d.getTime()) / 60000);
    if (min < 1) return '刚刚';
    if (min < 60) return min + '分钟前';
    var h = Math.floor(min / 60);
    if (h < 24) return h + '小时前';
    var day = Math.floor(h / 24);
    if (day === 1) return '昨天';
    if (day < 7) return day + '天前';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  // 内容文案：后端 content 为空（comment/reply/tip 类后端不生成正文）时前端按类型模板拼接
  function buildNotificationContent(n) {
    if (n.content) return n.content;
    var who = (n.actor && n.actor.nickname) || '有人';
    switch (n.type) {
      case 'like': return who + ' 赞了你的照片';
      case 'comment': return who + ' 评论了你的照片';
      case 'reply': return who + ' 回复了你的评论';
      case 'tip': return who + ' 打赏了你的照片';
      case 'follow': return who + ' 关注了你';
      case 'collect': return who + ' 收藏了你的照片';
      case 'chat': return who + ' 给你发来新私信';
      default: return who + ' 与你互动';
    }
  }

  // 后端通知 → 页面消息对象（与 messages 同构）
  function mapNotification(n) {
    var actor = n.actor || null;
    var name = (actor && actor.nickname) || TYPE_NAME[n.type] || '系统通知';
    var avatarText = (actor && actor.nickname) ? actor.nickname.charAt(0) : '📢';
    return {
      id: n.id,                       // 字符串（Mongo id），本地模式下为数字
      type: n.type,
      category: TYPE_CATEGORY[n.type] || 'system',
      name: name,
      actorId: (actor && actor.id) || '',   // 私信对话用：对方用户 id（创建/获取会话）
      avatar: avatarText,
      avatarImg: (actor && actor.avatar) || '',
      avatarClass: TYPE_AVATAR_CLASS[n.type] || 'system',
      content: buildNotificationContent(n),
      time: formatRelativeTime(n.createdAt),
      unread: !n.isRead,
      thumb: (n.photo && n.photo.thumbnailUrl) || '',
      thumbImg: (n.photo && n.photo.thumbnailUrl) || ''
    };
  }

  function getMessageSource() {
    return realMode ? realNotifications : messages;
  }

  // 加载真实通知（分页拉全，原型数据量小）
  function loadRealNotifications() {
    if (typeof MemoAPI === 'undefined' || !MemoAPI.isLoggedIn()) return;
    var all = [];
    function loadPage(page) {
      MemoAPI.get('/notifications?page=' + page + '&pageSize=100').then(function (data) {
        if (!data) return;
        all = all.concat(data.list || []);
        realTotal = data.total || all.length;
        if (data.hasMore && page < 20) { loadPage(page + 1); return; }
        realNotifications = all.map(mapNotification);
        realMode = true;
        renderMessages();
        updateBadges();
      }).catch(function (e) {
        console.warn('[notifications] 拉取失败，使用本地消息：', e && e.message);
      });
    }
    loadPage(1);
    // 未读数（子标题"X条未读"）
    MemoAPI.get('/notifications/unread-count').then(function (data) {
      if (data && data.count != null) realUnreadTotal = Number(data.count) || 0;
      if (realMode) updateBadges();
    }).catch(function () { /* 忽略 */ });
  }

  // 单条已读（乐观更新：本地立即置已读，请求失败回滚为未读）
  function markNotificationRead(msg) {
    if (!msg.unread) return;
    msg.unread = false;
    if (realUnreadTotal > 0) realUnreadTotal -= 1;
    renderMessages();
    updateBadges();
    if (typeof MemoAPI === 'undefined' || !MemoAPI.isLoggedIn()) return;
    MemoAPI.put('/notifications/' + encodeURIComponent(msg.id) + '/read').catch(function (e) {
      console.warn('[mark read]', e && e.message);
      msg.unread = true;
      if (realUnreadTotal >= 0) realUnreadTotal += 1;
      renderMessages();
      updateBadges();
    });
  }

  // 渲染消息列表
  function renderMessages() {
    const list = document.getElementById('messageList');
    const source = getMessageSource();
    let filtered = currentCategory === 'all'
      ? source
      : source.filter(m => m.category === currentCategory);

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">暂无此类消息</div></div>`;
      return;
    }

    list.innerHTML = filtered.map(m => {
      const avatarHtml = m.avatarImg
        ? `<img src="${m.avatarImg}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`
        : m.avatar;
      const thumbHtml = m.thumbImg
        ? `<div class="msg-thumb" style="background-image:url('${m.thumbImg}');background-size:cover;background-position:center;"></div>`
        : (m.thumb ? `<div class="msg-thumb">${m.thumb}</div>` : '');
      return `
      <div class="message-item ${m.unread ? 'unread' : ''}" data-id="${m.id}">
        <div class="msg-avatar ${m.avatarClass}">${avatarHtml}</div>
        <div class="msg-content">
          <div class="msg-header">
            <span class="msg-name">${m.name}</span>
            <span class="msg-time">${m.time}</span>
          </div>
          <div class="msg-preview">${m.content}</div>
        </div>
        ${thumbHtml}
      </div>
    `;
    }).join('');

    // 绑定点击事件
    list.querySelectorAll('.message-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = String(item.dataset.id);
        const msg = getMessageSource().find(m => String(m.id) === id);
        if (msg) {
          markNotificationRead(msg);
          // 私信类型（已登录 + 有对方用户 id）→ 打开真实对话；其余/未登录/无 id → 原占位行为
          if (msg.type === 'chat') { openChatConversation(msg); return; }
          showToast('📩 查看与「' + msg.name + '」的对话');
        }
      });
    });
  }

  // 分类标签切换
  document.getElementById('categoryTabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.category-tab');
    if (!tab) return;
    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCategory = tab.dataset.cat;
    renderMessages();
  });

  // 全部已读（真实模式：乐观更新本地 → PUT /notifications/read-all，失败重拉恢复真实状态）
  document.getElementById('markAllReadBtn').addEventListener('click', () => {
    if (realMode && typeof MemoAPI !== 'undefined' && MemoAPI.isLoggedIn()) {
      getMessageSource().forEach(m => m.unread = false);
      realUnreadTotal = 0;
      renderMessages();
      updateBadges();
      MemoAPI.put('/notifications/read-all').catch(function (e) {
        console.warn('[read-all]', e && e.message);
        loadRealNotifications();
      });
      showToast('✓ 已将所有消息标记为已读');
      return;
    }
    messages.forEach(m => m.unread = false);
    renderMessages();
    updateBadges();
    showToast('✓ 已将所有消息标记为已读');
  });

  // 更新徽章（真实模式：本地列表计数 + 后端总数/未读数；本地模式：原有逻辑）
  function updateBadges() {
    const source = getMessageSource();
    const unreadCount = source.filter(m => m.unread).length;
    const tabs = document.querySelectorAll('.category-tab');
    tabs.forEach(tab => {
      const cat = tab.dataset.cat;
      const count = cat === 'all'
        ? unreadCount
        : source.filter(m => m.unread && m.category === cat).length;
      const badge = tab.querySelector('.badge');
      if (count > 0) {
        if (badge) badge.textContent = count;
        else {
          const b = document.createElement('span');
          b.className = 'badge';
          b.textContent = count;
          tab.appendChild(b);
        }
      } else if (badge) {
        badge.remove();
      }
    });
    // 更新副标题（真实模式：未读数优先用后端 unread-count，总数为后端 total）
    const sub = document.querySelector('.page-title-sub');
    if (sub) {
      if (realMode) {
        const total = realTotal || source.length;
        const unread = realUnreadTotal >= 0 ? realUnreadTotal : unreadCount;
        sub.textContent = unread > 0
          ? `${unread}条未读 · 共 ${total} 条`
          : `共 ${total} 条消息`;
      } else {
        sub.textContent = unreadCount > 0
          ? `${unreadCount}条未读 · 共 ${source.length} 条`
          : `共 ${source.length} 条消息`;
      }
    }
  }

  // 设置按钮
  document.getElementById('settingsBtn').addEventListener('click', () => {
    showToast('⚙️ 消息设置');
  });

  // 底部导航
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const tab = item.dataset.tab;
      if (tab === 'home') {
        window.location.href = 'memo-home.html';
        return;
      }
      if (tab === 'market') {
        window.location.href = 'connect-prototype.html';
        return;
      }
      if (tab === 'profile') {
        window.location.href = 'profile-prototype.html';
        return;

      item.classList.add('active');
      showToast('已在消息页面');

  // ========== 系统相机捕获 ==========
  function captureWithSystemCamera() {
    var input = document.createElement('input');
    input.type = 'file';
    input.setAttribute('capture', 'camera');
    input.accept = 'image/*';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function() {
      var file = input.files[0];
      if (!file) { document.body.removeChild(input); return; }
      var getThumbnail = new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var scale = Math.min(200 / img.width, 200 / img.height, 1);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      var getLocation = new Promise(function(resolve, reject) {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000, enableHighAccuracy: true });
        } else { reject(new Error('无定位能力')); }
      });
      Promise.all([getLocation, getThumbnail]).then(function(results) {
        savePhotoToPending(results[0].coords.longitude, results[0].coords.latitude, results[1]);
      }).catch(function() {
        getThumbnail.then(function(thumb) {
          savePhotoToPending(120.3826 + (Math.random() - 0.5) * 0.01, 36.0671 + (Math.random() - 0.5) * 0.01, thumb);
        });
      });
    });
    input.click();
  }
  function savePhotoToPending(lng, lat, thumbnail) {
    var now = new Date();
    var hour = now.getHours();
    var photoData = {
      id: 'photo_' + now.getTime(), color: '#F0A040', likes: 0, tips: 0, liked: false, tipped: false, collected: false, comments: [],
      uploadTime: Math.floor(now.getTime() / 1000),
      timeStr: String(hour).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
      dateStr: now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日',
      hour: hour, lng: +lng.toFixed(6), lat: +lat.toFixed(6), photoDataUrl: thumbnail
    };
    db.pendingPhotos.add(photoData).then(function() {
      var oldInputs = document.querySelectorAll('input[type=file][capture=camera]');
      oldInputs.forEach(function(el) { if (el.parentNode) el.parentNode.removeChild(el); });
      window.location.href = 'memo-home.html';
    });
  }
  // 相机按钮 — 点击一律直接调起系统相机（去掉长按跳转 camera-prototype，避免手机误触跳页）
  (function() {
    var camBtn = document.getElementById('cameraBtn');
    camBtn.addEventListener('click', function(e) { captureWithSystemCamera(); });
  })();

  // Toast
  let toastTimer;
  function showToast(msg) {
    // 王总要求：去掉操作反馈弹窗——仅保留错误/警示类提示（⚠️/失败/错误/无效等）
    if (msg && !/⚠️|失败|错误|无效|不可达|请输入|需为|不能|重复|请稍后|手动/.test(String(msg))) return;
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ========== 私信对话（已登录 → 真实后端，REST 契约 api.md 第 9 章） ==========
  // 点击 chat 类型消息 → 幂等创建/获取会话 → 拉历史 → 乐观发送；
  // 未登录/无 actorId/会话创建失败 → 回退原占位行为（toast）；
  // 错误只 console 提示，绝不弹 UI（与 api.js 约定一致）。
  const chatPanel = document.getElementById('chatPanel');
  const chatBack = document.getElementById('chatBack');
  const chatClose = document.getElementById('chatClose');
  const chatPeerAvatar = document.getElementById('chatPeerAvatar');
  const chatPeerName = document.getElementById('chatPeerName');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');

  let chatConvId = null;   // 当前会话 id（null = 面板不可用）
  let chatBubbles = [];    // 当前会话气泡（时间正序，{mine, text, time}）

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function nowStr() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // ISO 时间 → HH:MM（与 memo-home 时间分隔格式一致）；无效返回 ''
  function toHHMM(t) {
    const d = new Date(t);
    if (isNaN(d.getTime())) return '';
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // 后端消息 → 页面气泡（image/coord 用占位文案，与后端 lastMessage 快照一致）
  function toBubble(m) {
    const me = (MemoAPI.getUser && MemoAPI.getUser()) || null;
    let text;
    if (m.type === 'image') text = '[图片]';
    else if (m.type === 'coord') text = '[位置]';
    else text = m.content || '';
    return { mine: me && String(m.senderId) === String(me.id), text: text, time: toHHMM(m.createdAt) };
  }

  // 渲染气泡（沿用 memo-home：每 6 条插入一次 chat-time 分隔）
  function renderChatMessages(list) {
    chatMessages.innerHTML = (list || []).map((m, i) => {
      const timeTag = (i > 0 && i % 6 === 0)
        ? `<div class="chat-time">${m.time}</div>`
        : '';
      return timeTag + `<div class="chat-bubble ${m.mine ? 'me' : 'peer'}">${escapeHtml(m.text)}</div>`;
    }).join('');
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  /**
   * 打开与私信方的真实对话（已登录时）：
   * POST /chat/conversations 幂等创建/获取 → 打开面板 → GET 历史（正序渲染）→ PUT /read 会话已读
   */
  function openChatConversation(msg) {
    if (typeof MemoAPI === 'undefined' || !MemoAPI.isLoggedIn() || !msg.actorId) {
      showToast('📩 查看与「' + msg.name + '」的对话');   // 原占位行为
      return;
    }
    MemoAPI.post('/chat/conversations', { peerId: msg.actorId }).then(function (conv) {
      if (!conv || !conv.conversationId) throw new Error('会话响应缺少 conversationId');
      chatConvId = conv.conversationId;
      // 打开面板（先清空并置空列表，历史异步填充）
      chatPeerName.textContent = msg.name;
      if (msg.avatarImg) {
        chatPeerAvatar.style.backgroundImage = "url('" + msg.avatarImg + "')";
      } else {
        chatPeerAvatar.style.backgroundImage = '';
        chatPeerAvatar.style.background = 'linear-gradient(135deg, #F0A040, #D4691C)';
      }
      chatBubbles = [];
      renderChatMessages(chatBubbles);
      chatPanel.classList.add('show');
      setTimeout(() => chatInput.focus(), 320);
      // 拉取历史（9.2，before 游标暂不用：原型会话量小）
      MemoAPI.get('/chat/conversations/' + encodeURIComponent(chatConvId) + '/messages?limit=50')
        .then(function (data) {
          chatBubbles = ((data && data.list) || []).slice().reverse().map(toBubble);
          renderChatMessages(chatBubbles);
        })
        .catch(function (e) {
          console.warn('[chat history]', e && e.message);
        });
      // 会话标记已读（9.5；失败仅 console，不打扰）
      MemoAPI.put('/chat/conversations/' + encodeURIComponent(chatConvId) + '/read')
        .catch(function (e) {
          console.warn('[conv read]', e && e.message);
        });
    }).catch(function (e) {
      // 会话创建失败（服务不可达/业务拒绝）→ 回退原占位行为，不打开面板
      console.warn('[chat open]', e && e.message);
      chatConvId = null;
      showToast('📩 查看与「' + msg.name + '」的对话');
    });
  }

  // 发送消息（乐观追加 → POST 9.3；失败回滚气泡并把文字还回输入框）
  function sendChatMessage() {
    const text = chatInput.value.trim();
    if (!text || !chatConvId) return;
    chatInput.value = '';
    const bubble = { mine: true, text: text, time: nowStr() };
    chatBubbles.push(bubble);
    renderChatMessages(chatBubbles);
    chatSend.disabled = true;
    MemoAPI.post('/chat/conversations/' + encodeURIComponent(chatConvId) + '/messages', { type: 'text', content: text })
      .then(function () {
        // 成功：乐观气泡保留（内容与后端一致）
      })
      .catch(function (e) {
        console.warn('[chat send]', e && e.message);
        const idx = chatBubbles.indexOf(bubble);
        if (idx >= 0) chatBubbles.splice(idx, 1);
        chatInput.value = text;   // 失败还回输入框，便于重试
        renderChatMessages(chatBubbles);
      })
      .then(function () {
        chatSend.disabled = false;   // 无论成败恢复可发送
      });
  }

  // 返回（关闭面板，回到消息列表）
  chatBack.addEventListener('click', () => {
    chatPanel.classList.remove('show');
    chatInput.blur();
    chatConvId = null;
  });

  // 关闭
  chatClose.addEventListener('click', () => {
    chatPanel.classList.remove('show');
    chatInput.blur();
    chatConvId = null;
  });

  // 发送
  chatSend.addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); sendChatMessage(); }
  });

  // 初始化：先渲染本地消息（离线兜底），已登录时异步拉取真实通知覆盖
  renderMessages();
  loadRealNotifications();
</script>
</body>
</html>
