<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E89020">
  <link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联机界面原型设计（相机互联 · 手机互联）</title>
<style>  /* ===== 屏宽等比缩放基准（王总 2026-08-13）：1rem = 屏宽/375 px，元素长宽只与屏宽成比例，与屏高无关 ===== */
  html { font-size: 0.2667vw; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #F4E8D6 0%, #EBC9A0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20rem;
    overflow-x: hidden;
  }

  .container {
    display: flex;
    gap: 40rem;
    max-width: 100vw; width: 100vw; height: 100vh; margin: 0;
    width: 100%;
    align-items: center;
    justify-content: center;
  }

  /* ========== 左侧手机预览 ========== */
  .phone-wrapper { display: flex; flex-direction: column; align-items: center; }

  .phone-frame {
    width: 100vw;
    height: 100vh;
    background: #F0E4CE;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    position: relative;
  }

  .phone-frame::before {
    display: none;
    content: '';
    position: absolute;
    top: 14rem; left: 50%;
    transform: translateX(-50%);
    width: 120rem; height: 28rem;
    background: #1C0F08;
    border-radius: 0 0 18rem 18rem;
    z-index: 10;
  }

  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
  }

  /* 状态栏 */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14rem 20rem 6rem;
    color: rgba(245, 223, 192, 0.9);
    font-size: 13rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  .status-icons { display: flex; gap: 5rem; align-items: center; }
  .status-icons svg { width: 14rem; height: 11rem; }

  /* 顶部操作栏：模式切换（相机互联 / 手机互联） */
  .top-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 4rem 16rem 12rem;
    flex-shrink: 0;
  }

  .mode-switch {
    display: flex;
    align-items: center;
    background: rgba(28, 15, 8, 0.5);
    border: 1rem solid rgba(212, 165, 116, 0.15);
    border-radius: 20rem;
    padding: 3rem;
    gap: 2rem;
  }
  .mode-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6rem;
    padding: 7rem 22rem;
    border: none;
    border-radius: 17rem;
    background: transparent;
    color: rgba(245, 223, 192, 0.6);
    font-size: 13rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
  }
  .mode-btn svg { width: 14rem; height: 14rem; }
  .mode-btn.active {
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    color: #fff;
    box-shadow: 0 4rem 14rem rgba(240, 160, 64, 0.45);
  }
  .mode-btn:not(.active):hover { color: #F0A040; }

  /* 滚动内容区 */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0 16rem 72rem;
    -webkit-overflow-scrolling: touch;
  }
  .content::-webkit-scrollbar { width: 3rem; }
  .content::-webkit-scrollbar-thumb { background: rgba(212, 165, 116, 0.3); border-radius: 2rem; }

  /* 连接状态 */
  .connection-status {
    display: flex;
    align-items: center;
    gap: 10rem;
    padding: 14rem 4rem 16rem;
    color: rgba(245, 223, 192, 0.85);
    font-size: 15rem;
    font-weight: 600;
  }
  .connection-status .cam-icon {
    width: 26rem; height: 26rem;
    color: rgba(245, 223, 192, 0.5);
  }
  .connection-status .dot {
    width: 8rem; height: 8rem;
    border-radius: 50%;
    background: rgba(245, 223, 192, 0.3);
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* 功能卡片 */
  .feature-card {
    background: linear-gradient(135deg, rgba(240, 160, 64, 0.12) 0%, rgba(212, 105, 28, 0.08) 100%);
    border: 1rem solid rgba(240, 160, 64, 0.2);
    border-radius: 16rem;
    padding: 18rem;
    margin-bottom: 20rem;
    position: relative;
    overflow: hidden;
  }
  .feature-card::after {
    content: '';
    position: absolute;
    top: -30rem; right: -30rem;
    width: 100rem; height: 100rem;
    background: radial-gradient(circle, rgba(240, 160, 64, 0.25), transparent 70%);
    border-radius: 50%;
  }

  .feature-title {
    font-size: 18rem;
    font-weight: 700;
    color: #F5DFC0;
    margin-bottom: 6rem;
    position: relative;
    z-index: 1;
  }
  .feature-desc {
    font-size: 12rem;
    color: rgba(245, 223, 192, 0.6);
    line-height: 1.6;
    margin-bottom: 14rem;
    position: relative;
    z-index: 1;
  }

  .feature-illustration {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 10rem;
    position: relative;
    z-index: 1;
  }

  .illus-phone, .illus-camera {
    width: 80rem; height: 80rem;
    border-radius: 12rem;
    background: rgba(28, 15, 8, 0.6);
    border: 1rem solid rgba(212, 165, 116, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .illus-phone svg, .illus-camera svg { width: 36rem; height: 36rem; color: rgba(240, 160, 64, 0.7); }

  .illus-wave {
    display: flex;
    align-items: center;
    gap: 4rem;
  }
  .illus-wave span {
    width: 4rem;
    height: 20rem;
    background: rgba(240, 160, 64, 0.5);
    border-radius: 2rem;
    animation: wave 1.2s ease-in-out infinite;
  }
  .illus-wave span:nth-child(2) { animation-delay: 0.15s; }
  .illus-wave span:nth-child(3) { animation-delay: 0.3s; }
  .illus-wave span:nth-child(4) { animation-delay: 0.45s; }
  .illus-wave span:nth-child(5) { animation-delay: 0.6s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* 连接选项卡 */
  .connect-options {
    background: rgba(28, 15, 8, 0.5);
    border: 1rem solid rgba(212, 165, 116, 0.15);
    border-radius: 16rem;
    overflow: hidden;
    margin-bottom: 16rem;
  }

  .connect-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14rem 16rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .connect-option:hover { background: rgba(240, 160, 64, 0.08); box-shadow: 0 0 12rem rgba(232, 144, 32, 0.35); }
  .connect-option:active { background: rgba(240, 160, 64, 0.15); }

  .connect-option + .connect-option {
    border-top: 1rem solid rgba(212, 165, 116, 0.12);
  }

  .connect-option-left {
    display: flex;
    align-items: center;
    gap: 12rem;
  }

  .connect-icon {
    width: 32rem; height: 32rem;
    border-radius: 8rem;
    background: rgba(240, 160, 64, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .connect-icon svg { width: 18rem; height: 18rem; color: #F0A040; }

  .connect-label {
    font-size: 14rem;
    font-weight: 600;
    color: #F5DFC0;
  }

  .connect-guide {
    display: flex;
    align-items: center;
    gap: 4rem;
    font-size: 12rem;
    color: rgba(240, 160, 64, 0.8);
  }
  .connect-guide svg { width: 12rem; height: 12rem; }

  /* 检测按钮 */
  .detect-btn {
    width: 100%;
    padding: 14rem;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    border: none;
    border-radius: 14rem;
    color: white;
    font-size: 15rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6rem 20rem rgba(240, 160, 64, 0.35);
    transition: all 0.2s;
    margin-bottom: 14rem;
  }
  .detect-btn:hover { transform: translateY(-1rem); box-shadow: 0 8rem 24rem rgba(240, 160, 64, 0.45); }
  .detect-btn:active { transform: scale(0.98); box-shadow: 0 3rem 12rem rgba(240, 160, 64, 0.3); }

  /* 客服入口 */
  .service-entry {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6rem;
    color: rgba(245, 223, 192, 0.6);
    font-size: 13rem;
    cursor: pointer;
    padding: 10rem;
    transition: color 0.2s;
    margin-bottom: 16rem;
  }
  .service-entry:hover { color: #F0A040; }
  .service-entry svg { width: 16rem; height: 16rem; }

  /* 底部导航栏 */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    height: 64rem;
    background: rgba(28, 15, 8, 0.95);
    backdrop-filter: blur(20rem);
    border-top: 1rem solid rgba(212, 165, 116, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 8rem;
    flex-shrink: 0;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
    cursor: pointer;
    padding: 6rem 10rem;
    border-radius: 10rem;
    transition: all 0.2s ease;
    flex: 1;
    max-width: 76rem;
    color: rgba(245, 223, 192, 0.5);
  }
  .nav-item:hover { background: rgba(240, 160, 64, 0.1); }
  .nav-item.active .nav-label { color: #E89020; }
  .nav-item.active svg { color: #E89020; filter: drop-shadow(0 0 6rem rgba(232, 144, 32, 0.8)); }
  .nav-item svg { width: 26rem; height: 26rem; transition: color 0.2s; }
  .nav-label { font-size: 11rem; transition: color 0.2s; }

  .nav-center {
    position: relative;
    width: 60rem;
    height: 60rem;
    margin-top: -26rem;
    flex-shrink: 0;
  }
  .nav-center-btn {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6rem 20rem rgba(232, 144, 32, 0.55), 0 0 26rem rgba(232, 144, 32, 0.4), inset 0 1rem 0 rgba(255, 233, 184, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    color: white;
  }
  .nav-center-btn:hover { transform: translateY(-2rem); box-shadow: 0 10rem 28rem rgba(232, 144, 32, 0.6); }
  .nav-center-btn:active { transform: translateY(0) scale(0.95); }
  .nav-center-btn svg { width: 28rem; height: 28rem; }

  .home-indicator {
    position: absolute;
    bottom: 4rem; left: 50%;
    transform: translateX(-50%);
    width: 100rem; height: 4rem;
    background: rgba(245, 223, 192, 0.3);
    border-radius: 2rem;
    z-index: 5;
  }

  .interaction-hint {
    position: fixed;
    bottom: 20rem; left: 50%;
    transform: translateX(-50%);
    background: rgba(28, 15, 8, 0.92);
    color: #F5DFC0;
    padding: 10rem 22rem;
    border-radius: 20rem;
    font-size: 13rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 100;
    box-shadow: 0 4rem 20rem rgba(28, 15, 8, 0.25);
  }
  .interaction-hint.show { opacity: 1; }

  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(28, 15, 8, 0.95);
    backdrop-filter: blur(10rem);
    padding: 16rem 28rem;
    border-radius: 14rem;
    box-shadow: 0 10rem 40rem rgba(28, 15, 8, 0.4);
    font-size: 14rem;
    color: #F5DFC0;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 200;
    text-align: center;
    white-space: nowrap;
    border: 1rem solid rgba(240, 160, 64, 0.3);
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  @media (max-width: 900rem) {
    .container { flex-direction: column; gap: 30rem; }
  }

  /* ========== 相机互联工作台 (Tethered Workspace) ========== */
  .workspace {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 50;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .workspace.active { transform: translateY(0); }

  .ws-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14rem 20rem;
    color: white;
    font-size: 14rem;
    font-weight: 600;
  }
  .ws-cam-info { display: flex; align-items: center; gap: 8rem; }
  .ws-cam-info svg { width: 18rem; height: 18rem; color: #4CAF50; }
  .ws-battery { display: flex; align-items: center; gap: 4rem; font-size: 12rem; color: #888; }

  .ws-close { cursor: pointer; padding: 4rem; }
  .ws-close svg { width: 24rem; height: 24rem; color: white; }

  .ws-viewfinder {
    flex: 1;
    background: #111;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ws-viewfinder-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: filter 0.3s ease;
  }
  /* 构图辅助线 */
  .ws-grid { position: absolute; inset: 0; pointer-events: none; }
  .ws-grid::before, .ws-grid::after { content: ''; position: absolute; }
  .ws-grid::before { left: 33.33%; right: 33.33%; top: 0; bottom: 0; border-left: 1rem solid rgba(255,255,255,0.2); border-right: 1rem solid rgba(255,255,255,0.2); }
  .ws-grid::after { top: 33.33%; bottom: 33.33%; left: 0; right: 0; border-top: 1rem solid rgba(255,255,255,0.2); border-bottom: 1rem solid rgba(255,255,255,0.2); }

  /* 参数调节区 */
  .ws-controls {
    background: #1C1C1E;
    padding: 16rem 0;
    display: flex;
    flex-direction: column;
    gap: 16rem;
    border-radius: 20rem 20rem 0 0;
    margin-top: -20rem;
    position: relative;
    z-index: 10;
  }

  .ws-params {
    display: flex;
    justify-content: space-between;
    padding: 0 20rem;
  }
  .ws-param-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4rem;
    color: white;
  }
  .ws-param-label { font-size: 11rem; color: #888; font-weight: 600; }
  .ws-param-val { font-size: 15rem; font-weight: 700; color: #F0A040; }

  /* 色彩预设 */
  .ws-presets {
    display: flex;
    gap: 12rem;
    padding: 0 20rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .ws-presets::-webkit-scrollbar { display: none; }
  .ws-preset {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6rem;
    cursor: pointer;
  }
  .ws-preset-img {
    width: 50rem; height: 50rem;
    border-radius: 10rem;
    background: #333;
    border: 2rem solid transparent;
    transition: all 0.2s;
  }
  .ws-preset.active .ws-preset-img { border-color: #E89020; transform: scale(1.05); }
  .ws-preset-name { font-size: 11rem; color: #AAA; }
  .ws-preset.active .ws-preset-name { color: #E89020; }

  /* 底部快门区（相机互联） */
  .ws-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10rem 30rem 30rem;
    background: #1C1C1E;
  }

  .ws-shutter {
    width: 68rem; height: 68rem;
    border-radius: 50%;
    background: white;
    border: 4rem solid #333;
    outline: 2rem solid white;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .ws-shutter:active { transform: scale(0.9); background: #EEE; }

  .ws-gallery {
    width: 48rem; height: 48rem;
    border-radius: 8rem;
    background: #333;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .ws-gallery img { width: 100%; height: 100%; object-fit: cover; }
  .ws-gallery-badge {
    position: absolute;
    top: -4rem; right: -4rem;
    background: #F44336;
    color: white;
    font-size: 10rem;
    font-weight: 700;
    padding: 2rem 5rem;
    border-radius: 10rem;
    display: none;
  }
  .ws-gallery-badge.show { display: block; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

  /* 拍照闪屏 */
  .ws-flash {
    position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 100;
  }
  .ws-flash.active { animation: flashAnim 0.3s ease-out; }
  @keyframes flashAnim { 0% { opacity: 0.8; } 100% { opacity: 0; } }

  /* ========== 手机互联工作台（远程画面 + 快门） ========== */
  /* 屏中屏：模拟被控手机屏幕画面 */
  .remote-frame {
    width: 60%;
    max-width: 250rem;
    aspect-ratio: 9 / 19.5;
    background: #000;
    border: 2rem solid rgba(245, 223, 192, 0.35);
    border-radius: 16rem;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 40rem rgba(240, 160, 64, 0.2), 0 0 90rem rgba(240, 160, 64, 0.08);
  }
  .remote-screen {
    width: 100%; height: 100%;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
  }
  /* 模拟被控手机的系统相机取景画面 */
  .remote-cam { position: absolute; inset: 0; }
  .remote-cam-scene {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 70% 22%, rgba(240, 200, 120, 0.9) 0 5%, rgba(240, 200, 120, 0.4) 5% 8%, transparent 8%),
      radial-gradient(ellipse at 20% 55%, rgba(245, 223, 192, 0.12) 0 30%, transparent 30%),
      linear-gradient(165deg, #5A6E8C 0%, #7D8FA5 34%, #C9B79B 62%, #8A6F52 100%);
  }
  .remote-cam-ui {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 14rem 0 16rem;
    pointer-events: none;
  }
  .remote-cam-top {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 0 14rem;
    font-size: 10rem;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 600;
    letter-spacing: 1rem;
  }
  .remote-cam-top .cam-dot {
    width: 10rem; height: 10rem;
    border-radius: 50%;
    background: radial-gradient(circle, #FFE9A8 0 30%, #E8B64C 30% 60%, #B07F22 60%);
    box-shadow: 0 0 8rem rgba(255, 220, 130, 0.7);
  }
  .remote-cam-shutter {
    width: 36rem; height: 36rem;
    border-radius: 50%;
    background: radial-gradient(circle, #F7F7F7 0 55%, #DDD 55% 68%, #999 68%);
    border: 2rem solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 2rem 10rem rgba(0, 0, 0, 0.5);
  }
  .remote-cam-modes {
    font-size: 9rem;
    color: rgba(255, 255, 255, 0.75);
    font-weight: 600;
    letter-spacing: 3rem;
  }
  .remote-cam-modes .active-mode { color: #FFD27A; }

  /* 远程画面角标 */
  .remote-badge {
    position: absolute;
    top: 14rem; left: 14rem;
    display: flex;
    align-items: center;
    gap: 6rem;
    background: rgba(28, 15, 8, 0.85);
    border: 1rem solid rgba(76, 175, 80, 0.4);
    border-radius: 12rem;
    padding: 5rem 10rem;
    color: #B7E6B9;
    font-size: 11rem;
    font-weight: 600;
    z-index: 60;
    pointer-events: none;
  }
  .remote-badge .dot-green {
    width: 7rem; height: 7rem;
    border-radius: 50%;
    background: #4CAF50;
    animation: pulse-dot 1.6s infinite;
  }

  /* 手机互联工作台底部：相册 + 快门 + 断开 */
  .phone-ws-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10rem 30rem 30rem;
    background: #1C1C1E;
  }
  .ws-disconnect {
    display: flex;
    align-items: center;
    gap: 5rem;
    padding: 9rem 16rem;
    background: rgba(240, 160, 64, 0.12);
    border: 1rem solid rgba(240, 160, 64, 0.35);
    border-radius: 16rem;
    color: #F0A040;
    font-size: 12rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ws-disconnect:hover { background: rgba(240, 160, 64, 0.22); }
  .ws-disconnect:active { transform: scale(0.96); }
  .ws-disconnect svg { width: 14rem; height: 14rem; }

  /* 手机互联工作台连接提示条 */
  .phone-ws-hint {
    text-align: center;
    font-size: 11rem;
    color: #888;
    padding: 8rem 0 0;
    background: #1C1C1E;

<script>
// ===== 移动端 web-view 桥接（不影响 Web 端 UI/功能） =====
// 1) URL 带 token 时写入 localStorage.memo_token 并清理 URL
// 2) URL 带 full=1 时进入全屏嵌入模式（App 内展示）
// 3) 登录/退出事件桥接：postMessage 通知 App 同步登录态
(function () {
  try {
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (token) {
      localStorage.setItem('memo_token', token);
      params.delete('token');
      var qs = params.toString();
      var url = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
      window.history.replaceState({}, '', url);
    }
        // 动态可视高度：手机浏览器地址栏展开/收起会改变可视区，100vh 含地址栏高度导致上下留空隙
    // 用 window.innerHeight 注入 --app-h（dvh 语义），resize/orientationchange 时刷新
    function setVH() {
      var v = window.innerHeight || document.documentElement.clientHeight;
      document.documentElement.style.setProperty('--app-h', v + 'px');
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', function () { setTimeout(setVH, 250); });
    function enterFull(extra) {
      var add = function () {
        document.body.classList.add('full-embed');
        if (extra) document.body.classList.add(extra);
      };
      if (document.body) add();
      else document.addEventListener('DOMContentLoaded', add);
    }
    var isAppWebview = !!(window.uni && uni.postMessage) || (typeof plus !== 'undefined' && plus.android);
    if (params.get('full') === '1' || isAppWebview) {
      // App web-view 内嵌（含 H5 内部跳转页）：全屏 + 隐藏 H5 导航（自定义 tabBar 承担导航）
      enterFull();
    } else if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 600) {
      // 手机浏览器：自动全屏 App 化，保留 H5 导航（视觉与 App 一致）
      enterFull('mobile-browser');
    }
  } catch (e) {}
})();
</script>

})();

              <div class="remote-screen">
                <div class="remote-cam">
                  <div class="remote-cam-scene"></div>
                  <div class="remote-cam-ui">
                    <div class="remote-cam-top">
                      <span>HDR · 闪光</span>
                      <span class="cam-dot"></span>
                    </div>
                    <div class="remote-cam-shutter"></div>
                    <div class="remote-cam-modes"><span>照片</span> · <span class="active-mode">视频</span> · <span>人像</span></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="remote-badge">
              <span class="dot-green"></span>
              <span>远程画面 · 实时</span>
            </div>
            <div class="ws-grid"></div>
            <div class="ws-flash" id="phoneFlash"></div>
          </div>

          <div class="phone-ws-hint">只能按下快门 · 其余操作请在被控手机上完成</div>

          <!-- 底部控制区 -->
          <div class="phone-ws-bottom">
            <div class="ws-gallery" id="phoneGallery" title="查看相册">
              <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" id="phoneGalleryImg" alt="Gallery">
              <div class="ws-gallery-badge" id="phoneBadge">0</div>
            </div>
            <div class="ws-shutter" id="phoneShutter" title="远程拍摄"></div>
            <button class="ws-disconnect" id="phoneDisconnect">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
              <span>断开连接</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  var db = new Dexie('memoPhotos');
  db.version(1).stores({ pendingPhotos: 'id, hour, lng, lat' });

  const toast = document.getElementById('toast');
  const showToast = (msg) => {
    // 王总要求：去掉操作反馈弹窗——仅保留错误/警示类提示（⚠️/失败/错误/无效等）
    if (msg && !/⚠️|失败|错误|无效|不可达|请输入|需为|不能|重复|请稍后|手动/.test(String(msg))) return;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2000);
  };

  // ========== 模式切换（相机互联 / 手机互联） ==========
  var currentMode = 'camera'; // 点击连接界面首先显示的是相机互联
  var cameraModeContent = document.getElementById('cameraModeContent');
  var phoneModeContent = document.getElementById('phoneModeContent');
  var connIconCamera = document.getElementById('connIconCamera');
  var connIconPhone = document.getElementById('connIconPhone');

  // 演示参数：?mode=phone 初始显示手机互联；&ws=1 直接打开手机互联工作台；&dbg=1 输出断开按钮尺寸到 title（原型预览用）
  (function () {
    try {
      var p = new URLSearchParams(window.location.search);
      if (p.get('mode') === 'phone') {
        setTimeout(function () { document.querySelector('.mode-btn[data-mode="phone"]').click(); }, 0);
      }
      if (p.get('ws') === '1') {
        setTimeout(function () { document.getElementById('phoneWorkspace').classList.add('active'); }, 600);
      }
      if (p.get('dbg') === '1') {
        setTimeout(function () {
          var el = document.getElementById('phoneDisconnect');
          var t = el.querySelector('span');
          document.title = 'DBG w=' + el.clientWidth + ' sw=' + el.scrollWidth + ' spanW=' + (t ? t.offsetWidth : -1);
        }, 1500);
      }
    } catch (e) {}
  })();

  document.querySelectorAll('.mode-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.mode-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      var isPhone = currentMode === 'phone';
      cameraModeContent.style.display = isPhone ? 'none' : '';
      phoneModeContent.style.display = isPhone ? '' : 'none';
      connIconCamera.style.display = isPhone ? 'none' : '';
      connIconPhone.style.display = isPhone ? '' : 'none';
    });
  });

  // 连接选项
  document.querySelectorAll('.connect-option').forEach(opt => {
    opt.addEventListener('click', () => {
      var names = { wired: '有线连接', wireless: '无线连接', qr: '扫码连接', lan: '局域网直连' };
      showToast('🔗 ' + names[opt.dataset.type] + ' - 连接引导');
    });
  });

  // 相机互联检测按钮 - 模拟成功连接并进入工作台
  document.getElementById('detectBtn').addEventListener('click', () => {
    const btn = document.getElementById('detectBtn');
    const original = btn.textContent;
    btn.textContent = '正在连接 Sony A7M4...';
    btn.style.opacity = '0.7';

    setTimeout(() => {
      btn.textContent = original;
      btn.style.opacity = '1';
      showToast('✅ 相机连接成功！');

      // 打开联机工作台
      document.getElementById('workspace').classList.add('active');
    }, 1500);
  });

  // 手机互联检测按钮 - 模拟连接被控手机并进入手机互联工作台
  document.getElementById('phoneDetectBtn').addEventListener('click', () => {
    const btn = document.getElementById('phoneDetectBtn');
    const original = btn.textContent;
    btn.textContent = '正在连接被控手机...';
    btn.style.opacity = '0.7';

    setTimeout(() => {
      btn.textContent = original;
      btn.style.opacity = '1';
      showToast('✅ 已连接被控手机！');

      // 打开手机互联工作台
      document.getElementById('phoneWorkspace').classList.add('active');
    }, 1500);
  });

  // ================= 相机互联工作台逻辑 =================
  const wsClose = document.getElementById('wsClose');
  const workspace = document.getElementById('workspace');
  const wsPresets = document.querySelectorAll('#workspace .ws-preset');
  const wsViewfinderImg = document.getElementById('wsViewfinderImg');
  const wsShutter = document.getElementById('wsShutter');
  const wsFlash = document.getElementById('wsFlash');
  const wsGalleryImg = document.getElementById('wsGalleryImg');
  const wsBadge = document.getElementById('wsBadge');

  let photoCount = 0;

  // 关闭工作台
  wsClose.addEventListener('click', () => {
    workspace.classList.remove('active');
  });

  // 切换滤镜 (像素蛋糕核心功能模拟)
  wsPresets.forEach(preset => {
    preset.addEventListener('click', () => {
      wsPresets.forEach(p => p.classList.remove('active'));
      preset.classList.add('active');
      const filter = preset.dataset.filter;
      wsViewfinderImg.style.filter = filter === 'none' ? '' : filter;
    });
  });

  // 模拟拍摄
  wsShutter.addEventListener('click', () => {
    // 闪光屏效
    wsFlash.classList.remove('active');
    void wsFlash.offsetWidth; // trigger reflow
    wsFlash.classList.add('active');

    // 震动反馈 (支持的设备上)
    if (navigator.vibrate) navigator.vibrate(50);

    // 更新相册缩略图和计数
    setTimeout(() => {
      photoCount++;
      wsBadge.textContent = photoCount;
      wsBadge.classList.add('show');

      // 模拟一张新照片飞入图库
      wsGalleryImg.src = 'https://images.unsplash.com/photo-1516528387618-afa90b13e000?auto=format&fit=crop&w=150&q=80';
      wsGalleryImg.style.filter = wsViewfinderImg.style.filter; // 保持滤镜效果
    }, 200);
  });

  // ================= 手机互联工作台逻辑 =================
  const phoneWsClose = document.getElementById('phoneWsClose');
  const phoneWorkspace = document.getElementById('phoneWorkspace');
  const phoneShutter = document.getElementById('phoneShutter');
  const phoneFlash = document.getElementById('phoneFlash');
  const phoneGalleryImg = document.getElementById('phoneGalleryImg');
  const phoneBadge = document.getElementById('phoneBadge');
  const phoneDisconnect = document.getElementById('phoneDisconnect');
  const phoneViewfinder = document.getElementById('phoneViewfinder');

  let phonePhotoCount = 0;

  // 关闭工作台
  phoneWsClose.addEventListener('click', () => {
    phoneWorkspace.classList.remove('active');
  });

  // 断开连接
  phoneDisconnect.addEventListener('click', () => {
    phoneWorkspace.classList.remove('active');
    showToast('已断开与被控手机的连接');
  });

  // 远程拍摄（模拟）
  phoneShutter.addEventListener('click', () => {
    // 闪光屏效
    phoneFlash.classList.remove('active');
    void phoneFlash.offsetWidth; // trigger reflow
    phoneFlash.classList.add('active');

    // 震动反馈 (支持的设备上)
    if (navigator.vibrate) navigator.vibrate(50);

    // 远程画面闪烁反馈（模拟被控端快门声效/画面变化）
    phoneViewfinder.classList.remove('remote-pulse');
    void phoneViewfinder.offsetWidth;
    phoneViewfinder.classList.add('remote-pulse');

    // 更新相册缩略图和计数
    setTimeout(() => {
      phonePhotoCount++;
      phoneBadge.textContent = phonePhotoCount;
      phoneBadge.classList.add('show');
      phoneGalleryImg.src = 'https://images.unsplash.com/photo-1516528387618-afa90b13e000?auto=format&fit=crop&w=150&q=80';
    }, 200);
  });

  // 相机按钮 — 点击一律直接调起系统相机（去掉长按跳转 camera-prototype，避免手机误触跳页）
  (function() {
    var camBtn = document.getElementById('cameraBtn');
    camBtn.addEventListener('click', function(e) {
      if (currentMode === 'phone') {
        // 手机互联模式下：中央按钮切回相机互联模式
        document.querySelector('.mode-btn[data-mode="camera"]').click();
        return;
      }
      captureWithSystemCamera();
    });
  })();

  // 客服
  document.getElementById('serviceEntry').addEventListener('click', () => {
    showToast('💬 正在连接人工客服...');
  });

  // 底部导航
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      var tab = item.dataset.tab;
      if (tab === 'home') {
        window.location.href = 'memo-home.html';
        return;
      }
      if (tab === 'message') {
        window.location.href = 'message-prototype.html';
        return;
      }
      if (tab === 'profile') {
        window.location.href = 'profile-prototype.html';
        return;
      }
      document.querySelectorAll('.nav-item').forEach(function(i) { i.classList.remove('active'); });
      item.classList.add('active');
      var names = { home: '首页', market: '联机', message: '消息', profile: '个人中心' };
      showToast('切换到：' + (names[tab] || tab));
    });
  });

  // ========== 系统相机捕获 ==========
  function captureWithSystemCamera() {
    var input = document.createElement('input');
    input.type = 'file';
    input.setAttribute('capture', 'camera');
    input.accept = 'image/*';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function() {
      var file = input.files[0];
      if (!file) { document.body.removeChild(input); return; }
      wsLastPhotoFile = file; // 缓存真实照片文件，供联机工作台快门管线优先读取
      var getThumbnail = new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var scale = Math.min(200 / img.width, 200 / img.height, 1);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      var getLocation = new Promise(function(resolve, reject) {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000, enableHighAccuracy: true });
        } else { reject(new Error('无定位能力')); }
      });
      Promise.all([getLocation, getThumbnail]).then(function(results) {
        savePhotoToPending(results[0].coords.longitude, results[0].coords.latitude, results[1]);
      }).catch(function() {
        getThumbnail.then(function(thumb) {
          savePhotoToPending(120.3826 + (Math.random() - 0.5) * 0.01, 36.0671 + (Math.random() - 0.5) * 0.01, thumb);
        });
      });
    });
    input.click();
  }
  function savePhotoToPending(lng, lat, thumbnail) {
    var now = new Date();
    var hour = now.getHours();
    var photoData = {
      id: 'photo_' + now.getTime(), color: '#F0A040', likes: 0, tips: 0, liked: false, tipped: false, collected: false, comments: [],
      uploadTime: Math.floor(now.getTime() / 1000),
      timeStr: String(hour).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
      dateStr: now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日',
      hour: hour, lng: +lng.toFixed(6), lat: +lat.toFixed(6), photoDataUrl: thumbnail
    };
    db.pendingPhotos.add(photoData).then(function() {
      var oldInputs = document.querySelectorAll('input[type=file][capture=camera]');
      oldInputs.forEach(function(el) { if (el.parentNode) el.parentNode.removeChild(el); });
      window.location.href = 'memo-home.html';
    });
  }
  var wsLastPhotoFile = null;
</script>

</body>
</html>
