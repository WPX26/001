<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E89020">
  <link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>充钱使我变强</title>
<style>  /* ===== 屏宽等比缩放基准（王总 2026-08-13）：1rem = 屏宽/375 px，元素长宽只与屏宽成比例，与屏高无关 ===== */
  html { font-size: 0.2667vw; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1C0F08;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20rem;
    overflow-x: hidden;
  }

  .container {
    display: flex;
    gap: 40rem;
    max-width: 100vw; width: 100vw; height: 100vh; margin: 0;
    width: 100%;
    align-items: center;
    justify-content: center;
  }

  /* ========== 左侧手机预览 ========== */
  .phone-wrapper { display: flex; flex-direction: column; align-items: center; }

  .phone-frame {
    width: 100vw;
    height: 100vh;
    background: #F0E4CE;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    position: relative;
  }

  .phone-frame::before {
    display: none;
    content: '';
    position: absolute;
    top: 14rem; left: 50%;
    transform: translateX(-50%);
    width: 120rem; height: 28rem;
    background: #1C0F08;
    border-radius: 0 0 18rem 18rem;
    z-index: 10;
  }

  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    background: #1C0F08;
    display: flex;
    flex-direction: column;
  }

  /* 状态栏 */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14rem 20rem 6rem;
    color: #F5DFC0;
    font-size: 13rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  .status-icons { display: flex; gap: 5rem; align-items: center; }
  .status-icons svg { width: 14rem; height: 11rem; }

  /* 顶部导航（照搬会员中心 sub-header） */
  .pay-header {
    display: flex;
    align-items: center;
    padding: 12rem 16rem;
    background: rgba(28, 15, 8, 0.5);
    border-bottom: 1rem solid rgba(212, 165, 116, 0.15);
    flex-shrink: 0;
  }
  .pay-back {
    width: 32rem; height: 32rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(245, 223, 192, 0.85);
    border-radius: 8rem;
    transition: background 0.2s;
  }
  .pay-back:hover { background: rgba(240, 160, 64, 0.12); }
  .pay-back svg { width: 20rem; height: 20rem; }
  .pay-title {
    font-size: 16rem;
    font-weight: 700;
    color: #F5DFC0;
    margin-left: 4rem;
  }

  /* 内容滚动区（照搬会员中心 member-scroll） */
  .pay-scroll {
    flex: 1;
    overflow-y: auto;
    background: #1C0F08;
    padding: 0 16rem 20rem;
  }
  .pay-scroll::-webkit-scrollbar { width: 3rem; }
  .pay-scroll::-webkit-scrollbar-thumb { background: rgba(212, 165, 116, 0.3); border-radius: 2rem; }

  /* 套餐卡片（照搬会员中心 plan-card） */
  .plan-card {
    background: linear-gradient(135deg, #1C1C1E 0%, #F4E8D6 100%);
    border: 1.5rem solid rgba(240, 160, 64, 0.35);
    border-radius: 18rem;
    padding: 20rem 18rem;
    margin-top: 16rem;
    box-shadow: 0 6rem 20rem rgba(28, 15, 8, 0.08);
    position: relative;
    overflow: hidden;
  }
  .plan-card::before {
    content: '推荐';
    position: absolute;
    top: 12rem; right: 12rem;
    padding: 2rem 8rem;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    color: white;
    font-size: 10rem;
    font-weight: 700;
    border-radius: 6rem;
    letter-spacing: 0.5rem;
  }
  .plan-name {
    font-size: 16rem;
    font-weight: 700;
    color: #F5DFC0;
    margin-bottom: 6rem;
  }
  .plan-desc {
    font-size: 12rem;
    color: rgba(245, 223, 192, 0.85);
    margin-bottom: 14rem;
    line-height: 1.5;
  }
  .plan-price {
    display: flex;
    align-items: baseline;
    gap: 4rem;
    margin-bottom: 16rem;
  }
  .plan-price-symbol { font-size: 16rem; font-weight: 700; color: #D4691C; }
  .plan-price-num { font-size: 36rem; font-weight: 800; color: #D4691C; line-height: 1; }
  .plan-price-unit { font-size: 13rem; color: rgba(245, 223, 192, 0.85); }
  .price-original {
    font-size: 12rem;
    color: rgba(245, 223, 192, 0.4);
    text-decoration: line-through;
    margin-left: 8rem;
  }

  /* 权益列表（照搬会员中心 benefits） */
  .benefits-section { margin-top: 18rem; }
  .benefits-title {
    font-size: 12rem;
    font-weight: 700;
    color: rgba(245, 223, 192, 0.5);
    padding: 8rem 4rem;
    letter-spacing: 0.5rem;
  }
  .benefits-list {
    background: rgba(28, 15, 8, 0.5);
    border: 1rem solid rgba(212, 165, 116, 0.3);
    border-radius: 14rem;
    overflow: hidden;
  }
  .benefit-item {
    display: flex;
    align-items: flex-start;
    gap: 10rem;
    padding: 12rem 14rem;
  }
  .benefit-item + .benefit-item { border-top: 1rem solid rgba(212, 165, 116, 0.3); }
  .benefit-check {
    width: 18rem; height: 18rem;
    border-radius: 50%;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1rem;
  }
  .benefit-check svg { width: 10rem; height: 10rem; color: white; stroke-width: 3; }
  .benefit-text {
    font-size: 13rem;
    color: #F5DFC0;
    line-height: 1.5;
  }
  .benefit-text strong { color: #D4691C; }

  /* 订单详情 */
  .order-section {
    background: rgba(245, 223, 192, 0.05);
    border: 1rem solid rgba(212, 165, 116, 0.3);
    border-radius: 14rem;
    padding: 14rem 16rem;
    margin-bottom: 16rem;
  }
  .order-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7rem 0;
    font-size: 13rem;
  }
  .order-row + .order-row { border-top: 1rem dashed rgba(212, 165, 116, 0.25); }
  .order-label {
    color: rgba(245, 223, 192, 0.6);
  }
  .order-value {
    color: #F5DFC0;
    font-weight: 600;
  }
  .order-row.total {
    margin-top: 4rem;
    padding-top: 10rem;
    border-top: 1.5rem solid rgba(212, 165, 116, 0.35);
    font-size: 15rem;
  }
  .order-row.total .order-value {
    color: #F0A040;
    font-size: 18rem;
    font-weight: 800;
  }

  /* 支付方式 */
  .pay-section-title {
    font-size: 12rem;
    font-weight: 700;
    color: rgba(245, 223, 192, 0.5);
    padding: 8rem 4rem;
    letter-spacing: 0.5rem;
  }
  .pay-methods {
    background: rgba(28, 15, 8, 0.5);
    border: 1rem solid rgba(212, 165, 116, 0.3);
    border-radius: 14rem;
    overflow: hidden;
    margin-bottom: 20rem;
  }
  .pay-method {
    display: flex;
    align-items: center;
    gap: 12rem;
    padding: 14rem 16rem;
    cursor: pointer;
    transition: background 0.18s;
    position: relative;
  }
  .pay-method:hover { background: rgba(240, 160, 64, 0.08); }
  .pay-method + .pay-method { border-top: 1rem solid rgba(212, 165, 116, 0.25); }
  .pay-method-icon {
    width: 36rem; height: 36rem;
    border-radius: 10rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .pay-method-icon svg { width: 22rem; height: 22rem; color: white; }
  /* 微信 - 绿色 */
  .pay-method[data-method="wechat"] .pay-method-icon {
    background: linear-gradient(135deg, #2DC100 0%, #1A9500 100%);
  }
  /* 支付宝 - 蓝色 */
  .pay-method[data-method="alipay"] .pay-method-icon {
    background: linear-gradient(135deg, #1677FF 0%, #0950B0 100%);
  }
  /* 银行卡 - 暖橙金 */
  .pay-method[data-method="bank"] .pay-method-icon {
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
  }
  .pay-method-info { flex: 1; }
  .pay-method-name {
    font-size: 14rem;
    font-weight: 600;
    color: #F5DFC0;
    margin-bottom: 2rem;
  }
  .pay-method-desc {
    font-size: 11rem;
    color: rgba(245, 223, 192, 0.6);
  }
  .pay-method-radio {
    width: 20rem; height: 20rem;
    border-radius: 50%;
    border: 2rem solid rgba(212, 165, 116, 0.5);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .pay-method.selected .pay-method-radio {
    border-color: #F0A040;
    background: #F0A040;
  }
  .pay-method-radio svg {
    width: 12rem; height: 12rem;
    color: white;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .pay-method.selected .pay-method-radio svg { opacity: 1; }

  /* 底部支付按钮 */
  .pay-footer {
    padding: 12rem 16rem 18rem;
    background: rgba(28, 15, 8, 0.5);
    border-top: 1rem solid rgba(212, 165, 116, 0.15);
    flex-shrink: 0;
  }
  .pay-confirm {
    width: 100%;
    padding: 14rem;
    border: none;
    border-radius: 14rem;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    color: white;
    font-size: 15rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6rem 18rem rgba(240, 160, 64, 0.4);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8rem;
  }
  .pay-confirm:hover { transform: translateY(-1rem); box-shadow: 0 8rem 22rem rgba(240, 160, 64, 0.5); }
  .pay-confirm:active { transform: scale(0.96); }
  .pay-confirm:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .home-indicator {
    width: 100rem; height: 4rem;
    background: rgba(245, 223, 192, 0.4);
    border-radius: 2rem;
    margin: 10rem auto;
  }

  /* 收款码面板（下单成功后显示，新增业务元素，不改动原有样式） */
  .qr-panel {
    display: none;
    background: rgba(245, 223, 192, 0.05);
    border: 1rem solid rgba(212, 165, 116, 0.3);
    border-radius: 14rem;
    padding: 18rem 16rem;
    margin-bottom: 16rem;
    text-align: center;
  }
  .qr-panel.show { display: block; }
  .qr-title { font-size: 14rem; font-weight: 800; color: #F5DFC0; margin-bottom: 4rem; }
  .qr-subtitle { font-size: 11rem; color: rgba(245, 223, 192, 0.6); margin-bottom: 12rem; line-height: 1.7; }
  .qr-order-id {
    display: inline-block;
    font-size: 11rem;
    font-weight: 700;
    color: #5C3D2E;
    background: rgba(240, 160, 64, 0.14);
    border: 1rem solid rgba(240, 160, 64, 0.25);
    padding: 3rem 10rem;
    border-radius: 8rem;
    margin-bottom: 12rem;
    word-break: break-all;
    max-width: 100%;
  }
  .qr-img-wrap {
    width: 180rem; height: 180rem;
    margin: 0 auto 12rem;
    background: #fff;
    border-radius: 12rem;
    padding: 8rem;
    border: 1rem solid rgba(212, 165, 116, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .qr-img-wrap img { width: 100%; height: 100%; object-fit: contain; border-radius: 8rem; }
  .qr-img-placeholder {
    color: rgba(245, 223, 192, 0.6);
    font-size: 12rem;
    line-height: 1.8;
    padding: 10rem;
  }
  .qr-tip {
    font-size: 12rem;
    color: #F0A040;
    font-weight: 700;
    line-height: 1.7;
  }
  .qr-waiting {
    font-size: 12rem;
    color: rgba(245, 223, 192, 0.7);
    margin-top: 12rem;
    line-height: 1.8;
  }
  .qr-waiting .spin {
    display: inline-block;
    width: 14rem; height: 14rem;
    border: 2rem solid rgba(212, 165, 116, 0.4);
    border-top-color: #F0A040;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    vertical-align: -2rem;
    margin-right: 6rem;
  }
  .qr-retry-btn {
    margin-top: 10rem;
    padding: 8rem 18rem;
    border: 1rem solid rgba(240, 160, 64, 0.5);
    border-radius: 10rem;
    background: rgba(245, 223, 192, 0.08);
    color: #F0A040;
    font-size: 13rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .qr-retry-btn:hover { background: rgba(240, 160, 64, 0.1); }
  .qr-retry-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900rem) {
    .container { flex-direction: column; gap: 30rem; }
  }

  /* ===== 移动端 web-view 全屏适配（URL ?full=1 时生效，不影响 Web 端展示） ===== */
  body.full-embed { padding: 0; }
  body.full-embed .container { max-width: none; gap: 0; }
  body.full-embed .phone-wrapper { width: 100%; }
  body.full-embed .phone-frame {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }
  body.full-embed .phone-frame::before { display: none; }
  body.full-embed .phone-screen { border-radius: 0; }
  /* 顶部为真实系统状态栏（时间/信号/电量）让位：全屏时整体下移，顶栏图标不再挤到屏幕最顶（王总 2026-08-21） */
  body.full-embed .phone-screen {
    padding-top: max(env(safe-area-inset-top, 0px), 44px);
  }
  body.full-embed .status-bar { display: none; }
  body.full-embed .bottom-nav,
  body.full-embed .home-indicator { display: none; }

  /* 移动端浏览器 App 化：自动全屏但保留 H5 底部导航（手机浏览器无原生 tabBar） */
  body.full-embed.mobile-browser .bottom-nav,
  body.full-embed.mobile-browser .home-indicator { display: flex; }
  body.full-embed.mobile-browser .phone-frame { height: calc(100vh - 56rem); }
</style>

<script>
// ===== 移动端 web-view 桥接（不影响 Web 端 UI/功能） =====
// 1) URL 带 token 时写入 localStorage.memo_token 并清理 URL
// 2) URL 带 full=1 时进入全屏嵌入模式（App 内展示）
// 3) 登录/退出事件桥接：postMessage 通知 App 同步登录态
(function () {
  try {
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (token) {
      localStorage.setItem('memo_token', token);
      params.delete('token');
      var qs = params.toString();
      var url = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
      window.history.replaceState({}, '', url);
    }
    function enterFull(extra) {
      var add = function () {
        document.body.classList.add('full-embed');
        if (extra) document.body.classList.add(extra);
      };
      if (document.body) add();
      else document.addEventListener('DOMContentLoaded', add);
    }
    var isAppWebview = !!(window.uni && uni.postMessage) || (typeof plus !== 'undefined' && plus.android);
    var isPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 600;
    if (params.get('full') === '1' && isPhone) {
      // App web-view 内嵌 / 手机浏览器 full=1：全屏 + 保留 H5 导航（App 壳无 tabBar，导航由网页承担）
      enterFull('mobile-browser');
    } else if (params.get('full') === '1' || isAppWebview) {
      // 桌面 full=1（全屏预览/测试）：全屏无 H5 导航（既有行为不变）
      enterFull();
    } else if (isPhone) {
      // 手机浏览器：自动全屏 App 化，保留 H5 导航（视觉与 App 一致）
      enterFull('mobile-browser');
    }
  } catch (e) {}
})();
</script>

</head>
<body>
<div class="container">
  <div class="phone-wrapper">
    <div class="phone-frame">
      <div class="phone-screen">
        <!-- 状态栏 -->
        <div class="status-bar">
          <span>9:41</span>
          <div class="status-icons">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7 3 2.73 5.11 0 8.5L12 21 24 8.5C21.27 5.11 17 3 12 3z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
          </div>
        </div>

        <!-- 顶部导航 -->
        <div class="pay-header">
          <div class="pay-back" id="payBack" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = 'memo-home.html'; }">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </div>
          <div class="pay-title">充钱使我变强</div>
        </div>

        <!-- 内容滚动区 -->
        <div class="pay-scroll">
          <!-- 套餐卡片（照搬会员中心 plan-card） -->
          <div class="plan-card">
            <div class="plan-name">月度会员</div>
            <div class="plan-desc">解锁全部高级功能，可升级为认证摄影师，享受工作 / 生活双模式切换</div>
            <div class="plan-price">
              <span class="plan-price-symbol">¥</span>
              <span class="plan-price-num price-amount">6</span>
              <span class="plan-price-unit">/ 月</span>
              <span class="price-original" style="display:none;">¥12</span>
            </div>
          </div>

          <!-- 订单详情 -->
          <div class="order-section">
            <div class="order-row">
              <span class="order-label">套餐名称</span>
              <span class="order-value">认证摄影师月费</span>
            </div>
            <div class="order-row">
              <span class="order-label">有效期</span>
              <span class="order-value">1个月</span>
            </div>
            <div class="order-row total">
              <span class="order-label">合计</span>
              <span class="order-value">¥6</span>
            </div>
          </div>

          <!-- 支付方式 -->
          <div class="pay-section-title">选择支付方式</div>
          <div class="pay-methods" id="payMethods">
            <div class="pay-method selected" data-method="wechat" onclick="selectPayMethod(this)">
              <div class="pay-method-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
              </div>
              <div class="pay-method-info">
                <div class="pay-method-name">微信支付</div>
                <div class="pay-method-desc">推荐安装微信的用户使用</div>
              </div>
              <div class="pay-method-radio">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
            </div>
            <div class="pay-method" data-method="alipay" onclick="selectPayMethod(this)">
              <div class="pay-method-icon">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.695 15.07c3.426 1.158 4.203 1.22 4.203 1.22V3.846c0-2.124-1.705-3.845-3.81-3.845H3.914C1.808.001.102 1.722.102 3.846v16.31c0 2.123 1.706 3.845 3.813 3.845h16.173c2.105 0 3.81-1.722 3.81-3.845v-.157s-6.19-2.602-9.315-4.119c-2.096 2.602-4.8 4.181-7.607 4.181-4.75 0-6.361-4.19-4.112-6.949.49-.602 1.324-1.175 2.617-1.497 2.025-.502 5.247.313 8.266 1.317a16.796 16.796 0 0 0 1.341-3.302H5.781v-.952h4.799V6.975H4.77v-.953h5.81V3.591s0-.409.411-.409h2.347v2.84h5.744v.951h-5.744v1.704h4.69a19.453 19.453 0 0 1-1.986 5.06c1.424.52 2.702 1.011 3.654 1.333m-13.81-2.032c-.596.06-1.71.325-2.321.869-1.83 1.608-.735 4.55 2.968 4.55 2.151 0 4.301-1.388 5.99-3.61-2.403-1.182-4.438-2.028-6.637-1.809"/></svg>
              </div>
              <div class="pay-method-info">
                <div class="pay-method-name">支付宝</div>
                <div class="pay-method-desc">安全快捷的支付方式</div>
              </div>
              <div class="pay-method-radio">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
            </div>

          <!-- 会员权益（照搬会员中心） -->
          <div class="benefits-section">
            <div class="benefits-title">会员权益</div>
            <div class="benefits-list">
              <div class="benefit-item">
                <div class="benefit-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                <div class="benefit-text">解锁<strong>认证摄影师</strong>身份标识</div>
              </div>
              <div class="benefit-item">
                <div class="benefit-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                <div class="benefit-text">支持<strong>工作模式 / 生活模式</strong>自由切换</div>
              </div>
              <div class="benefit-item">
                <div class="benefit-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                <div class="benefit-text">无限量坐标点标记与照片上传</div>
              </div>
              <div class="benefit-item">
                <div class="benefit-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                <div class="benefit-text">优先展示在附近摄影师推荐位</div>
              </div>
              <div class="benefit-item">
                <div class="benefit-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
                <div class="benefit-text">专属客服与摄影社区准入资格</div>
              </div>
            </div>
          </div>

          <!-- 收款码面板（下单成功后显示） -->
          <div class="qr-panel" id="qrPanel">
            <div class="qr-title">请扫码付款</div>
            <div class="qr-subtitle" id="qrSubtitle">请使用微信 / 支付宝扫一扫<br>向收款方支付 ¥6</div>
            <div class="qr-order-id" id="qrOrderId"></div>
            <div class="qr-img-wrap">
              <img id="qrImg" alt="收款二维码" style="display:none;">
              <div class="qr-img-placeholder" id="qrPlaceholder" style="display:none;">收款码加载中，请稍候</div>
            </div>
            <div class="qr-tip" id="qrTip">请扫码支付 ¥6，并在付款时备注订单号</div>
            <div class="qr-waiting" id="qrWaiting" style="display:none;">
              <span class="spin"></span>已通知商家，等待确认中…<br>请耐心等待，确认后自动跳转
            </div>
          </div>
        </div>

        <!-- 底部支付按钮 -->
        <div class="pay-footer">
          <button class="pay-confirm" id="payConfirm" onclick="confirmPayment()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
            立即支付 ¥6
          </button>
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
  // ================= 订阅支付流程（真实后端对接） =================
  // 后端：GET /member/plans 拉套餐价格 → POST /member/order 创建订单（半自动人工确认）
  //      → 显示订单号 + 王总收款码(payeeQrCodeUrl) + 备注提示
  //      → 每 5 秒轮询 GET /member/order/{orderId}：paid → 开通成功跳转我的页
  // 已登录校验：未登录直接跳登录页；服务不可达（err.network）回退本地模拟，保证原型可离线演示

  var PLAN_ID = 'plan_pro_monthly';    // 默认套餐 ID（GET /member/plans 拉取成功后覆盖）
  var PLAN_PRICE_YUAN = 6;             // 默认价格（元，plans 拉取成功后覆盖）
  var POLL_INTERVAL = 5000;            // 轮询间隔 5 秒
  var POLL_MAX_TRIES = 72;             // 最多约 6 分钟，超时后提供手动重新查询

  var currentOrderId = null;
  var pollTimer = null;
  var pollTries = 0;

  function selectPayMethod(el) {
    document.querySelectorAll('.pay-method').forEach(m => m.classList.remove('selected'));
    el.classList.add('selected');
  }

  function getSelectedMethod() {
    var sel = document.querySelector('.pay-method.selected');
    return sel ? sel.dataset.method : 'wechat';
  }

  /* 金额显示（分→元 / 数字→字符串），保持两位内小数 */
  function yuanText(y) {
    var n = Number(y);
    if (isNaN(n)) return '0';
    return String(Math.round(n * 100) / 100);
  }

  /* ========== 进页：套餐渲染（只改数字来源，不动样式） ========== */
  function loadPlans() {
    if (typeof MemoAPI === 'undefined' || !MemoAPI.getToken()) return;
    MemoAPI.get('/member/plans').then(function (plan) {
      if (!plan) return;
      if (plan.planId) PLAN_ID = plan.planId;
      if (plan.priceYuan != null) {
        PLAN_PRICE_YUAN = plan.priceYuan;
      } else if (plan.price != null) {
        PLAN_PRICE_YUAN = plan.price / 100;
      }
      applyPlanPrice(PLAN_PRICE_YUAN);
    }).catch(function (e) {
      // 接口失败：保持页面默认价格（¥6），按 api.js 约定只 console 提示
      console.warn('[member plans] 套餐拉取失败，使用页面默认价格：', e && e.message);
    });
  }

  function applyPlanPrice(yuan) {
    var amountEl = document.querySelector('.price-amount');
    if (amountEl) amountEl.textContent = yuanText(yuan);
    var totalEl = document.querySelector('.order-row.total .order-value');
    if (totalEl) totalEl.textContent = '¥' + yuanText(yuan);
    // 原价划线：后端套餐无原价字段，去掉（隐藏，样式不动）
    var origEl = document.querySelector('.price-original');
    if (origEl) origEl.style.display = 'none';
    var subEl = document.getElementById('qrSubtitle');
    if (subEl) subEl.innerHTML = '请使用微信 / 支付宝扫一扫<br>向收款方支付 ¥' + yuanText(yuan);
    setConfirmBtn('立即支付 ¥' + yuanText(yuan));
  }

  /* 底部按钮文案（保留原按钮 svg 视觉，只换文字） */
  var confirmBtn = document.getElementById('payConfirm');
  var confirmBtnSvg = confirmBtn.querySelector('svg').outerHTML;
  function setConfirmBtn(text) {
    confirmBtn.innerHTML = confirmBtnSvg + ' ' + text;
    confirmBtn.disabled = false;
    confirmBtn.onclick = confirmPayment;
  }
  function setConfirmLoading(text) {
    confirmBtn.disabled = true;
    confirmBtn.onclick = null;
    confirmBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> ' + text;
  }

  /* 本地模拟成功（仅服务不可达时的兜底，保持原型可离线演示） */
  function mockPaySuccess() {
    setTimeout(function () {
      localStorage.setItem('profile_photographer', '1');
      alert('✅ 支付成功！你已升级为认证摄影师');
      window.location.href = 'profile-prototype.html?upgraded=1';
    }, 2000);
  }

  /* ========== 下单：POST /member/order ========== */
  function confirmPayment() {
    // 已登录校验：未登录 → 跳登录页（真实对接要求）
    if (typeof MemoAPI === 'undefined' || !MemoAPI.getToken()) {
      window.location.href = 'login-prototype.html';
      return;
    }

    setConfirmLoading('下单中...');

    MemoAPI.post('/member/order', { planId: PLAN_ID, paymentMethod: getSelectedMethod() })
      .then(function (data) {
        showQrPanel(data);
        startPolling();   // 下单即进入等待确认（半自动人工确认，无需再点"我已付款"）
      })
      .catch(function (err) {
        if (err && err.network) {        // 服务不可达 → 回退本地模拟
          mockPaySuccess();
          return;
        }
        if (err && err.code === 1002) {  // Token 无效/未登录 → 去登录
          alert('请先登录后再订阅');
          window.location.href = 'login-prototype.html';
          return;
        }
        setConfirmBtn('立即支付 ¥' + yuanText(PLAN_PRICE_YUAN));
        alert(err && err.message ? err.message : '下单失败，请重试');
      });
  }

  /* 下单成功：显示收款码 + 付款备注订单号（orderNo，短号便于抄写） */
  function showQrPanel(data) {
    var orderId = data && (data.orderId || data.id || (data.order && data.order.id)) || '';
    var orderNo = data && (data.orderNo || (data.order && data.order.orderNo)) || '';
    var qrUrl = data && (data.payeeQrCodeUrl || data.qrCode || data.qrUrl) || '';
    var remark = data && (data.remark || (data.order && data.order.remark)) || '';
    currentOrderId = orderId;

    // 隐藏支付方式选择区，显示收款码面板
    document.getElementById('payMethods').style.display = 'none';
    var secTitle = document.querySelector('.pay-section-title');
    if (secTitle) secTitle.style.display = 'none';

    document.getElementById('qrPanel').classList.add('show');
    document.getElementById('qrOrderId').textContent = orderNo || orderId;
    // 醒目提示：付款时备注订单号 + 付款后等待确认（保留 qr-tip 原有醒目橙色样式）
    var tip = document.getElementById('qrTip');
    tip.innerHTML = (remark ? remark + '；' : '请扫码支付 ¥' + yuanText(PLAN_PRICE_YUAN) + '，请在付款时备注订单号' + (orderNo ? '：' + orderNo : '') + '；')
      + '付款后等待确认，一般几分钟内开通';

    var img = document.getElementById('qrImg');
    var placeholder = document.getElementById('qrPlaceholder');
    if (qrUrl) {
      img.src = qrUrl;
      img.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      img.style.display = 'none';
      placeholder.style.display = 'block';
      placeholder.textContent = '收款码获取中，请刷新页面重试';
    }

    // 进入等待状态（按钮禁用，由轮询驱动）
    setConfirmLoading('等待商家确认...');
  }

  /* 进入等待商家确认状态并开始轮询订单状态 */
  function startPolling() {
    var wait = document.getElementById('qrWaiting');
    wait.style.display = 'block';
    wait.innerHTML = '<span class="spin"></span>已下单，等待确认中…<br>付款后一般几分钟内开通，确认后自动跳转';

    pollTries = 0;
    clearInterval(pollTimer);
    pollTimer = setInterval(pollOrder, POLL_INTERVAL);
    pollOrder();   // 立即查询一次
  }

  function pollOrder() {
    if (!currentOrderId) return;
    pollTries++;
    MemoAPI.get('/member/order/' + encodeURIComponent(currentOrderId))
      .then(function (data) {
        var status = getOrderStatus(data);
        if (status === 'paid') {
          clearInterval(pollTimer);
          onOrderPaid();
        } else if (status === 'expired') {
          clearInterval(pollTimer);
          onOrderExpired();
        } else if (pollTries >= POLL_MAX_TRIES) {
          clearInterval(pollTimer);
          showPollTimeout();
        }
        // pending_confirm → 保持"等待确认中…"文案，等待下一轮
      })
      .catch(function () {
        if (pollTries >= POLL_MAX_TRIES) {
          clearInterval(pollTimer);
          showPollTimeout();
        }
        // 网络/业务错误：按 api.js 约定只 console 提示，继续等待下一轮
      });
  }

  function getOrderStatus(data) {
    if (!data) return '';
    if (data.status) return data.status;
    if (data.order && data.order.status) return data.order.status;
    if (data.orderStatus) return data.orderStatus;
    return '';
  }

  function showPollTimeout() {
    var wait = document.getElementById('qrWaiting');
    wait.innerHTML = '商家确认较慢，请稍候…<br><button class="qr-retry-btn" id="qrRetryBtn" onclick="retryPoll()">重新查询</button>';
  }

  function retryPoll() {
    var wait = document.getElementById('qrWaiting');
    wait.innerHTML = '<span class="spin"></span>已下单，等待确认中…<br>付款后一般几分钟内开通，确认后自动跳转';
    pollTries = 0;
    clearInterval(pollTimer);
    pollTimer = setInterval(pollOrder, POLL_INTERVAL);
    pollOrder();
  }

  /* 订单已支付（商家已确认开通）→ 跳转我的页并提示成功 */
  function onOrderPaid() {
    clearInterval(pollTimer);
    // 原型阶段：本地标记摄影师身份兜底（真实状态由后端 GET /member/status 下发，见 profile-prototype.html）
    localStorage.setItem('profile_photographer', '1');
    alert('✅ 支付成功！你已升级为认证摄影师');
    window.location.href = 'profile-prototype.html?upgraded=1';
  }

  /* 订单已过期（超 48h 未确认，后端惰性置 expired）→ 恢复按钮可重新下单 */
  function onOrderExpired() {
    currentOrderId = null;
    var wait = document.getElementById('qrWaiting');
    wait.innerHTML = '订单已过期，请重新下单';
    setConfirmBtn('立即支付 ¥' + yuanText(PLAN_PRICE_YUAN));
  }

  // 键盘支持（Enter 触发下单；等待中则立即查询一次）
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      if (currentOrderId) pollOrder();
      else confirmPayment();
    }
  });

  // 初始化：进页拉套餐价格渲染（未登录时由 confirmPayment 统一拦截跳登录页）
  loadPlans();
</script>
