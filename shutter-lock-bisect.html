<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5D2 快门锁定位仪 · r52</title>
<style>
  body{background:#1a1710;color:#f5f0e6;font-family:"Microsoft YaHei",sans-serif;max-width:820px;margin:0 auto;padding:18px;font-size:15px}
  h1{font-size:20px;margin:0 0 4px}
  .badge{display:inline-block;background:#3a2f1a;color:#ffd27a;border:1px solid #6b5626;border-radius:6px;padding:2px 8px;font-size:12px;vertical-align:middle}
  .card{background:#241f14;border:1px solid #4a3f28;border-radius:10px;padding:14px;margin:12px 0}
  .step{padding:8px 10px;border-radius:8px;margin:4px 0;background:#201b11;border:1px solid #3a3220;color:#b9ac8f}
  .step.cur{background:#2c3a24;border-color:#5d7a3f;color:#eaffd0;font-weight:700}
  .step.done-ok{color:#8fd18f}.step.done-bad{color:#ff9a8a}.step.done-skip{color:#8f8f8f}
  button{font-size:18px;padding:14px 22px;border-radius:10px;border:0;cursor:pointer;margin:6px 8px 0 0;font-weight:700}
  #btnOk{background:#3f7a34;color:#fff}#btnBad{background:#a03a2e;color:#fff}#btnSkip{background:#4a4534;color:#ddd}
  #btnStart{background:#2f5f8a;color:#fff}#btnCopy{background:#5a4a2a;color:#ffe}#btnAbort{background:#442;color:#cb9}
  button:disabled{opacity:.35;cursor:not-allowed}
  #log{background:#12100a;border:1px solid #333;border-radius:8px;padding:10px;height:230px;overflow:auto;font:12px/1.6 Consolas,monospace;white-space:pre-wrap}
  .hint{color:#c9b98a;font-size:13px;line-height:1.7}
  .big{font-size:17px;font-weight:700;color:#ffe9b0}
  #summary table{border-collapse:collapse;width:100%;font-size:14px}
  #summary td,#summary th{border:1px solid #4a3f28;padding:6px 8px;text-align:left}
</style>
</head>
<body>
<h1>🔬 5D2 快门锁定位仪 <span class="badge">v20260821-r52</span></h1>
<div class="hint">原理：一个会话里<b>逐级只加一条命令</b>，每级请你按一次机身快门——加到第几级快门被锁，那条命令就是锁因。全程约 2 分钟，中途不用拔线。</div>

<div class="card" id="preflight">
  <div class="big">开始前 4 件事（做完点确认）：</div>
  <div class="hint">
    ① 相机<b>电池取出 10 秒</b>再装回（彻底复位，排除残留锁）<br>
    ② 镜头拨到 <b>MF 手动对焦</b>（排除「没对上焦按不下去」的干扰——MF 下快门不受对焦限制）<br>
    ③ 模式转盘 <b>M 档</b>，存储卡已插，USB 线已插好，相机开机<br>
    ④ 用 <b>Ctrl+F5</b> 打开的本页
  </div>
  <button id="btnStart">✅ 都做好了，开始</button>
</div>

<div class="card" id="stepCard" style="display:none">
  <div class="big" id="stepTitle"></div>
  <div class="hint" id="stepHint"></div>
  <div id="steps"></div>
  <div style="margin-top:10px">
    <button id="btnOk" disabled>✅ 按得动，拍了</button>
    <button id="btnBad" disabled>❌ 摁不下去</button>
    <button id="btnSkip" disabled>⏭ 无法判断，跳过</button>
  </div>
</div>

<div class="card">
  <div class="big">过程日志</div>
  <div id="log"></div>
  <button id="btnCopy">📋 复制结果给开发者</button>
  <button id="btnAbort">⏹ 断开并停止</button>
</div>

<div class="card" id="summary" style="display:none"></div>

<script src="camera-ptp.js"></script>
<script src="usb-transport.js"></script>
<script src="browser-usb-transport.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $('log');
  function ts() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2); }
  function log(msg) { logEl.textContent += ts() + ' ' + msg + '\n'; logEl.scrollTop = 1e9; }

  var S = { transport: null, ptp: null, timers: [], results: [], idx: -1, busy: false };

  // 每一步：title 标题 / hint 操作提示 / action 进入本步要执行的命令（累加式，不关旧会话）
  var STEPS = [
    { id: 'V0', title: '第 0 级：无会话（仅插着 USB 线，软件完全不连接）',
      hint: '现在软件还没有连接相机。请直接拿起相机按一次快门到底。',
      action: null },
    { id: 'V1', title: '第 1 级：裸会话（只 openSession + getDeviceInfo，之后完全静默）',
      hint: '软件将只建立会话，之后不发任何命令。连接完成后按一次快门。',
      action: connectBare },
    { id: 'V2', title: '第 2 级：+事件模式（setEventMode 0x9115 + 排空 GetEvent 几次）',
      hint: '加发「开事件模式」命令。完成后按一次快门。',
      action: addEventMode },
    { id: 'V3', title: '第 3 级：+GetEvent 轮询（每 250ms 一次 0x9116）',
      hint: '开始每 250ms 排空事件。完成后按一次快门。',
      action: addGetEventLoop },
    { id: 'V4', title: '第 4 级：+保活（每 10s 一次）＝ r44 真机证明可用的完整命令集',
      hint: '加上保活。完成后按一次快门。这一级 = 当年快门能按的 r44。',
      action: addKeepAlive },
    { id: 'V5', title: '第 5 级：+中断端点读取器（瞬时错误自动重试）',
      hint: '启动中断事件监听。完成后按一次快门。',
      action: addIntrReader },
    { id: 'V6', title: '第 6 级：+基线卡枚举（一次性 0x1004+0x1007×3）＝ r51 命令集',
      hint: '做一次性的存储卡枚举（只做一次）。完成后按一次快门。这一级 = 你刚测过仍锁的 r51。',
      action: addBaseline },
    { id: 'V7', title: '第 7 级：+连续卡枚举（每 2s 一次 0x1007）＝ r45–r50 命令集（阳性对照）',
      hint: '开始每 2s 枚举卡。请等 4 秒让它跑两轮，再按一次快门。这一级 = r45–r50，预期会锁（用来验证仪器灵）。',
      action: addContPoll },
    { id: 'R', title: '收尾：断开会话（CloseSession + 释放），验证解锁',
      hint: '软件已断开会话。等 3 秒后按一次快门——看断开后是否恢复。',
      action: disconnectAll }
  ];

  function stopTimers() { S.timers.forEach(clearInterval); S.timers = []; }

  function connectBare() {
    log('连接：扫描已授权设备…');
    var tether = window.UsbTether.get();
    return tether.scan().then(function (devices) {
      var canon = (devices || []).filter(function (d) { return d.isCanon; })[0];
      if (!canon) throw new Error('未找到佳能相机（请确认 USB 已插、相机已开机）');
      log('找到相机 ' + canon.name + '，建立会话（接口0）…');
      return tether.requestConnect(canon.id, { iface: 0 });
    }).then(function (transport) {
      S.transport = transport;
      S.ptp = new PtpCamera(transport);
      return transport.clearPipe().then(function () { return S.ptp.openSession(); });
    }).then(function () { return S.ptp.getDeviceInfo(); })
      .then(function (info) { log('裸会话已建立：' + (info && info.model || '5D2') + '。此后完全静默，不发任何命令。'); });
  }
  function addEventMode() {
    return S.ptp.setEventMode().then(function () { return S.ptp.drainEosEvents(4); })
      .then(function () { log('已发 setEventMode(0x9115=1) + 排空完成。'); });
  }
  function addGetEventLoop() {
    var n = 0;
    S.timers.push(setInterval(function () {
      n++;
      S.ptp.transact(0x9116, [], null, 2000).catch(function (e) {
        log('GetEvent 错误: ' + ((e && e.message) || e));
      });
    }, 250));
    log('GetEvent 轮询已启动（每 250ms 一次 0x9116）。');
    return Promise.resolve();
  }
  function addKeepAlive() {
    S.timers.push(setInterval(function () {
      S.ptp.keepAlive().catch(function (e) { log('保活失败: ' + ((e && e.message) || e).toString().slice(0, 50)); });
    }, 10000));
    S.ptp.keepAlive().catch(function () {});
    log('保活已启动（每 10s 一次）。');
    return Promise.resolve();
  }
  function addIntrReader() {
    S.ptp.onEventError(function (e) { log('中断读取器错误: ' + ((e && e.message) || e).toString().slice(0, 60)); });
    S.ptp.startEvents();
    log('中断端点读取器已启动。');
    return Promise.resolve();
  }
  function addBaseline() {
    return S.ptp._pollEnsureBaseline().then(function (st) {
      if (st && st.storages) log('基线枚举完成：' + st.storages.map(function (s) { return '0x' + s.toString(16) + '=' + (st.counts[s] || 0); }).join(' ') + ' 张');
      else log('基线枚举失败/被跳过（存储探测未通过）：' + (S.ptp._pollDisabledReason || ''));
    });
  }
  function addContPoll() {
    S.timers.push(setInterval(function () {
      S.ptp._pollDetectNew().catch(function (e) { log('轮询错误: ' + ((e && e.message) || e).toString().slice(0, 50)); });
    }, 2000));
    log('连续卡枚举已启动（每 2s 一次 0x1007）。');
    return Promise.resolve();
  }
  function disconnectAll() {
    stopTimers();
    try { if (S.ptp) S.ptp.stopEvents(); } catch (e) {}
    var p = Promise.resolve();
    if (S.ptp) p = S.ptp.closeSession(3000, true).catch(function () {});
    return p.then(function () {
      try { if (S.transport) S.transport.release(); } catch (e) {}
      S.transport = null; S.ptp = null;
      log('会话已断开并释放。');
    });
  }

  function renderSteps() {
    $('steps').innerHTML = STEPS.map(function (st, i) {
      var cls = 'step', mark = '';
      var r = S.results.filter(function (x) { return x.id === st.id; })[0];
      if (r) { cls += r.verdict === 'ok' ? ' done-ok' : r.verdict === 'bad' ? ' done-bad' : ' done-skip'; mark = r.verdict === 'ok' ? ' ✅ 按得动' : r.verdict === 'bad' ? ' ❌ 摁不下去' : ' ⏭ 跳过'; }
      else if (i === S.idx) cls += ' cur';
      return '<div class="' + cls + '">' + st.title + mark + '</div>';
    }).join('');
  }

  function armVerdict(on) {
    $('btnOk').disabled = !on; $('btnBad').disabled = !on; $('btnSkip').disabled = !on;
  }

  function nextStep() {
    S.idx++;
    if (S.idx >= STEPS.length) return finish();
    var st = STEPS[S.idx];
    $('stepTitle').textContent = st.title;
    $('stepHint').textContent = st.hint;
    renderSteps();
    armVerdict(false);
    log('—— ' + st.id + ' ' + st.title);
    var p = st.action ? st.action() : Promise.resolve();
    S.busy = true;
    Promise.resolve(p).then(function () {
      S.busy = false;
      armVerdict(true);
      log(st.id + ' 就绪，请按快门。');
    }, function (e) {
      S.busy = false;
      log('⚠️ ' + st.id + ' 命令执行出错: ' + ((e && e.message) || e));
      armVerdict(true); // 出错也允许记录结果继续（错误本身就是数据）
    });
  }

  function verdict(v) {
    if (S.busy || S.idx < 0) return;
    var st = STEPS[S.idx];
    S.results.push({ id: st.id, title: st.title, verdict: v, at: ts() });
    log('记录：' + st.id + ' = ' + (v === 'ok' ? '✅ 按得动' : v === 'bad' ? '❌ 摁不下去' : '⏭ 跳过'));
    armVerdict(false);
    nextStep();
  }

  function analyze() {
    var get = function (id) { var r = S.results.filter(function (x) { return x.id === id; })[0]; return r ? r.verdict : '-'; };
    var firstBad = null;
    ['V0', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6', 'V7'].forEach(function (id) {
      if (!firstBad && get(id) === 'bad') firstBad = id;
    });
    var concl;
    if (firstBad === 'V0') concl = '连软件会话都没有就锁 → 与我们的命令无关：是相机固件 PC 模式默认锁 / 线 / Windows 驱动环境问题。下一步：换 USB 口、查 Windows 便携设备驱动、确认相机无其他联机软件占用。';
    else if (firstBad === 'V1') concl = '裸会话就锁 → 与 r44 当年实测矛盾 → 环境/相机状态变了（电池复位是否真的做了？Windows 是否装了新的便携设备驱动？）。';
    else if (firstBad) concl = '锁定引入点 = ' + firstBad + '（' + STEPS.filter(function (s) { return s.id === firstBad; })[0].title + '）——这一级新加的命令就是锁快门真凶。';
    else concl = 'V0–V7 全部按得动 → 全部命令都不锁。锁来自测试路径之外（如页面其他后台行为），需要再对照主页面。';
    if (get('R') === 'ok') concl += ' 断开会话后快门恢复。';
    else if (get('R') === 'bad') concl += ' 断开会话后仍锁（残留态，需取电池复位）。';
    return concl;
  }

  function finish() {
    armVerdict(false);
    renderSteps();
    var rows = S.results.map(function (r) {
      return '<tr><td>' + r.id + '</td><td>' + r.title + '</td><td>' + (r.verdict === 'ok' ? '✅ 按得动' : r.verdict === 'bad' ? '❌ 摁不下去' : '⏭ 跳过') + '</td><td>' + r.at + '</td></tr>';
    }).join('');
    var concl = analyze();
    $('summary').style.display = 'block';
    $('summary').innerHTML = '<div class="big">📊 定位结果</div><table><tr><th>级</th><th>命令集</th><th>快门</th><th>时间</th></tr>' + rows + '</table><div class="big" style="margin-top:10px">结论：' + concl + '</div>';
    log('==== 结论 ====');
    log(concl);
    disconnectAll();
    window.__bisectResult = { results: S.results, conclusion: concl };
  }

  $('btnStart').addEventListener('click', function () {
    $('preflight').style.display = 'none';
    $('stepCard').style.display = 'block';
    log('开始定位。');
    nextStep();
  });
  $('btnOk').addEventListener('click', function () { verdict('ok'); });
  $('btnBad').addEventListener('click', function () { verdict('bad'); });
  $('btnSkip').addEventListener('click', function () { verdict('skip'); });
  $('btnAbort').addEventListener('click', function () {
    disconnectAll().then(function () { log('已停止并断开。'); });
    armVerdict(false);
  });
  $('btnCopy').addEventListener('click', function () {
    var text = (window.__bisectResult ? JSON.stringify(window.__bisectResult, null, 2) : '（未完成）') + '\n\n日志:\n' + logEl.textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { log('已复制到剪贴板。'); }, function () { log('复制失败，请手动全选日志。'); });
  });
})();
</script>
</body>
</html>
