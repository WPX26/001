<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E89020">
  <link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册界面原型设计</title>
<style>  /* ===== 屏宽等比缩放基准（王总 2026-08-13）：1rem = 屏宽/375 px，元素长宽只与屏宽成比例，与屏高无关 ===== */
  html { font-size: 0.2667vw; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #F4E8D6 0%, #EBC9A0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20rem;
    overflow-x: hidden;
  }

  .container {
    display: flex;
    gap: 40rem;
    max-width: 100vw; width: 100vw; height: 100vh; margin: 0;
    width: 100%;
    align-items: center;
    justify-content: center;
  }

  /* ========== 左侧手机预览 ========== */
  .phone-wrapper { display: flex; flex-direction: column; align-items: center; }

  .phone-frame {
    width: 100vw;
    height: 100vh;
    background: #F0E4CE;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    position: relative;
  }

  .phone-frame::before {
    display: none;
    content: '';
    position: absolute;
    top: 14rem; left: 50%;
    transform: translateX(-50%);
    width: 120rem; height: 28rem;
    background: #1C0F08;
    border-radius: 0 0 18rem 18rem;
    z-index: 10;
  }

  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
  }

  /* 顶部导航栏 */
  .album-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 44rem 16rem 10rem;
    background: #0a0a0a;
    flex-shrink: 0;
  }

  .back-btn {
    width: 36rem; height: 36rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(255, 255, 255, 0.1); color: #F0A040; }
  .back-btn:active { transform: scale(0.9); }
  .back-btn svg { width: 22rem; height: 22rem; stroke-width: 2; }

  .album-title {
    font-size: 17rem;
    font-weight: 600;
    color: white;
  }

  .album-select {
    width: 36rem; height: 36rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .album-select:hover { background: rgba(255, 255, 255, 0.1); color: #E89020; }
  .album-select:active { transform: scale(0.9); }
  .album-select svg { width: 22rem; height: 22rem; stroke-width: 2; }

  /* 相册内容滚动区 */
  .album-content {
    flex: 1;
    overflow-y: auto;
    background: #0a0a0a;
    -webkit-overflow-scrolling: touch;
  }
  .album-content::-webkit-scrollbar { width: 0; }

  /* 日期分组 */
  .date-section {
    margin-bottom: 2rem;
  }

  .date-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14rem 16rem 10rem;
    cursor: pointer;
    background: #0a0a0a;
    user-select: none;
    transition: background 0.2s;
  }
  .date-header:hover { background: #151515; }

  .date-info {
    display: flex;
    align-items: center;
    gap: 8rem;
  }

  .date-text {
    font-size: 15rem;
    font-weight: 600;
    color: white;
  }

  .date-count {
    font-size: 12rem;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 500;
  }

  .date-arrow {
    width: 24rem; height: 24rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.6);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .date-arrow svg { width: 16rem; height: 16rem; stroke-width: 2.5; }

  .date-section.expanded .date-arrow {
    transform: rotate(90deg);
    color: #F0A040;
  }

  /* 图片网格 */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2rem;
    overflow: hidden;
    max-height: 100rem;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .date-section.expanded .photo-grid {
    max-height: 1000rem;
  }

  .photo-item {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    cursor: pointer;
    background: #1a1a1a;
  }

  .photo-item img,
  .photo-placeholder {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-placeholder {
    position: relative;
    overflow: hidden;
  }

<script>
// ===== 移动端 web-view 桥接（不影响 Web 端 UI/功能） =====
// 1) URL 带 token 时写入 localStorage.memo_token 并清理 URL
// 2) URL 带 full=1 时进入全屏嵌入模式（App 内展示）
// 3) 登录/退出事件桥接：postMessage 通知 App 同步登录态
(function () {
  try {
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (token) {
      localStorage.setItem('memo_token', token);
      params.delete('token');
      var qs = params.toString();
      var url = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
      window.history.replaceState({}, '', url);
    }
    function enterFull(extra) {
      var add = function () {
        document.body.classList.add('full-embed');
        if (extra) document.body.classList.add(extra);
      };
      if (document.body) add();
      else document.addEventListener('DOMContentLoaded', add);
    }
    var isAppWebview = !!(window.uni && uni.postMessage) || (typeof plus !== 'undefined' && plus.android);
    var isPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 600;
    if (params.get('full') === '1' && isPhone) {
      // App web-view 内嵌 / 手机浏览器 full=1：全屏 + 保留 H5 导航（App 壳无 tabBar，导航由网页承担）
      enterFull('mobile-browser');
    } else if (params.get('full') === '1' || isAppWebview) {
      // 桌面 full=1（全屏预览/测试）：全屏无 H5 导航（既有行为不变）
      enterFull();
    } else if (isPhone) {
      // 手机浏览器：自动全屏 App 化，保留 H5 导航（视觉与 App 一致）
      enterFull('mobile-browser');
    }
  } catch (e) {}
})();
</script>

<script>
  // Toast 提示
  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  // 交互提示
  function showHint(msg) {
    const hint = document.getElementById('hint');
    hint.textContent = msg;
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 2500);
  }

  // 日期分组展开/收起
  document.querySelectorAll('.date-header').forEach(header => {
    header.addEventListener('click', () => {
      const section = header.parentElement;
      const isExpanded = section.classList.contains('expanded');
      if (isExpanded) {
        section.classList.remove('expanded');
        showToast('收起');
      } else {
        section.classList.add('expanded');
        showToast('展开全部');
      }
    });
  });

  // 照片点击
  document.querySelectorAll('.photo-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      if (item.style.visibility === 'hidden') return;
      showToast('📷 查看大图');
    });
  });

  // 返回按钮
  document.getElementById('backBtn').addEventListener('click', () => {
    showToast('← 返回相机');
    setTimeout(() => {
      window.location.href = 'camera-prototype.html';
    }, 400);
  });

  // 选择按钮
  document.getElementById('selectBtn')?.addEventListener('click', () => {
    showToast('✓ 已进入选择模式');
  });

  setTimeout(() => showHint('👆 默认显示一排，点击箭头展开全部'), 500);

  // ========== 真实数据对接（已登录 → GET /photos/mine?sortBy=time） ==========
  // 已登录：拉取我的照片按日期分组渲染（复用现有日期分组/照片网格 class 与展开收起逻辑）
  // 未登录：跳登录页；接口失败（服务不可达/业务错误）：回退保留本地占位，保持离线演示，页面不崩
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 本地占位渐变 class（无缩略图时循环复用，视觉与改造前一致）
  var PLACEHOLDER_CLASSES = ['ph-classroom-1', 'ph-classroom-2', 'ph-classroom-3', 'ph-lecture-1', 'ph-lecture-2', 'ph-lecture-3', 'ph-portrait-1', 'ph-portrait-2'];

  // 日期格式化：与现有 data-date 文案一致（2026年7月23日）
  function formatDateKey(d) {
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function parseTime(t) {
    if (!t) return null;
    var d = new Date(t);
    return isNaN(d.getTime()) ? null : d;
  }

  // 按日期分组：优先 takenAt，缺失回退 uploadTime
  function buildDateGroups(photos) {
    var groups = [], map = {};
    photos.forEach(function (p) {
      var t = parseTime(p.takenAt) || parseTime(p.uploadTime);
      var key = t ? formatDateKey(t) : '未知日期';
      if (!map[key]) { map[key] = []; groups.push({ date: key, list: map[key] }); }
      map[key].push(p);
    });
    return groups;
  }

  // 动态渲染日期分组 + 照片网格（复用现有 class，含隐藏占位格，视觉与静态版一致）
  function renderRealAlbum(photos) {
    var content = document.getElementById('albumContent');
    if (!content) return;

    if (!photos || photos.length === 0) {
      content.innerHTML = '<div class="date-section" style="padding:60px 16px;text-align:center;color:rgba(255,255,255,0.45);font-size:13px;">暂无照片，去拍摄第一张吧</div>';
      bindAlbumInteractions(content);
      return;
    }

    var groups = buildDateGroups(photos);
    var badgesSvg = '<div class="photo-badges">' +
      '<div class="photo-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>' +
      '<div class="photo-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>' +
      '</div>';

    content.innerHTML = groups.map(function (g) {
      var items = g.list.map(function (p, i) {
        return '<div class="photo-item" data-id="' + escapeHtml(p.id) + '">' +
          (p.thumbnailUrl
            ? '<img src="' + escapeHtml(p.thumbnailUrl) + '" alt="照片" loading="lazy">'
            : '<div class="photo-placeholder ' + PLACEHOLDER_CLASSES[i % PLACEHOLDER_CLASSES.length] + '"></div>') +
          badgesSvg + '</div>';
      }).join('');
      // 补齐最后一排空格（与静态版一致：3 列网格补全）
      for (var pad = g.list.length; pad % 3 !== 0; pad++) {
        items += '<div class="photo-item" style="visibility:hidden"></div>';
      }
      return '<div class="date-section" data-date="' + escapeHtml(g.date) + '">' +
        '<div class="date-header">' +
        '<div class="date-info">' +
        '<span class="date-text">' + escapeHtml(g.date) + '</span>' +
        '<span class="date-count">' + g.list.length + '</span>' +
        '</div>' +
        '<div class="date-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></div>' +
        '</div>' +
        '<div class="photo-grid">' + items + '</div>' +
        '</div>';
    }).join('');

    bindAlbumInteractions(content);
  }

  // 动态渲染后重新绑定交互（展开/收起 + 照片点击，行为与静态版一致）
  function bindAlbumInteractions(content) {
    content.querySelectorAll('.date-header').forEach(header => {
      header.addEventListener('click', () => {
        const section = header.parentElement;
        const isExpanded = section.classList.contains('expanded');
        if (isExpanded) {
          section.classList.remove('expanded');
          showToast('收起');
        } else {
          section.classList.add('expanded');
          showToast('展开全部');
        }
      });
    });
    content.querySelectorAll('.photo-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        if (item.style.visibility === 'hidden') return;
        showToast('📷 查看大图');
      });
    });
  }

  // 初始化：未登录跳登录页；已登录拉取全部页后渲染；失败回退本地占位
  (function () {
    if (typeof MemoAPI === 'undefined' || !MemoAPI.isLoggedIn()) {
      // App 内置浏览器（web-view）内：显式 full=1 全屏打开登录页；Web 端不带参
      window.location.href = 'login-prototype.html' + ((window.uni && uni.postMessage) ? '?full=1' : '');
      return;
    }
    var all = [];
    function loadPage(page) {
      MemoAPI.get('/photos/mine?sortBy=time&page=' + page + '&pageSize=100').then(function (data) {
        if (!data) return;
        all = all.concat(data.list || []);
        if (data.hasMore && page < 20) { loadPage(page + 1); return; }
        renderRealAlbum(all);
      }).catch(function (e) {
        // 接口失败 → 回退现有本地占位（保持离线演示）
        console.warn('[album] 拉取照片失败，使用本地占位：', e && e.message);
      });
    }
    loadPage(1);
  })();
</script>

</body>
</html>
