<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册界面原型设计</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #F4E8D6 0%, #EBC9A0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .container {
    display: flex;
    gap: 40px;
    max-width: 1100px;
    width: 100%;
    align-items: center;
    justify-content: center;
  }

  /* ========== 左侧手机预览 ========== */
  .phone-wrapper { display: flex; flex-direction: column; align-items: center; }

  .phone-frame {
    width: 320px;
    height: 680px;
    background: #1C0F08;
    border-radius: 42px;
    padding: 14px;
    box-shadow: 0 30px 80px rgba(28, 15, 8, 0.45), 0 0 0 2px rgba(212, 165, 116, 0.25), inset 0 1px 0 rgba(212, 165, 116, 0.1);
    position: relative;
  }

  .phone-frame::before {
    content: '';
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 28px;
    background: #1C0F08;
    border-radius: 0 0 18px 18px;
    z-index: 10;
  }

  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
  }

  /* 顶部导航栏 */
  .album-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 44px 16px 10px;
    background: #0a0a0a;
    flex-shrink: 0;
  }

  .back-btn {
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(255, 255, 255, 0.1); color: #F0A040; }
  .back-btn:active { transform: scale(0.9); }
  .back-btn svg { width: 22px; height: 22px; stroke-width: 2; }

  .album-title {
    font-size: 17px;
    font-weight: 600;
    color: white;
  }

  .album-select {
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .album-select:hover { background: rgba(255, 255, 255, 0.1); color: #E89020; }
  .album-select:active { transform: scale(0.9); }
  .album-select svg { width: 22px; height: 22px; stroke-width: 2; }

  /* 相册内容滚动区 */
  .album-content {
    flex: 1;
    overflow-y: auto;
    background: #0a0a0a;
    -webkit-overflow-scrolling: touch;
  }
  .album-content::-webkit-scrollbar { width: 0; }

  /* 日期分组 */
  .date-section {
    margin-bottom: 2px;
  }

  .date-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    cursor: pointer;
    background: #0a0a0a;
    user-select: none;
    transition: background 0.2s;
  }
  .date-header:hover { background: #151515; }

  .date-info {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .date-text {
    font-size: 15px;
    font-weight: 600;
    color: white;
  }

  .date-count {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 500;
  }

  .date-arrow {
    width: 24px; height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.6);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .date-arrow svg { width: 16px; height: 16px; stroke-width: 2.5; }

  .date-section.expanded .date-arrow {
    transform: rotate(90deg);
    color: #F0A040;
  }

  /* 图片网格 */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    overflow: hidden;
    max-height: 100px;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .date-section.expanded .photo-grid {
    max-height: 1000px;
  }

  .photo-item {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    cursor: pointer;
    background: #1a1a1a;
  }

  .photo-item img,
  .photo-placeholder {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-placeholder {
    position: relative;
    overflow: hidden;
  }

  /* 模拟图片 - 教室场景 */
  .ph-classroom-1 {
    background: linear-gradient(135deg, #3a4a5c 0%, #2c3e50 40%, #5d6d7e 100%);
  }
  .ph-classroom-1::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.4) 100%),
      radial-gradient(ellipse 60% 40% at 50% 30%, rgba(255,255,255,0.1), transparent);
  }

  .ph-classroom-2 {
    background: linear-gradient(160deg, #4a5568 0%, #2d3748 50%, #1a202c 100%);
  }
  .ph-classroom-2::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.5) 100%),
      radial-gradient(ellipse 50% 30% at 40% 25%, rgba(200,200,200,0.08), transparent);
  }

  .ph-classroom-3 {
    background: linear-gradient(145deg, #5c4033 0%, #3e2723 50%, #2d1810 100%);
  }
  .ph-classroom-3::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.45) 100%),
      radial-gradient(ellipse 55% 35% at 55% 30%, rgba(255,255,255,0.1), transparent);
  }

  .ph-lecture-1 {
    background: linear-gradient(150deg, #4a3728 0%, #3e2a1f 40%, #2d1f15 100%);
  }
  .ph-lecture-1::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 25%, rgba(0,0,0,0.5) 100%),
      radial-gradient(ellipse 45% 30% at 50% 20%, rgba(255,255,255,0.08), transparent);
  }

  .ph-lecture-2 {
    background: linear-gradient(135deg, #3d4f5f 0%, #2c3e50 60%, #1a252f 100%);
  }
  .ph-lecture-2::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.4) 100%),
      radial-gradient(ellipse 40% 35% at 45% 28%, rgba(255,255,255,0.1), transparent);
  }

  .ph-lecture-3 {
    background: linear-gradient(155deg, #5c3d2e 0%, #3d2817 50%, #1f140a 100%);
  }
  .ph-lecture-3::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.5) 100%),
      radial-gradient(ellipse 50% 30% at 55% 30%, rgba(255,255,255,0.1), transparent);
  }

  .ph-portrait-1 {
    background: linear-gradient(140deg, #8b7355 0%, #6b5544 40%, #4a3728 100%);
  }
  .ph-portrait-1::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 20%, rgba(0,0,0,0.35) 100%),
      radial-gradient(ellipse 35% 40% at 50% 25%, rgba(255,255,255,0.12), transparent);
  }

  .ph-portrait-2 {
    background: linear-gradient(160deg, #7a6550 0%, #5c4a38 50%, #3d2f22 100%);
  }
  .ph-portrait-2::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 25%, rgba(0,0,0,0.4) 100%),
      radial-gradient(ellipse 30% 35% at 45% 28%, rgba(255,255,255,0.1), transparent);
  }

  /* 图片悬浮/点击效果 */
  .photo-item:active { transform: scale(0.97); }
  .photo-item { transition: transform 0.2s ease; }

  /* 图片上的小图标覆盖层 */
  .photo-badges {
    position: absolute;
    bottom: 6px; left: 6px;
    display: flex;
    gap: 4px;
    z-index: 3;
  }

  .photo-badge {
    width: 18px; height: 18px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.9);
  }
  .photo-badge svg { width: 10px; height: 10px; stroke-width: 2; }

  /* 底部状态栏 */
  .home-indicator {
    width: 100px; height: 4px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 2px;
    margin: 6px auto 8px;
    flex-shrink: 0;
  }

  .interaction-hint {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(28, 15, 8, 0.92);
    color: #F5DFC0;
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(28, 15, 8, 0.25);
  }
  .interaction-hint.show { opacity: 1; }

  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(250, 245, 236, 0.97);
    backdrop-filter: blur(10px);
    padding: 16px 28px;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(28, 15, 8, 0.22);
    font-size: 14px;
    color: #1C0F08;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 200;
    text-align: center;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .toast .toast-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #F0A040, #D4691C);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 10px;
    color: white;
  }

  @media (max-width: 900px) {
    .container { flex-direction: column; gap: 30px; }
  }
</style>
</head>

<!-- Toast -->
<div class="toast" id="toast">

    </svg>
  </div>
  <span id="toastMsg"></span>
</div>

<script>
  // Toast 提示
  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  // 交互提示
  function showHint(msg) {
    const hint = document.getElementById('hint');
    hint.textContent = msg;
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 2500);
  }

  // 日期分组展开/收起
  document.querySelectorAll('.date-header').forEach(header => {
    header.addEventListener('click', () => {
      const section = header.parentElement;
      const isExpanded = section.classList.contains('expanded');
      if (isExpanded) {
        section.classList.remove('expanded');
        showToast('收起');
      } else {
        section.classList.add('expanded');
        showToast('展开全部');
      }
    });
  });

  // 照片点击
  document.querySelectorAll('.photo-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      if (item.style.visibility === 'hidden') return;
      showToast('📷 查看大图');
    });
  });

  // 返回按钮
  document.getElementById('backBtn').addEventListener('click', () => {
    showToast('← 返回相机');
    setTimeout(() => {
      window.location.href = 'camera-prototype.html';
    }, 400);
  });

  // 选择按钮
  document.getElementById('selectBtn')?.addEventListener('click', () => {
    showToast('✓ 已进入选择模式');
  });

  setTimeout(() => showHint('👆 默认显示一排，点击箭头展开全部'), 500);
</script>
