<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷达模式 · 设计稿 v2（方案A / 方案B）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 800px at 30% 20%, #2a2340, #12101c 60%, #0c0a14);
    min-height: 100vh;
    padding: 40px 24px 80px;
    color: #eee;
  }
  .stage-head { text-align: center; margin-bottom: 34px; }
  .stage-head h1 { font-size: 26px; letter-spacing: 2px; font-weight: 800; }
  .stage-head p { margin-top: 8px; font-size: 13px; color: #9a90b8; }
  .stage { display: flex; justify-content: center; gap: 56px; flex-wrap: wrap; align-items: flex-start; }
  .phone {
    width: 375px; height: 812px;
    border-radius: 46px;
    background: #000;
    padding: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
    position: relative;
  }
  .phone .screen {
    width: 100%; height: 100%;
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    background: #0d1117;
  }
  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 28px; background: #000; border-radius: 16px; z-index: 50;
  }
  .cap { text-align: center; margin: 0 0 6px; font-size: 12px; color: #8f86ad; letter-spacing: 1px; }
  .cap b { color: #c9bfff; }

  /* ============ 方案 A：扫描雷达（军事科技风） ============ */
  .screen-a { background: #081018; }
  .a-banner {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 46px 16px 14px;
    background: linear-gradient(180deg, rgba(28,16,54,.98), rgba(20,10,40,.85) 70%, transparent);
    z-index: 20;
    display: flex; align-items: center; gap: 10px;
  }
  .a-banner .radar-ico {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid #9f6bff; position: relative; flex-shrink: 0;
    background: radial-gradient(circle at 50% 50%, #3a1f6e 0%, #180b33 70%);
  }
  .a-banner .radar-ico::before {
    content: ''; position: absolute; inset: 4px; border-radius: 50%;
    border: 1px solid rgba(159,107,255,.55);
  }
  .a-banner .radar-ico .sweep {
    position: absolute; inset: 3px; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(159,107,255,.9), transparent 70deg, transparent);
    animation: sweep 2.2s linear infinite;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .a-banner .txt { flex: 1; }
  .a-banner .txt .t1 { font-size: 15px; font-weight: 800; color: #e8e0ff; letter-spacing: .5px; }
  .a-banner .txt .t2 { font-size: 11px; color: #8a7fb0; margin-top: 3px; }
  .a-banner .close { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.08); color: #c9bfff; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .a-map {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 600px at 50% 55%, #0d1a2b 0%, #0a1626 55%, #081018 100%);
  }
  .a-map .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image:
      linear-gradient(rgba(80,130,255,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,130,255,.09) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .a-map .coast { position: absolute; opacity: .25; filter: blur(1px);
    background: radial-gradient(600px 300px at 30% 40%, #1b3a5c 0%, transparent 60%),
                radial-gradient(400px 500px at 75% 75%, #16314f 0%, transparent 55%); }
  .a-ring { position: absolute; left: 50%; top: 55%; transform: translate(-50%,-50%); width: 560px; height: 560px; border-radius: 50%; }
  .a-ring .r { position: absolute; border-radius: 50%; border: 1px dashed rgba(124,77,255,.8); }
  .a-ring .r1 { inset: 0; border-color: rgba(124,77,255,.9); border-style: solid; }
  .a-ring .r2 { inset: 32px; border-style: dashed; border-color: rgba(124,77,255,.5); }
  .a-ring .r3 { inset: 64px; border-style: dashed; border-color: rgba(124,77,255,.32); }
  .a-ring .fill { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(124,77,255,.10), rgba(124,77,255,.03) 60%, transparent); }
  .a-ring .tick { position: absolute; font-size: 9px; color: rgba(160,140,230,.75); letter-spacing: 1px; }
  .a-ring .tick.tn { top: -18px; left: 50%; transform: translateX(-50%); }
  .a-ring .tick.ts { bottom: -18px; left: 50%; transform: translateX(-50%); }
  .a-ring .tick.te { top: 50%; right: -22px; transform: translateY(-50%); }
  .a-ring .tick.tw { top: 50%; left: -22px; transform: translateY(-50%); }
  .a-ring .dist { position: absolute; font-size: 9px; color: rgba(124,77,255,.6); }
  .a-ring .d1 { bottom: 76px; left: 50%; transform: translateX(-50%); }
  .a-ring .d2 { bottom: 44px; left: 50%; transform: translateX(-50%); }
  .a-ring .d3 { bottom: 12px; left: 50%; transform: translateX(-50%); }
  .a-scan { position: absolute; left: 50%; top: 55%; width: 560px; height: 560px; transform: translate(-50%,-50%); border-radius: 50%; overflow: hidden; pointer-events: none; }
  .a-scan .fan { position: absolute; left: 50%; top: 50%; width: 280px; height: 280px; transform-origin: 0 0;
    background: conic-gradient(from 270deg, rgba(124,77,255,.32), transparent 78deg);
    animation: fan 3.6s linear infinite; }
  @keyframes fan { to { transform: rotate(360deg); } }
  .a-me { position: absolute; left: 50%; top: 55%; transform: translate(-50%,-50%); z-index: 15; }
  .a-me .halo { position: absolute; inset: -30px; border-radius: 50%; border: 1px solid rgba(120,200,255,.5); animation: halo 2.4s ease-out infinite; }
  @keyframes halo { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  .a-me .dot { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9fd8ff, #2196F3 60%, #0b5cad); border: 3px solid #fff; box-shadow: 0 0 14px rgba(33,150,243,.9); }
  .a-me .lab { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); font-size: 10px; color: #bfe3ff; white-space: nowrap; text-shadow: 0 1px 3px #000; }

  .a-p { position: absolute; z-index: 12; }
  .a-p .dot { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c8a4ff, #7C4DFF 55%, #4527A0); border: 2.5px solid #fff; box-shadow: 0 0 12px rgba(124,77,255,.95); position: relative; }
  .a-p .dot::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid rgba(159,107,255,.6); animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
  .a-p .tag { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 9.5px; color: #e6dcff; background: rgba(20,10,40,.72); border: 1px solid rgba(159,107,255,.45); padding: 2px 7px; border-radius: 8px; white-space: nowrap; backdrop-filter: blur(3px); }

  .a-card {
    position: absolute; left: 14px; right: 14px; bottom: 40px; z-index: 30;
    border-radius: 20px; padding: 14px;
    background: rgba(24,14,48,.88); border: 1px solid rgba(159,107,255,.4);
    backdrop-filter: blur(14px);
    box-shadow: 0 14px 40px rgba(0,0,0,.6);
    display: flex; align-items: center; gap: 12px;
  }
  .a-card .ava { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; border: 2px solid #9f6bff;
    background: linear-gradient(135deg,#7C4DFF,#4527A0); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:18px; }
  .a-card .mid { flex: 1; }
  .a-card .mid .n { font-size: 15px; font-weight: 800; color: #f0eaff; }
  .a-card .mid .s { font-size: 11px; color: #a99bd0; margin-top: 4px; }
  .a-card .mid .s .g { display:inline-block; width:7px; height:7px; border-radius:50%; background:#3ddc84; margin-right:5px; box-shadow:0 0 6px #3ddc84; }
  .a-card .btn { flex-shrink: 0; padding: 9px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg,#9f6bff,#6a3fd8); box-shadow: 0 6px 16px rgba(124,77,255,.5); }
  .a-hud { position: absolute; left: 14px; top: 108px; z-index: 18; font-size: 10px; color: rgba(160,200,255,.8);
    background: rgba(8,20,36,.6); border: 1px solid rgba(80,160,255,.25); padding: 6px 10px; border-radius: 9px; line-height: 1.7; }
  .a-hud b { color: #9fd8ff; }

  /* ============ 方案 B：好友定位（社交轻快风） ============ */
  .screen-b { background: #f6f1e9; }
  .b-banner {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    padding: 46px 16px 14px;
    background: linear-gradient(180deg, rgba(255,253,248,.98), rgba(255,253,248,.9) 70%, transparent);
    display: flex; align-items: center; gap: 10px;
  }
  .b-banner .radar-ico { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#b388ff,#7C4DFF); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow: 0 4px 12px rgba(124,77,255,.4); }
  .b-banner .radar-ico svg { width: 17px; height: 17px; }
  .b-banner .txt { flex: 1; }
  .b-banner .txt .t1 { font-size: 15px; font-weight: 800; color: #3a2a1a; }
  .b-banner .txt .t2 { font-size: 11px; color: #9a8a72; margin-top: 3px; }
  .b-banner .close { width: 26px; height: 26px; border-radius: 50%; background: #efe6d8; color: #8a7a62; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .b-map { position: absolute; inset: 0;
    background:
      radial-gradient(700px 500px at 50% 52%, #efe7d8 0%, #e8dfce 60%, #e2d8c5 100%); }
  .b-map .street { position: absolute; opacity: .55; filter: blur(.3px);
    background-image: linear-gradient(rgba(150,130,105,.28) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(150,130,105,.28) 1.5px, transparent 1.5px);
    background-size: 58px 58px; }
  .b-map .park { position: absolute; width: 160px; height: 110px; border-radius: 40% 60% 55% 45%; background: rgba(140,175,120,.5); left: 52px; top: 300px; }
  .b-map .water { position: absolute; width: 130px; height: 90px; border-radius: 60% 40% 45% 55%; background: rgba(120,165,190,.5); right: 40px; bottom: 180px; }
  .b-ring { position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%); width: 500px; height: 500px; border-radius: 50%;
    border: 2px solid rgba(124,77,255,.5); background: radial-gradient(circle, rgba(124,77,255,.10), rgba(124,77,255,.03) 55%, transparent); }
  .b-ring::before { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 1px dashed rgba(124,77,255,.35); }
  .b-me { position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%); z-index: 15; text-align: center; }
  .b-me .halo { position: absolute; inset: -26px; border-radius: 50%; border: 1.5px solid rgba(33,150,243,.55); animation: haloB 2.6s ease-out infinite; }
  @keyframes haloB { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
  .b-me .dot { width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9fd8ff, #2196F3 60%, #0b5cad); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(33,150,243,.6); }
  .b-me .lab { margin-top: 8px; font-size: 10px; color: #5c5140; background: rgba(255,255,255,.85); padding: 2px 8px; border-radius: 8px; box-shadow: 0 2px 6px rgba(90,70,40,.15); }
  .b-p { position: absolute; z-index: 12; }
  .b-p .ava { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 4px 12px rgba(90,70,40,.35); position: relative;
    background: linear-gradient(135deg, #e0835a, #b85a3a); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; }
  .b-p .ava::after { content:''; position:absolute; bottom:-2px; right:-2px; width:12px; height:12px; border-radius:50%; background:#3ddc84; border:2.5px solid #fff; }
  .b-p .nm { margin-top: 6px; text-align:center; font-size: 10.5px; color: #5c5140; background: rgba(255,255,255,.92); padding: 2px 8px; border-radius: 8px; box-shadow: 0 2px 6px rgba(90,70,40,.12); white-space: nowrap; }
  .b-p .ds { position:absolute; left:50%; top:-12px; transform:translateX(-50%); font-size:9px; color:#7a5ce0; background:#fff; padding:1px 7px; border-radius:7px; box-shadow:0 1px 4px rgba(124,77,255,.3); white-space:nowrap; }
  .b-card {
    position: absolute; left: 14px; right: 14px; bottom: 40px; z-index: 30;
    border-radius: 20px; padding: 14px;
    background: rgba(255,255,255,.95); border: 1px solid rgba(124,77,255,.18);
    box-shadow: 0 16px 44px rgba(80,60,30,.22);
    display: flex; align-items: center; gap: 12px;
  }
  .b-card .ava { width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0; border: 2.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 3px 10px rgba(0,0,0,.12);
    background: linear-gradient(135deg, #e0835a, #b85a3a); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; }
  .b-card .mid { flex: 1; }
  .b-card .mid .n { font-size: 15px; font-weight: 800; color: #3a2a1a; }
  .b-card .mid .s { font-size: 11.5px; color: #9a8a72; margin-top: 4px; }
  .b-card .mid .s b { color: #6a4fe0; font-size: 13px; }
  .b-card .mid .s .g { display:inline-block; width:7px; height:7px; border-radius:50%; background:#3ddc84; margin-left:2px; }
  .b-card .btn { flex-shrink: 0; padding: 9px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg,#9f6bff,#6a3fd8); box-shadow: 0 6px 16px rgba(124,77,255,.35); }
</style>
</head>
<body>
  <div class="stage-head">
    <h1>雷达模式 · 设计稿 v2</h1>
    <p>方案 A「扫描雷达」军事科技风 ／ 方案 B「好友定位」社交轻快风 —— 请皇上过目选型</p>
  </div>

  <div class="stage">
    <!-- ========== 方案 A ========== -->
    <div class="phone">
      <div class="screen screen-a">
        <div class="notch"></div>
        <div class="a-map"><div class="grid"></div><div class="coast"></div></div>
        <div class="a-ring">
          <div class="fill"></div>
          <div class="r r1"></div><div class="r r2"></div><div class="r r3"></div>
          <div class="tick tn">N</div><div class="tick ts">S</div><div class="tick te">E</div><div class="tick tw">W</div>
          <div class="dist d3">5km</div><div class="dist d2">3km</div><div class="dist d1">1km</div>
        </div>
        <div class="a-scan"><div class="fan"></div></div>

        <div class="a-p" style="left: 38%; top: 38%;"><div class="dot"></div><div class="tag">1.2km · 小林</div></div>
        <div class="a-p" style="left: 64%; top: 46%;"><div class="dot"></div><div class="tag">2.8km · 阿伟</div></div>
        <div class="a-p" style="left: 56%; top: 72%;"><div class="dot"></div><div class="tag">3.5km · 老周</div></div>

        <div class="a-me"><div class="halo"></div><div class="dot"></div><div class="lab">我的位置</div></div>

        <div class="a-banner">
          <div class="radar-ico"><div class="sweep"></div></div>
          <div class="txt"><div class="t1">雷达扫描中</div><div class="t2">附近 3 位摄影师在线 · 10s 刷新</div></div>
          <div class="close">✕</div>
        </div>

        <div class="a-hud"><b>5km</b> 搜索半径<br><b>10s</b> 位置刷新</div>

        <div class="a-card">
          <div class="ava">林</div>
          <div class="mid">
            <div class="n">@摄影师小林</div>
            <div class="s"><span class="g"></span>工作模式 · 在线 · <b>1.2km</b></div>
          </div>
          <div class="btn">查看主页</div>
        </div>
      </div>
    </div>

    <!-- ========== 方案 B ========== -->
    <div class="phone">
      <div class="screen screen-b">
        <div class="notch"></div>
        <div class="b-map"><div class="street"></div><div class="park"></div><div class="water"></div></div>
        <div class="b-ring"></div>

        <div class="b-p" style="left: 30%; top: 34%;"><div class="ds">1.2km</div><div class="ava">林</div><div class="nm">小林</div></div>
        <div class="b-p" style="left: 63%; top: 44%;"><div class="ds">2.8km</div><div class="ava" style="background:linear-gradient(135deg,#5a8ee0,#3a5fc0)">伟</div><div class="nm">阿伟</div></div>
        <div class="b-p" style="left: 55%; top: 71%;"><div class="ds">3.5km</div><div class="ava" style="background:linear-gradient(135deg,#5abf8a,#3a9c68)">周</div><div class="nm">老周</div></div>

        <div class="b-me"><div class="halo"></div><div class="dot"></div><div class="lab">我的位置</div></div>

        <div class="b-banner">
          <div class="radar-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-4"/>
            </svg>
          </div>
          <div class="txt"><div class="t1">附近摄影师</div><div class="t2">3 位在工作 · 10 秒更新一次</div></div>
          <div class="close">✕</div>
        </div>

        <div class="b-card">
          <div class="ava">林</div>
          <div class="mid">
            <div class="n">@摄影师小林</div>
            <div class="s">工作模式 · 在线<span class="g"></span> · 距离 <b>1.2km</b></div>
          </div>
          <div class="btn">查看主页</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
