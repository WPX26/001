<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E89020">
  <link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支付确认管理</title>
<style>  /* ===== 屏宽等比缩放基准（王总 2026-08-13）：1rem = 屏宽/375 px，元素长宽只与屏宽成比例，与屏高无关 ===== */
  html { font-size: 0.2667vw; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #F4E8D6 0%, #EBC9A0 100%);
    min-height: 100vh;
    padding: 24rem 16rem 40rem;
    overflow-x: hidden;
  }

  .admin-wrap { max-width: 640rem; margin: 0 auto; }

  /* ========== 登录卡片 ========== */
  .login-card {
    background: #FFF5E6;
    border: 1rem solid rgba(212, 165, 116, 0.3);
    border-radius: 20rem;
    padding: 36rem 28rem 32rem;
    margin: 10vh auto 0;
    max-width: 380rem;
    box-shadow: 0 20rem 50rem rgba(28, 15, 8, 0.18);
    text-align: center;
  }
  .login-emblem {
    width: 56rem; height: 56rem;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFD98A 0%, #E8B450 50%, #C08020 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14rem;
    box-shadow: 0 6rem 18rem rgba(232, 180, 80, 0.45);
  }
  .login-emblem svg { width: 26rem; height: 26rem; color: white; }
  .login-title { font-size: 19rem; font-weight: 800; color: #1C0F08; margin-bottom: 6rem; }
  .login-subtitle { font-size: 12rem; color: #8B5E3C; margin-bottom: 24rem; }

  .login-input-wrap {
    position: relative;
    margin-bottom: 16rem;
    text-align: left;
  }
  .login-input-wrap label {
    display: block;
    font-size: 12rem;
    font-weight: 600;
    color: #9B7B5A;
    margin-bottom: 6rem;
    letter-spacing: 0.5rem;
  }
  .login-input {
    width: 100%;
    padding: 13rem 14rem;
    border: 1.5rem solid rgba(212, 165, 116, 0.4);
    border-radius: 12rem;
    background: #FFFDF7;
    font-size: 15rem;
    color: #1C0F08;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .login-input:focus { border-color: #F0A040; }
  .login-input::placeholder { color: #C4A98B; }

  .login-btn {
    width: 100%;
    padding: 14rem;
    border: none;
    border-radius: 14rem;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    color: white;
    font-size: 15rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6rem 18rem rgba(240, 160, 64, 0.4);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8rem;
  }
  .login-btn:hover { transform: translateY(-1rem); box-shadow: 0 8rem 22rem rgba(240, 160, 64, 0.5); }
  .login-btn:active { transform: scale(0.97); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .login-tip { font-size: 11rem; color: #9B7B5A; margin-top: 16rem; line-height: 1.6; }

  /* ========== 主页面 ========== */
  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6rem 4rem 16rem;
  }
  .admin-header-left { display: flex; align-items: center; gap: 10rem; }
  .admin-logo {
    width: 38rem; height: 38rem;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFD98A 0%, #E8B450 50%, #C08020 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4rem 12rem rgba(232, 180, 80, 0.4);
    flex-shrink: 0;
  }
  .admin-logo svg { width: 18rem; height: 18rem; color: white; }
  .admin-title { font-size: 17rem; font-weight: 800; color: #1C0F08; }
  .admin-subtitle { font-size: 11rem; color: #8B5E3C; margin-top: 1rem; }

  .admin-logout {
    display: flex;
    align-items: center;
    gap: 6rem;
    padding: 8rem 14rem;
    border: 1rem solid rgba(212, 165, 116, 0.5);
    border-radius: 10rem;
    background: rgba(250, 245, 236, 0.9);
    color: #8B5E3C;
    font-size: 13rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .admin-logout:hover { background: rgba(240, 160, 64, 0.12); color: #D4691C; }
  .admin-logout svg { width: 15rem; height: 15rem; }

  /* tabs */
  .tabs {
    display: flex;
    gap: 8rem;
    margin-bottom: 16rem;
  }
  .tab {
    flex: 1;
    padding: 12rem 0;
    border: 1rem solid rgba(212, 165, 116, 0.35);
    border-radius: 12rem;
    background: rgba(250, 245, 236, 0.9);
    color: #8B5E3C;
    font-size: 14rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    user-select: none;
  }
  .tab .tab-count {
    display: inline-block;
    min-width: 20rem;
    padding: 1rem 7rem;
    border-radius: 10rem;
    background: rgba(155, 123, 90, 0.18);
    color: #8B5E3C;
    font-size: 11rem;
    font-weight: 700;
    margin-left: 5rem;
    vertical-align: 2rem;
  }
  .tab.active {
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    border-color: transparent;
    color: white;
    box-shadow: 0 5rem 16rem rgba(240, 160, 64, 0.35);
  }
  .tab.active .tab-count { background: rgba(255, 255, 255, 0.25); color: white; }

  .list-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10rem;
    padding: 0 2rem;
  }
  .list-title { font-size: 13rem; font-weight: 700; color: #9B7B5A; letter-spacing: 0.5rem; }
  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 5rem;
    border: none;
    background: none;
    color: #8B5E3C;
    font-size: 12rem;
    font-weight: 600;
    cursor: pointer;
    padding: 4rem 8rem;
    border-radius: 8rem;
    transition: background 0.2s;
  }
  .refresh-btn:hover { background: rgba(240, 160, 64, 0.12); color: #D4691C; }
  .refresh-btn svg { width: 14rem; height: 14rem; }

  /* 订单卡片 */
  .order-list { display: flex; flex-direction: column; gap: 12rem; }
  .order-card {
    background: #FFF5E6;
    border: 1rem solid rgba(212, 165, 116, 0.25);
    border-radius: 16rem;
    padding: 16rem;
    box-shadow: 0 4rem 14rem rgba(28, 15, 8, 0.06);
  }
  .order-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10rem;
    margin-bottom: 10rem;
  }
  .order-id {
    font-size: 12rem;
    font-weight: 700;
    color: #5C3D2E;
    background: rgba(240, 160, 64, 0.14);
    border: 1rem solid rgba(240, 160, 64, 0.25);
    padding: 3rem 10rem;
    border-radius: 8rem;
    word-break: break-all;
  }
  .order-amount {
    font-size: 17rem;
    font-weight: 800;
    color: #D4691C;
    white-space: nowrap;
  }
  .order-card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8rem 12rem;
    padding: 12rem 0;
    border-top: 1rem dashed rgba(212, 165, 116, 0.25);
    border-bottom: 1rem dashed rgba(212, 165, 116, 0.25);
    margin-bottom: 12rem;
  }
  .order-cell .cell-label { font-size: 11rem; color: #9B7B5A; margin-bottom: 3rem; }
  .order-cell .cell-value { font-size: 13rem; font-weight: 600; color: #1C0F08; word-break: break-all; }

  .confirm-btn {
    width: 100%;
    padding: 12rem;
    border: none;
    border-radius: 12rem;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    color: white;
    font-size: 14rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5rem 14rem rgba(240, 160, 64, 0.35);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6rem;
  }
  .confirm-btn:hover { transform: translateY(-1rem); }
  .confirm-btn:active { transform: scale(0.97); }
  .confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .confirm-btn svg { width: 16rem; height: 16rem; }

  .paid-tag {
    width: 100%;
    padding: 11rem;
    border-radius: 12rem;
    background: rgba(92, 173, 92, 0.1);
    border: 1rem solid rgba(92, 173, 92, 0.3);
    color: #2E7D32;
    font-size: 13rem;
    font-weight: 700;
    text-align: center;
  }

  .status-empty {
    background: rgba(250, 245, 236, 0.85);
    border: 1rem dashed rgba(212, 165, 116, 0.4);
    border-radius: 14rem;
    padding: 44rem 20rem;
    text-align: center;
    color: #9B7B5A;
    font-size: 13rem;
    line-height: 1.8;
  }
  .status-empty svg { width: 34rem; height: 34rem; color: #D4B896; margin-bottom: 8rem; }

  .status-loading {
    background: rgba(250, 245, 236, 0.85);
    border-radius: 14rem;
    padding: 30rem;
    text-align: center;
    color: #9B7B5A;
    font-size: 13rem;
  }
  .spin {
    display: inline-block;
    width: 18rem; height: 18rem;
    border: 2.5rem solid #E8D3B4;
    border-top-color: #D4691C;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    vertical-align: -4rem;
    margin-right: 8rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .admin-footer {
    text-align: center;
    font-size: 11rem;
    color: #9B7B5A;
    margin-top: 24rem;
    opacity: 0.8;
  }

  /* 邀请码管理 */
  .invite-gen-row {
    display: flex;
    align-items: center;
    gap: 10rem;
    margin-bottom: 12rem;
  }
  .invite-gen-label {
    font-size: 12rem;
    font-weight: 600;
    color: #9B7B5A;
    flex-shrink: 0;
  }
  .invite-count-input {
    flex: 0 0 96rem;
    padding: 10rem 12rem;
    border: 1.5rem solid rgba(212, 165, 116, 0.4);
    border-radius: 10rem;
    background: #FFFDF7;
    font-size: 14rem;
    font-weight: 600;
    color: #1C0F08;
    outline: none;
    -webkit-appearance: none;
  }
  .invite-count-input:focus { border-color: #F0A040; }
  .invite-gen-btn { flex: 1; width: auto; padding: 12rem; font-size: 13rem; }
  .invite-gen-result { margin-top: 2rem; }
  .invite-gen-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8rem;
  }
  .invite-code-chip {
    display: inline-flex;
    align-items: center;
    padding: 6rem 12rem;
    border-radius: 8rem;
    background: rgba(240, 160, 64, 0.12);
    border: 1rem solid rgba(240, 160, 64, 0.3);
    color: #8B4A1F;
    font-size: 12rem;
    font-weight: 700;
    letter-spacing: 1rem;
    cursor: pointer;
    user-select: all;
    transition: all 0.2s;
  }
  .invite-code-chip:hover { background: rgba(240, 160, 64, 0.2); transform: translateY(-1rem); }
  .invite-code-chip.copied {
    background: rgba(92, 173, 92, 0.18);
    border-color: rgba(92, 173, 92, 0.4);
    color: #2E7D32;
  }
  .invite-code-chip .invite-copy-hint { font-weight: 400; font-size: 10rem; margin-left: 6rem; letter-spacing: 0; }
  .invite-status {
    padding: 3rem 12rem;
    border-radius: 10rem;
    font-size: 12rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .invite-status.unused {
    background: rgba(92, 173, 92, 0.12);
    border: 1rem solid rgba(92, 173, 92, 0.35);
    color: #2E7D32;
  }
  .invite-status.used {
    background: rgba(155, 123, 90, 0.12);
    border: 1rem solid rgba(155, 123, 90, 0.3);
    color: #8B5E3C;
  }
  .invite-code { cursor: pointer; user-select: all; }
  .page-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12rem;
    margin-top: 14rem;
  }
  .page-info { font-size: 12rem; color: #8B5E3C; font-weight: 600; }
  .page-btn {
    padding: 7rem 14rem;
    border: 1rem solid rgba(212, 165, 116, 0.45);
    border-radius: 10rem;
    background: rgba(250, 245, 236, 0.9);
    color: #8B5E3C;
    font-size: 12rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .page-btn:hover:not(:disabled) { background: rgba(240, 160, 64, 0.12); color: #D4691C; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* toast */
  .toast {
    position: fixed;
    top: 56rem;
    left: 50%;
    transform: translateX(-50%) translateY(-16rem);
    background: rgba(28, 15, 8, 0.92);
    color: #FAF5EC;
    font-size: 13rem;
    font-weight: 600;
    padding: 10rem 20rem;
    border-radius: 999rem;
    box-shadow: 0 10rem 30rem rgba(28, 15, 8, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 999;
    max-width: 88vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="admin-wrap">

  <!-- ========== 登录视图 ========== -->
  <div id="loginView">
    <div class="login-card">
      <div class="login-emblem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="login-title">支付确认管理</div>
      <div class="login-subtitle">摄影师订阅 · 人工确认开通</div>
      <div class="login-input-wrap">
        <label for="adminPassword">管理密码</label>
        <input type="password" class="login-input" id="adminPassword" placeholder="请输入管理密码" autocomplete="off">
      </div>
      <button class="login-btn" id="adminLoginBtn" onclick="adminLogin()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        登 录
      </button>
      <div class="login-tip">密码由管理员设置，登录后进入待确认订单列表<br>（如忘记密码请联系系统管理员）</div>
    </div>
  </div>

  <!-- ========== 主视图 ========== -->
  <div id="mainView" class="hidden">
    <div class="admin-header">
      <div class="admin-header-left">
        <div class="admin-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div>
          <div class="admin-title">支付确认管理</div>
          <div class="admin-subtitle">摄影师订阅 · 人工确认开通</div>
        </div>
      </div>
      <button class="admin-logout" onclick="adminLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        退出登录
      </button>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabPending" onclick="switchTab('pending')">待确认<span class="tab-count" id="pendingCount">0</span></div>
      <div class="tab" id="tabHistory" onclick="switchTab('history')">历史<span class="tab-count" id="historyCount">0</span></div>
      <div class="tab" id="tabInvite" onclick="switchTab('invite')">邀请码<span class="tab-count" id="inviteCount">0</span></div>
    </div>

    <div class="list-toolbar">
      <span class="list-title" id="listTitle">待确认订单</span>
      <button class="refresh-btn" onclick="loadCurrentTab()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        刷新
      </button>
    </div>

    <!-- 邀请码生成区（仅"邀请码"tab 显示） -->
    <div id="inviteGenArea" class="hidden">
      <div class="order-card">
        <div class="order-card-top">
          <span class="order-id">生成邀请码</span>
        </div>
        <div class="invite-gen-row">
          <label class="invite-gen-label" for="inviteCountInput">数量</label>
          <input type="number" id="inviteCountInput" class="invite-count-input" value="1" min="1" max="100">
          <button id="inviteGenBtn" class="confirm-btn invite-gen-btn" onclick="generateInviteCodes()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            生成邀请码
          </button>
        </div>
        <div class="invite-gen-result" id="inviteGenResult"></div>
      </div>
    </div>

    <div class="order-list" id="orderList"></div>
  </div>

  <div class="admin-footer hidden" id="footerTip">仅管理员可访问 · 请勿外传</div>
</div>

<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>
(function () {
  'use strict';

  /* ================= 基础工具 ================= */
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* 后端返回结构防御：可能是数组，也可能是 { list: [...] } / { orders: [...] } / { items: [...] } */
  function toList(data) {
    if (!data) return [];
    if (Array.isArray(data)) return data;
    if (Array.isArray(data.list)) return data.list;
    if (Array.isArray(data.orders)) return data.orders;
    if (Array.isArray(data.items)) return data.items;
    return [];
  }

  /* 手机号脱敏：已脱敏（含 *）则原样返回，否则保留前3后4 */
  function maskPhone(phone) {
    if (!phone) return '-';
    phone = String(phone);
    if (phone.indexOf('*') !== -1) return phone;
    if (phone.length === 11) return phone.slice(0, 3) + '****' + phone.slice(7);
    if (phone.length >= 7) return phone.slice(0, 3) + '****' + phone.slice(-4);
    return phone;
  }

  function fmtTime(t) {
    if (!t) return '-';
    var d = new Date(t);
    if (isNaN(d.getTime())) return String(t);
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
           p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  /* 金额显示：后端 amount 单位为分 → 转元（600 分 → ¥6） */
  function fmtAmount(a) {
    if (a === null || a === undefined || a === '') return '0';
    var n = Number(a);
    if (isNaN(n)) return String(a);
    return String(Math.round(n) / 100);
  }

  /* 业务错误 401（errcode 1002 = Token 过期或无效）→ 清 token 回登录页 */
  function handleAuthError(err) {
    if (err && err.code === 1002 && typeof MemoAPI !== 'undefined') {
      MemoAPI.clearAuth();
      showLogin();
      showToast('登录已过期，请重新登录');
      return true;
    }
    return false;
  }

  /* ================= 视图切换 ================= */
  var loginView = document.getElementById('loginView');
  var mainView = document.getElementById('mainView');
  var footerTip = document.getElementById('footerTip');

  function showLogin() {
    loginView.classList.remove('hidden');
    mainView.classList.add('hidden');
    footerTip.classList.add('hidden');
  }

  function showMain() {
    loginView.classList.add('hidden');
    mainView.classList.remove('hidden');
    footerTip.classList.remove('hidden');
    switchTab('pending');
  }

  /* ================= 登录 ================= */
  function adminLogin() {
    if (typeof MemoAPI === 'undefined') {
      showToast('api.js 未加载，请检查部署');
      return;
    }
    var pwInput = document.getElementById('adminPassword');
    var pw = (pwInput.value || '').trim();
    if (!pw) { showToast('请输入管理密码'); return; }

    var btn = document.getElementById('adminLoginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>登录中...';

    MemoAPI.post('/admin/auth/login', { password: pw }).then(function (data) {
      var token = data && (data.token || data.accessToken);
      if (!token) throw new Error('登录失败，请重试');
      MemoAPI.setAuth(token);   // 存入 localStorage（memo_token），后续请求自动带 Bearer
      pwInput.value = '';
      showMain();
      showToast('登录成功');
    }).catch(function (err) {
      btn.disabled = false;
      btn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>登 录';
      if (err && err.network) showToast('服务不可达，请稍后重试');
      else showToast(err && err.message ? err.message : '登录失败');
    });
  }

  /* ================= 主页面 ================= */
  var currentTab = 'pending';
  var listCache = { pending: null, history: null };

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabPending').classList.toggle('active', tab === 'pending');
    document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
    document.getElementById('tabInvite').classList.toggle('active', tab === 'invite');
    document.getElementById('listTitle').textContent =
      tab === 'pending' ? '待确认订单' : tab === 'history' ? '已开通记录' : '邀请码管理';
    // 邀请码生成区仅在"邀请码"tab 显示
    document.getElementById('inviteGenArea').classList.toggle('hidden', tab !== 'invite');
    loadCurrentTab();
  }

  function loadCurrentTab() {
    var listEl = document.getElementById('orderList');
    listEl.innerHTML = '<div class="status-loading"><span class="spin"></span>加载中...</div>';
    if (currentTab === 'pending') {
      loadPending();
    } else if (currentTab === 'history') {
      loadHistory();
    } else {
      loadInviteCodes();
    }
  }

  function renderList(list, isHistory) {
    var listEl = document.getElementById('orderList');
    var countEl = document.getElementById(isHistory ? 'historyCount' : 'pendingCount');
    countEl.textContent = list.length;

    if (!list.length) {
      listEl.innerHTML =
        '<div class="status-empty">' +
          (isHistory
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><br>暂无已开通记录'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><br>暂无待确认订单') +
        '</div>';
      return;
    }

    listEl.innerHTML = list.map(function (o) {
      var orderId = o.orderId || o.id || o.order_id || '-';
      // 付款备注短订单号（orderNo，用户付款时备注的号码，便于人工核对）；确认仍用 orderId
      var orderNo = o.orderNo || o.order_no || orderId;
      var nickname = o.userNickname || o.nickname || o.userName || '-';
      var phone = maskPhone(o.userPhone || o.phone || o.mobile);
      var amount = o.amount !== undefined && o.amount !== null ? o.amount : o.price;
      var createdAt = fmtTime(o.createdAt || o.createTime || o.orderTime);
      var submittedAt = fmtTime(o.submittedAt || o.submitTime || o.paidAt || o.payTime);

      var grid =
        '<div class="order-cell"><div class="cell-label">用户昵称</div><div class="cell-value">' + escapeHtml(nickname) + '</div></div>' +
        '<div class="order-cell"><div class="cell-label">手机号</div><div class="cell-value">' + escapeHtml(phone) + '</div></div>' +
        '<div class="order-cell"><div class="cell-label">下单时间</div><div class="cell-value">' + createdAt + '</div></div>' +
        '<div class="order-cell"><div class="cell-label">已提交时间</div><div class="cell-value">' + submittedAt + '</div></div>';

      var action = isHistory
        ? '<div class="paid-tag">✓ 已开通</div>'
        : '<button class="confirm-btn" onclick="confirmOrder(\'' + escapeAttr(orderId) + '\', this)">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
            '确认开通' +
          '</button>';

      return (
        '<div class="order-card">' +
          '<div class="order-card-top">' +
            '<span class="order-id">订单号 ' + escapeHtml(orderNo) + '</span>' +
            '<span class="order-amount">¥' + escapeHtml(fmtAmount(amount)) + '</span>' +
          '</div>' +
          '<div class="order-card-grid">' + grid + '</div>' +
          action +
        '</div>'
      );
    }).join('');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }

  function loadPending() {
    MemoAPI.get('/admin/payments/pending').then(function (data) {
      renderList(toList(data), false);
    }).catch(function (err) {
      if (handleAuthError(err)) return;
      var listEl = document.getElementById('orderList');
      listEl.innerHTML = '<div class="status-empty">' + (err && err.network ? '服务不可达，点击上方"刷新"重试' : escapeHtml(err && err.message || '加载失败')) + '</div>';
    });
  }

  function loadHistory() {
    MemoAPI.get('/admin/payments/history?status=paid').then(function (data) {
      renderList(toList(data), true);
    }).catch(function (err) {
      if (handleAuthError(err)) return;
      var listEl = document.getElementById('orderList');
      listEl.innerHTML = '<div class="status-empty">' + (err && err.network ? '服务不可达，点击上方"刷新"重试' : escapeHtml(err && err.message || '加载失败')) + '</div>';
    });
  }

  /* ================= 邀请码管理 ================= */
  var INVITE_PAGE_SIZE = 10;
  var invitePage = 1;

  /* 生成邀请码：POST /admin/invite-codes/generate → 显示新码（点击复制）+ 刷新列表 */
  function generateInviteCodes() {
    if (typeof MemoAPI === 'undefined') {
      showToast('api.js 未加载，请检查部署');
      return;
    }
    var input = document.getElementById('inviteCountInput');
    var count = parseInt(input.value, 10);
    if (isNaN(count) || count < 1 || count > 100) {
      showToast('数量需为 1-100 的整数');
      return;
    }

    var btn = document.getElementById('inviteGenBtn');
    var original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>生成中...';

    MemoAPI.post('/admin/invite-codes/generate', { count: count }).then(function (data) {
      btn.disabled = false;
      btn.innerHTML = original;
      var codes = (data && data.codes) || [];
      renderGeneratedCodes(codes);
      showToast('成功生成 ' + codes.length + ' 个邀请码');
      invitePage = 1;
      if (currentTab === 'invite') loadInviteCodes();
    }).catch(function (err) {
      btn.disabled = false;
      btn.innerHTML = original;
      if (handleAuthError(err)) return;
      showToast(err && err.message ? err.message : '生成失败');
    });
  }

  /* 新生成的码渲染为可复制小标签 */
  function renderGeneratedCodes(codes) {
    var el = document.getElementById('inviteGenResult');
    if (!codes || !codes.length) { el.innerHTML = ''; return; }
    el.innerHTML =
      '<div class="invite-gen-chips">' +
        codes.map(function (code) {
          return '<span class="invite-code-chip" title="点击复制" onclick="copyInviteCode(\'' + escapeAttr(code) + '\', this)">' +
                   escapeHtml(code) + '<span class="invite-copy-hint">点击复制</span>' +
                 '</span>';
        }).join('') +
      '</div>';
  }

  /* 复制邀请码（clipboard API，失败回退 execCommand） */
  function copyInviteCode(code, el) {
    if (!code) return;
    function done() {
      showToast('已复制 ' + code);
      if (el) {
        el.classList.add('copied');
        setTimeout(function () { el.classList.remove('copied'); }, 1200);
      }
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = code;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { showToast('请手动复制：' + code); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done).catch(fallback);
    } else {
      fallback();
    }
  }

  /* 邀请码列表（分页）：GET /admin/invite-codes?page&pageSize */
  function loadInviteCodes() {
    MemoAPI.get('/admin/invite-codes?page=' + invitePage + '&pageSize=' + INVITE_PAGE_SIZE).then(function (data) {
      renderInviteList(data);
    }).catch(function (err) {
      if (handleAuthError(err)) return;
      var listEl = document.getElementById('orderList');
      listEl.innerHTML = '<div class="status-empty">' + (err && err.network ? '服务不可达，点击上方"刷新"重试' : escapeHtml(err && err.message || '加载失败')) + '</div>';
    });
  }

  function renderInviteList(data) {
    var list = toList(data);
    var total = data && typeof data.total === 'number' ? data.total : list.length;
    var listEl = document.getElementById('orderList');
    document.getElementById('inviteCount').textContent = total;

    if (!list.length) {
      listEl.innerHTML =
        '<div class="status-empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><br>暂无邀请码，点击上方"生成邀请码"创建' +
        '</div>';
      return;
    }

    var cards = list.map(function (c) {
      var code = c.code || '-';
      var isUsed = c.status === 'used';
      var usedBy = c.usedByNickname || c.usedBy || '-';
      var usedAt = fmtTime(c.usedAt);
      var createdAt = fmtTime(c.createdAt);

      var statusHtml = isUsed
        ? '<span class="invite-status used">已用</span>'
        : '<span class="invite-status unused">未用</span>';

      var grid =
        '<div class="order-cell"><div class="cell-label">使用人</div><div class="cell-value">' + escapeHtml(usedBy) + '</div></div>' +
        '<div class="order-cell"><div class="cell-label">使用时间</div><div class="cell-value">' + usedAt + '</div></div>' +
        '<div class="order-cell"><div class="cell-label">创建时间</div><div class="cell-value">' + createdAt + '</div></div>';

      return (
        '<div class="order-card">' +
          '<div class="order-card-top">' +
            '<span class="order-id invite-code" title="点击复制" onclick="copyInviteCode(\'' + escapeAttr(code) + '\', this)">' + escapeHtml(code) + '</span>' +
            statusHtml +
          '</div>' +
          '<div class="order-card-grid">' + grid + '</div>' +
        '</div>'
      );
    }).join('');

    var totalPages = Math.max(1, Math.ceil(total / INVITE_PAGE_SIZE));
    var pageBar =
      '<div class="page-bar">' +
        '<button class="page-btn" onclick="switchInvitePage(' + (invitePage - 1) + ')"' + (invitePage <= 1 ? ' disabled' : '') + '>上一页</button>' +
        '<span class="page-info">第 ' + invitePage + ' / ' + totalPages + ' 页 · 共 ' + total + ' 条</span>' +
        '<button class="page-btn" onclick="switchInvitePage(' + (invitePage + 1) + ')"' + (invitePage >= totalPages ? ' disabled' : '') + '>下一页</button>' +
      '</div>';

    listEl.innerHTML = cards + pageBar;
  }

  function switchInvitePage(page) {
    if (page < 1) return;
    invitePage = page;
    loadCurrentTab();
  }

  /* ================= 确认开通 ================= */
  function confirmOrder(orderId, btn) {
    if (!orderId || orderId === '-') { showToast('订单号无效'); return; }
    var original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>确认中...';

    MemoAPI.post('/admin/payments/' + encodeURIComponent(orderId) + '/confirm').then(function () {
      showToast('已确认开通订单 ' + orderId);
      if (currentTab === 'pending') loadPending();
    }).catch(function (err) {
      btn.disabled = false;
      btn.innerHTML = original;
      if (handleAuthError(err)) return;
      showToast(err && err.message ? err.message : '确认失败');
    });
  }

  /* ================= 退出登录 ================= */
  function adminLogout() {
    if (typeof MemoAPI !== 'undefined') MemoAPI.clearAuth();
    showLogin();
    showToast('已退出登录');
  }

  /* ================= 初始化 ================= */
  function init() {
    // 已存在 token（memo_token）则直接进入主页面，否则显示登录页
    if (typeof MemoAPI !== 'undefined' && MemoAPI.getToken()) {
      showMain();
    } else {
      showLogin();
    }
    // Enter 键提交登录
    document.getElementById('adminPassword').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') adminLogin();
    });
  }

  // 暴露给全局（onclick 使用）
  window.adminLogin = adminLogin;
  window.adminLogout = adminLogout;
  window.switchTab = switchTab;
  window.loadCurrentTab = loadCurrentTab;
  window.confirmOrder = confirmOrder;
  window.generateInviteCodes = generateInviteCodes;
  window.copyInviteCode = copyInviteCode;
  window.switchInvitePage = switchInvitePage;

  init();
})();
</script>
</body>
</html>
