<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E89020">
  <link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移动端登录页面原型设计</title>
<style>  /* ===== 屏宽等比缩放基准（王总 2026-08-13）：1rem = 屏宽/375 px，元素长宽只与屏宽成比例，与屏高无关 ===== */
  html { font-size: 0.2667vw; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20rem;
    overflow-x: hidden;
  }

  .container {
    display: flex;
    gap: 40rem;
    max-width: 100vw;
    width: 100vw;
    height: 100vh;
    align-items: center;
    justify-content: center;
    margin: 0;
  }

  /* ========== 左侧手机预览 ========== */
  .phone-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .phone-frame {
    width: 100vw;
    height: 100vh;
    background: #1C0F08;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    position: relative;
  }

  .phone-frame::before {
    display: none;
    content: '';
    position: absolute;
    top: 14rem;
    left: 50%;
    transform: translateX(-50%);
    width: 120rem;
    height: 28rem;
    background: #1C0F08;
    border-radius: 0 0 18rem 18rem;
    z-index: 10;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    /* 精修：顶部奶油柔光罩 + 琥珀主调渐变，底部深琥珀收尾 */
    /* 王总要求：纯深褐均匀底色，无渐变无光斑，比卡片更深 */
    background: #120A05;
  }

  /* 设计基准：内容区铺满视口，卡片按固定画面比例（宽 2/3、高 13/20）严格居中 */
  .screen-content {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14rem 20rem 6rem;
    color: #F5DFC0;
    font-size: 13rem;
    font-weight: 600;
  }

  .status-icons { display: flex; gap: 5rem; align-items: center; }
  .status-icons svg { width: 16rem; height: 11rem; }

  .login-container {
    position: relative;
    z-index: 2;
    padding: 18rem 0 14rem;
    height: 100%; /* 状态栏为绝对定位不占布局，卡片比例严格基于整个画面 */
    display: flex;
    flex-direction: column;
    align-items: center;          /* 卡片水平居中 */
    justify-content: center;      /* 旧浏览器回退 */
    justify-content: safe center; /* 内容超高时自动贴顶，顶部可达 */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }


  /* ===== 品牌区（精修新增） ===== */
  .brand-logo {
    width: 98rem;
    height: 83rem;
    margin: 0 auto 10rem;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 8rem 22rem rgba(28, 15, 8, 0.35));
    animation: fadeUp 0.55s cubic-bezier(0.22, 0.9, 0.35, 1) both;
  }
  .brand-logo svg { width: 100%; height: 100%; }

  .login-header { text-align: center; margin-bottom: 14rem; animation: fadeUp 0.55s 0.08s cubic-bezier(0.22, 0.9, 0.35, 1) both; }
  .login-title {
    font-size: 20rem;
    font-weight: 700;
    color: #F5DFC0;
    margin-bottom: 3rem;
    letter-spacing: 1rem;
  }
  .login-subtitle {
    font-size: 11rem;
    color: rgba(245, 223, 192, 0.65);
    letter-spacing: 0.5rem;
  }

  /* 入场动画 */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14rem); }
    to   { opacity: 1; transform: none; }
  }

  /* 毛玻璃卡片（精修：底色加深保证对比度 + 顶部一线高光） */
  .login-card {
    background: rgba(28, 15, 8, 0.6);
    backdrop-filter: blur(24rem);
    -webkit-backdrop-filter: blur(24rem);
    border-radius: 20rem;
    padding: 12rem 12rem;
    border: 1rem solid rgba(212, 165, 116, 0.28);
    box-shadow: 0 14rem 44rem rgba(28, 15, 8, 0.22), inset 0 1rem 0 rgba(212, 165, 116, 0.12);
    position: relative;
    animation: fadeUp 0.6s 0.16s cubic-bezier(0.22, 0.9, 0.35, 1) both;
    /* 王总要求：卡片宽 = 画面宽 70%、高 = 画面高 60%，任意视口缩放不变 */
    width: 70%;
    height: 60%;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;      /* 内容少时居中 */
    justify-content: safe center; /* 内容超高时贴顶 + 卡片内滚动 */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1rem;
    border-radius: 20rem 20rem 0 0;
    background: linear-gradient(90deg, transparent, rgba(212, 165, 116, 0.55), transparent);
    pointer-events: none;
  }

  .input-group {
    margin-bottom: 10rem;
  }

  .input-label {
    font-size: 10rem;
    color: #F5DFC0;
    margin-bottom: 4rem;
    display: block;
    font-weight: 500;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper svg {
    position: absolute;
    left: 12rem;
    width: 16rem;
    height: 16rem;
    color: rgba(245, 223, 192, 0.5);
    transition: color 0.3s;
  }

  .input-field {
    width: 100%;
    height: 40rem;
    padding: 0 12rem 0 36rem;
    background: rgba(28, 15, 8, 0.55);
    border: 1.5rem solid rgba(212, 165, 116, 0.35);
    border-radius: 11rem;
    font-size: 11rem;
    color: #F5DFC0;
    outline: none;
    caret-color: #E89020;
    transition: all 0.3s ease;
  }

  /* 框内占位提示文字（请输入手机号/验证码…）：缩小两号，独立于输入文字 */
  .input-field::placeholder { color: rgba(245, 223, 192, 0.55); font-size: 10rem; }

  .input-field:focus {
    background: rgba(28, 15, 8, 0.72);
    border-color: #E89020;
    box-shadow: 0 0 0 4rem rgba(232, 144, 32, 0.16);
  }

  .input-wrapper:focus-within svg { color: #E89020; }

  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8rem 0 10rem;
    font-size: 11rem;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 6rem;
    cursor: pointer;
    color: #F5DFC0;
    user-select: none;
  }

  /* 视觉隐藏而非 display:none：保留键盘焦点与读屏可达性 */
  .remember-me input {
    position: absolute;
    width: 1rem; height: 1rem;
    clip-path: inset(50%);
    overflow: hidden;
    white-space: nowrap;
  }
  .remember-me input:focus-visible + .checkbox {
    outline: 2rem solid #E89020;
    outline-offset: 2rem;
  }

  .checkbox {
    width: 16rem;
    height: 16rem;
    border: 1.5rem solid #9B7B5A;
    border-radius: 5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    background: rgba(28, 15, 8, 0.5);
  }

  .remember-me input:checked + .checkbox {
    background: linear-gradient(135deg, #F0A040, #D4691C);
    border-color: transparent;
  }

  .checkbox svg {
    width: 10rem; height: 10rem;
    color: #4A2A0E;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.25s ease;
  }

  .remember-me input:checked + .checkbox svg {
    opacity: 1;
    transform: scale(1);
  }

  .forgot-link {
    color: #FFB84D;
    text-decoration: none;
    transition: color 0.2s;
    cursor: pointer;
  }
  .forgot-link:hover { color: #FFD28A; text-decoration: underline; }

  .login-btn {
    width: 100%;
    height: 42rem;
    background: linear-gradient(135deg, #F0A040 0%, #D4691C 100%);
    border: none;
    border-radius: 11rem;
    color: #4A2A0E;
    font-size: 13rem;
    font-weight: 600;
    letter-spacing: 2rem;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.25s ease,
                filter 0.2s ease,
                background 0.3s ease;
    box-shadow: 0 6rem 24rem rgba(232, 144, 32, 0.5),
                inset 0 1rem 0 rgba(212, 165, 116, 0.25),
                inset 0 -2rem 0 rgba(184, 90, 16, 0.2);
    position: relative;
    overflow: hidden;
  }

  .login-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212, 165, 116, 0.3), transparent);
    transition: left 0.5s ease;
    z-index: 1;
  }

  .login-btn:hover::before { left: 100%; }

  .login-btn:hover {
    transform: translateY(-2rem);
    box-shadow: 0 10rem 30rem rgba(232, 144, 32, 0.6),
                inset 0 1rem 0 rgba(212, 165, 116, 0.3),
                inset 0 -2rem 0 rgba(184, 90, 16, 0.2);
    filter: brightness(1.08);
  }

  .login-btn:active {
    transform: translateY(1rem) scale(0.98);
    box-shadow: 0 2rem 8rem rgba(232, 144, 32, 0.4),
                inset 0 2rem 4rem rgba(184, 90, 16, 0.3),
                inset 0 -1rem 0 rgba(212, 165, 116, 0.1);
    filter: brightness(0.95);
    transition: transform 0.1s ease,
                box-shadow 0.1s ease,
                filter 0.1s ease;
  }

  /* 涟漪效果 */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(212, 165, 116, 0.3);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes rippleAnim {
    to {
      transform: scale(2.5);
      opacity: 0;
    }
  }

  .register-link {
    text-align: center;
    margin-top: 8rem;
    font-size: 10.5rem;
    color: rgba(245, 223, 192, 0.72);
  }

  .register-link a {
    color: #FFB84D;
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.2s;
  }
  .register-link a:hover { color: #FFD28A; text-decoration: underline; }

  /* 页脚协议（精修新增） */
  /* 页脚协议：屏幕最底部半透明胶囊条（王总 2026-08-13） */
  .terms {
    position: absolute;
    bottom: 26rem;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 8rem;
    color: rgba(245, 223, 192, 0.38);
    background: rgba(28, 15, 8, 0.25);
    backdrop-filter: blur(8rem);
    -webkit-backdrop-filter: blur(8rem);
    padding: 5rem 14rem;
    border-radius: 12rem;
    border: 1rem solid rgba(212, 165, 116, 0.12);
    letter-spacing: 0.3rem;
    z-index: 3;
  }
  .terms span { color: rgba(255, 184, 77, 0.7); }

  .home-indicator {
    position: absolute;
    bottom: 8rem;
    left: 50%;
    transform: translateX(-50%);
    width: 100rem;
    height: 4rem;
    background: rgba(28, 15, 8, 0.4);
    border-radius: 2rem;
    z-index: 5;
  }

  /* 交互提示 */
  .interaction-hint {
    position: fixed;
    bottom: 20rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28, 15, 8, 0.92);
    color: #F5DFC0;
    padding: 10rem 22rem;
    border-radius: 20rem;
    font-size: 13rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 100;
    box-shadow: 0 4rem 20rem rgba(28, 15, 8, 0.25);
  }
  .interaction-hint.show { opacity: 1; }

  /* Toast 提示 */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(28, 15, 8, 0.92);
    backdrop-filter: blur(10rem);
    -webkit-backdrop-filter: blur(10rem);
    padding: 16rem 28rem;
    border-radius: 14rem;
    box-shadow: 0 10rem 40rem rgba(28, 15, 8, 0.22);
    font-size: 14rem;
    color: #F5DFC0;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 20;
    text-align: center;
    max-width: 280rem;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .toast .toast-icon {
    width: 40rem; height: 40rem;
    border-radius: 50%;
    background: linear-gradient(135deg, #F0A040, #D4691C);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 10rem;
    color: #4A2A0E;
  }

  /* 登录方式 Tab（精修：深色胶囊内选中项改为琥珀渐变，与主按钮呼应） */
  .login-tabs {
    display: flex;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 12rem;
    padding: 3rem;
    margin-bottom: 10rem;
    gap: 3rem;
  }
  .login-tab {
    flex: 1;
    padding: 6rem 0;
    text-align: center;
    border-radius: 10rem;
    font-size: 11rem;
    font-weight: 600;
    color: rgba(245, 223, 192, 0.7);
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5rem;
  }
  .login-tab svg { width: 14rem; height: 14rem; }
  .login-tab:hover { color: #F5DFC0; }
  /* Tab 内 radio 视觉隐藏：保留键盘切换与读屏语义（JS 零改动，click 冒泡不变） */
  .tab-radio {
    position: absolute;
    width: 1rem; height: 1rem;
    clip-path: inset(50%);
    overflow: hidden;
    white-space: nowrap;
  }
  .login-tab:focus-within {
    outline: 2rem solid rgba(232, 144, 32, 0.9);
    outline-offset: -2rem;
  }
  .login-tab.active {
    background: linear-gradient(135deg, #F0A040, #D4691C);
    color: #4A2A0E;
    box-shadow: 0 2rem 10rem rgba(232, 144, 32, 0.35), inset 0 1rem 0 rgba(212, 165, 116, 0.3);
  }

  /* 密码可见切换 */
  .pwd-toggle {
    position: absolute;
    right: 10rem;
    width: 26rem; height: 26rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(245, 223, 192, 0.5);
    border-radius: 50%;
    transition: color 0.2s;
    z-index: 2;
  }
  .pwd-toggle:hover { color: #FFB84D; }
  .pwd-toggle svg { width: 15rem; height: 15rem; stroke-width: 2; }
  .input-wrapper .input-field { padding-right: 14rem; }
  .input-wrapper:has(.pwd-toggle) .input-field { padding-right: 40rem; }

  /* 验证码发送按钮 */
  .code-row { display: flex; gap: 10rem; }
  .code-row .input-wrapper { flex: 1; }
  .send-code-btn {
    height: 40rem;
    padding: 0 14rem;
    background: rgba(28, 15, 8, 0.55);
    border: 1.5rem solid #FFB84D;
    border-radius: 11rem;
    color: #FFB84D;
    font-size: 11rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 84rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-code-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, #F0A040, #D4691C);
    color: #4A2A0E;
    transform: translateY(-1rem);
    box-shadow: 0 4rem 12rem rgba(232, 144, 32, 0.4);
  }
  .send-code-btn:active:not(:disabled) {
    transform: translateY(0) scale(0.97);
  }
  .send-code-btn:disabled {
    background: rgba(212, 165, 116, 0.25);
    border-color: rgba(155, 123, 90, 0.4);
    color: rgba(245, 223, 192, 0.5);
    cursor: not-allowed;
  }

  /* 第三方登录（精修：实底深棕圆钮 + 手绘品牌 SVG） */
  .divider {
    display: flex;
    align-items: center;
    margin: 4rem 0 6rem;
    color: rgba(245, 223, 192, 0.5);
    font-size: 11rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1rem;
    background: rgba(212, 165, 116, 0.3);
  }
  .divider span { padding: 0 12rem; }
  .social-login {
    display: flex;
    justify-content: center;
    gap: 20rem;
  }
  .social-btn {
    width: 36rem; height: 36rem;
    border-radius: 50%;
    border: 1.5rem solid rgba(212, 165, 116, 0.35);
    background: #1C0F08;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    color: #F5DFC0;
  }
  .social-btn svg { width: 18rem; height: 18rem; }
  .social-btn:hover {
    transform: translateY(-2rem);
    border-color: #E89020;
    color: #E89020;
    box-shadow: 0 4rem 14rem rgba(28, 15, 8, 0.3);
  }
  .social-btn:active { transform: scale(0.94); }

  /* 表单错误提示 */
  .field-hint {
    font-size: 10rem;
    margin-top: 4rem;
    padding-left: 4rem;
    display: none;
  }
  .field-hint.show { display: block; }
  .field-hint.error { color: #FF7A5C; }
  .field-hint.ok { color: #66C76E; }

  /* 响应式 */
  @media (max-width: 900rem) {
    .container { flex-direction: column; gap: 30rem; }
  }

  /* ===== 高度流动降级 ===== */
  /* 矮窗口（横屏/PC 拉矮/小屏机）：内容贴顶 + 压缩间距，保证一屏放得下 */
  @media (max-height: 620rem) {
    .login-container { justify-content: flex-start; }
    .brand-logo { width: 98rem; height: 83rem; margin-bottom: 6rem; }
    .login-header { margin-bottom: 10rem; }
    .input-group { margin-bottom: 10rem; }
    .login-card { padding: 12rem 14rem; }
    .form-options { margin: 8rem 0 10rem; }
    .divider { margin: 6rem 0 8rem; }
    .register-link { margin-top: 10rem; }
    .terms { margin-top: 6rem; }
  }

  /* 窄屏（320rem 老机型）：收窄容器内边距，输入框图标让位 */
  @media (max-width: 340rem) {
    .login-container { padding: 16rem 0 12rem; }
    .login-card { padding: 16rem 14rem; }
    .input-field { padding-left: 34rem; }
  }

  /* 极端矮窗口（横屏/小屏机）：二级压缩，副标题让位 */
  @media (max-height: 560rem) {
    .login-header { margin-bottom: 8rem; }
    .login-subtitle { display: none; }
    .brand-logo { width: 82rem; height: 70rem; margin-bottom: 4rem; }
    .login-card { padding: 12rem 14rem; }
  }

  /* 移动端输入框 16rem：避免 iOS Safari 聚焦自动缩放破坏 375 定宽布局 */
  @media (max-width: 480rem) {
    .input-field { font-size: 16rem; }
  }

  /* ===== 移动端 web-view 全屏适配（URL ?full=1 时生效，不影响 Web 端展示） ===== */
  body.full-embed { padding: 0; }
  body.full-embed .container { max-width: none; gap: 0; }
  body.full-embed .phone-wrapper { width: 100%; }
  body.full-embed .phone-frame {
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* iOS Safari 地址栏展开时取动态视口高 */
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }
  body.full-embed .phone-frame::before { display: none; }
  body.full-embed .phone-screen { border-radius: 0; }
  body.full-embed .status-bar { display: none; }
  body.full-embed .bottom-nav,
  body.full-embed .home-indicator { display: none; }

  /* 移动端浏览器 App 化：自动全屏但保留 H5 底部导航（手机浏览器无原生 tabBar） */
  body.full-embed.mobile-browser .bottom-nav,
  body.full-embed.mobile-browser .home-indicator { display: flex; }
  /* 仅当页面确实有底部导航时扣减高度（登录/注册页无 bottom-nav，不扣） */
  body.full-embed.mobile-browser .phone-frame { height: 100dvh; }
  body.full-embed.mobile-browser:has(.bottom-nav) .phone-frame { height: calc(100dvh - 56rem); }

  /* 行书字体本地化（王总 2026-08-14：品牌工一堂用可商用行书——玄宗体 XuanZongTi，SIL OFL 1.1，与 splash 页一致；子集仅工一堂三字） */
  @font-face {
    font-family: 'XuanZongTiLocal';
    src: url('./fonts/XuanZongTi-subset.otf') format('opentype'),

<script>
// ===== 移动端 web-view 桥接（不影响 Web 端 UI/功能） =====
// 1) URL 带 token 时写入 localStorage.memo_token 并清理 URL
// 2) URL 带 full=1 时进入全屏嵌入模式（App 内展示）
// 3) 登录/退出事件桥接：postMessage 通知 App 同步登录态
(function () {
  try {
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (token) {
      localStorage.setItem('memo_token', token);
      params.delete('token');
      var qs = params.toString();
      var url = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
      window.history.replaceState({}, '', url);
    }
    function enterFull(extra) {
      var add = function () {
        document.body.classList.add('full-embed');
        if (extra) document.body.classList.add(extra);
      };
      if (document.body) add();
      else document.addEventListener('DOMContentLoaded', add);
    }
    var isAppWebview = !!(window.uni && uni.postMessage);
    if (params.get('full') === '1' || isAppWebview) {
      // App web-view 内嵌（含 H5 内部跳转页）：全屏 + 隐藏 H5 导航（自定义 tabBar 承担导航）
      enterFull();
    } else if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 600) {
      // 手机浏览器：自动全屏 App 化，保留 H5 导航（视觉与 App 一致）
      enterFull('mobile-browser');
    }
  } catch (e) {}
})();
</script>

  var hint = document.getElementById('hint');
  var hintTimer;
  function showHint(msg, duration) { duration = duration || 2000; hint.textContent = msg; hint.classList.add('show'); clearTimeout(hintTimer); hintTimer = setTimeout(function() { hint.classList.remove('show'); }, duration); }

  var toast = document.getElementById('toast');
  var toastMsg = document.getElementById('toastMsg');
  function showToast(msg, type, duration) {
    duration = duration || 2000; toastMsg.textContent = msg;
    toast.querySelector('.toast-icon').innerHTML = type === 'warning'
      ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A2A0E" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A2A0E" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function() { toast.classList.remove('show'); }, duration);
  }

  function ripple(e) {
    var btn = e.currentTarget;
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
    var y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
    var el = document.createElement('span'); el.className = 'ripple';
    el.style.width = el.style.height = size + 'px'; el.style.left = x + 'px'; el.style.top = y + 'px';
    btn.appendChild(el);
    el.addEventListener('animationend', function() { el.remove(); });
  }

    panelPwd.style.display = isCode ? 'none' : '';
  });

      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  });

  // ========== 验证码登录（API 就绪） ==========
  var phoneLogin = document.getElementById('phoneLogin');
  var phoneLoginHint = document.getElementById('phoneLoginHint');
  var codeLogin = document.getElementById('codeLogin');
  var sendCodeLoginBtn = document.getElementById('sendCodeLoginBtn');
  var codeLoginBtn = document.getElementById('codeLoginBtn');
  var loginGeneratedCode = '';
  var loginCodeCountdown = 0;
  var loginCountdownTimer = null;

  phoneLogin.addEventListener('input', function() { phoneLogin.value = phoneLogin.value.replace(/\D/g, ''); });

  // 验证码：优先调真实后端 POST /auth/send-code（开发模式响应 devCode 即真实后端生成的验证码）；
  // 服务不可达时回退本地模拟生成，保证原型可离线演示。UI（toast/倒计时）完全不变。
  function sendLoginCode(phone) {
    if (typeof MemoAPI === 'undefined') return mockSendLoginCode(phone);
    return MemoAPI.post('/auth/send-code', { phone: phone, scene: 'login' }).then(function(data) {
      var devCode = data && data.devCode;
      if (!devCode) { loginGeneratedCode = ''; return { ok: false, msg: '未获取到验证码，请重试' }; }
      loginGeneratedCode = devCode;
      showToast('验证码: ' + devCode + '（模拟短信）');
      return { ok: true };
    }).catch(function(e) {
      if (e && e.business) return { ok: false, msg: e.message };
      return mockSendLoginCode(phone);
    });
  }

  // 后端不可达时的本地模拟：随机生成验证码并 toast 展示
  function mockSendLoginCode(phone) {
    var code = String(Math.floor(100000 + Math.random() * 900000));
    loginGeneratedCode = code;
    showToast('验证码: ' + code + '（模拟短信）');
    return Promise.resolve({ ok: true });
  }

  sendCodeLoginBtn.addEventListener('click', function() {
    var phone = phoneLogin.value.trim();
    if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确的手机号', 'warning'); return; }
    sendLoginCode(phone).then(function(r) {
      if (!r.ok) return;
      loginCodeCountdown = 60;
      sendCodeLoginBtn.disabled = true;
      if (loginCountdownTimer) clearInterval(loginCountdownTimer);
      loginCountdownTimer = setInterval(function() {
        loginCodeCountdown--;
        sendCodeLoginBtn.textContent = loginCodeCountdown + 's 后重发';
        if (loginCodeCountdown <= 0) { clearInterval(loginCountdownTimer); sendCodeLoginBtn.disabled = false; sendCodeLoginBtn.textContent = '验证码'; }
      }, 1000);
    });
  });

  // 会话级登录标记：本会话内登录成功（含模拟登录）后，回首页不再弹登录引导；
  // 会话结束（关闭页面）后残留 mock token 不算已登录（见 api.js isLoggedIn），
  // 未登录时首页登录引导照常弹出——同时满足"登录后不打扰"与"未登录要提示"
  function markSessionLoggedIn() {
    try { sessionStorage.setItem('memo_session_logged_in', '1'); } catch (e) {}
  }

  // 登录：优先调真实后端 POST /auth/login（成功保存 token+user）；
  // 服务不可达时回退本地模拟校验，跳转 memo-home.html 逻辑不变。
  function loginByCode(phone, code) {
    if (typeof MemoAPI !== 'undefined') {
      return MemoAPI.post('/auth/login', { phone: phone, code: code }).then(function(data) {
        if (data && data.token) {
          MemoAPI.setAuth(data.token, data.user || {});
          markSessionLoggedIn();
          return { ok: true };
        }
        return { ok: false, msg: '登录失败，请重试' };
      }).catch(function(e) {
        if (e && e.business) return { ok: false, msg: e.message };
        return mockLoginByCode(phone, code);
      });
    }
    return mockLoginByCode(phone, code);
  }

  // 后端不可达时的本地模拟：与本地生成的验证码比对
  function mockLoginByCode(phone, code) {
    return new Promise(function(resolve) {
      if (loginGeneratedCode && code === loginGeneratedCode) {
        var token = 'mock_jwt_' + Date.now();
        // 本地模拟登录成功同样写入登录态（token+user），
        // 避免跳回 memo-home.html 后 isLoggedIn() 仍为 false 而再次弹出"提示登录"
        if (typeof MemoAPI !== 'undefined') MemoAPI.setAuth(token, { phone: phone });
        markSessionLoggedIn();
        resolve({ ok: true, token: token });
      } else {
        resolve({ ok: false, msg: '验证码不正确' });
      }
    });
  }

  codeLoginBtn.addEventListener('click', function(e) {
    ripple(e);
    var phone = phoneLogin.value.trim();
    var code = codeLogin.value.trim();
    if (!/^1\d{10}$/.test(phone)) { showToast('请输入正确的手机号', 'warning'); return; }
    if (!code) { showToast('请输入验证码', 'warning'); return; }
    loginByCode(phone, code).then(function(r) {
      if (r.ok) {
        showToast('✅ 登录成功!');
        // App 内嵌（web-view）：通知 App 同步登录态并切换首页，不执行 H5 跳转
        if (window.uni && uni.postMessage) {
          uni.postMessage({ data: { type: 'memo_login', token: localStorage.getItem('memo_token') || '', user: localStorage.getItem('memo_user') || '' } });
          return;
        }
        setTimeout(function() { window.location.href = 'memo-home.html'; }, 1200);
      }
      else { showToast(r.msg || '验证码错误', 'warning'); }
    });
  });

  // ========== 密码登录 ==========
  var loginBtn = document.getElementById('loginBtn');
  loginBtn.addEventListener('click', function(e) {
    ripple(e);
    var username = document.getElementById('username').value.trim();
    var password = pwdInput.value;
    if (!username || !password) { showToast('请输入账号和密码', 'warning'); return; }
    // 本地模拟密码登录成功同样写入登录态（token+user），
    // 避免跳回 memo-home.html 后 isLoggedIn() 仍为 false 而再次弹出"提示登录"
    if (typeof MemoAPI !== 'undefined') {
      MemoAPI.setAuth('mock_pwd_' + Date.now(), { username: username });
    }
    markSessionLoggedIn();
    showToast('✅ 登录成功!');
    setTimeout(function() { window.location.href = 'memo-home.html'; }, 1200);
  });

  // 回车提交
  document.querySelectorAll('.input-field').forEach(function(input) {
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        if (panelCode.style.display !== 'none') codeLoginBtn.click();
        else loginBtn.click();
      }
    });
  });

  // 记住我
  document.getElementById('remember').addEventListener('change', function(e) {
    showHint(e.target.checked ? '已勾选记住我' : '已取消记住我');
  });

  // 忘记密码
  document.getElementById('forgotBtn').addEventListener('click', function() {
    showToast('📧 重置密码链接已发送至注册邮箱');
  });

  // ========== 第三方登录跳转 ==========
  // 微信公众号/开放平台 OAuth: https://open.weixin.qq.com/connect/qrconnect
  // QQ互联 OAuth: https://connect.qq.com/
  // 替换 APP_ID 和 REDIRECT_URI 为实际值即可上线
  var REDIRECT_URI = encodeURIComponent('http://localhost:8080/memo-home.html');
  var WECHAT_APP_ID = 'YOUR_WECHAT_APP_ID';
  var QQ_APP_ID     = 'YOUR_QQ_APP_ID';

  document.getElementById('wechatLogin').addEventListener('click', function() {
    if (WECHAT_APP_ID === 'YOUR_WECHAT_APP_ID') {
      showToast('请配置微信 AppID 后使用');
      return;
    }
    var url = 'https://open.weixin.qq.com/connect/qrconnect'
      + '?appid=' + WECHAT_APP_ID
      + '&redirect_uri=' + REDIRECT_URI
      + '&response_type=code'
      + '&scope=snsapi_login'
      + '&state=' + Date.now()
      + '#wechat_redirect';
    window.location.href = url;
  });

  document.getElementById('qqLogin').addEventListener('click', function() {
    if (QQ_APP_ID === 'YOUR_QQ_APP_ID') {
      showToast('请配置 QQ AppID 后使用');
      return;
    }
    var url = 'https://graph.qq.com/oauth2.0/authorize'
      + '?response_type=code'
      + '&client_id=' + QQ_APP_ID
      + '&redirect_uri=' + REDIRECT_URI
      + '&state=' + Date.now()
      + '&scope=get_user_info';
    window.location.href = url;
  });

  // 立即注册（App 内置浏览器内：postMessage 让 App 切到注册页；Web 端：直接跳转）
  document.getElementById('registerBtn').addEventListener('click', function() {
    if (window.uni && uni.postMessage) {
      uni.postMessage({ data: { type: 'memo_go_register' } });
      return;
    }
    window.location.href = 'register-prototype.html';
  });

  setTimeout(function() { showHint('试试验证码登录和密码登录两种方式', 3000); }, 500);
</script>


</body>
