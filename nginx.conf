# ============================================================
# 地图相册平台 - 静态前端 nginx 配置
#
# 关键机制：
#   1) api.js 默认写死 http://localhost:3000/api/v1，此处用 sub_filter
#      把响应中的该字符串改写为同源相对路径 /api/v1（零源码改动）
#   2) /api/ 反向代理到后端应用：Sealos 应用间通过内网 DNS 互访，
#      格式 <应用名>.<命名空间>.svc（cluster.local 后缀可省略）
#   3) /uploads/ 可选反代：STORAGE_MODE=local 时照片文件由后端静态托管，
#      反向代理后浏览器对照片与 API 同源，无跨域图片加载问题
#
# 部署前必改：把下方两个 proxy_pass 的后端地址替换为实际部署的后端应用名
# 与命名空间（见 docs/Sealos部署指南.md 第 4 章）
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index memo-home.html;

    charset utf-8;

    # ---- 后端 API 反向代理 ----
    # proxy_pass 不带尾路径 → /api/v1/... 原样透传给后端
    location /api/ {
        proxy_pass http://memomap-backend.ns-REPLACE-ME.svc:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # 后端 multer 限制 20MB，此处略放宽
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;    # 上传/批量操作留足时间
    }

    # ---- 照片文件反代（STORAGE_MODE=local 时启用）----
    location /uploads/ {
        proxy_pass http://memomap-backend.ns-REPLACE-ME.svc:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 改写 api.js 中写死的后端地址为同源 /api/v1 ----
    # sub_filter 默认只处理 text/html，需显式声明 javascript
    location = /api.js {
        sub_filter 'http://localhost:3000/api/v1' '/api/v1';
        sub_filter_once on;
        sub_filter_types application/javascript;
    }

    # ---- 静态页面（相对路径跳转，默认即可）----
    location / {
        try_files $uri $uri/ =404;
    }
}
